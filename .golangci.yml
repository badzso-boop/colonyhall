version: "2"

linters:
  default: standard
  enable:
    - depguard
    - errorlint
    - bodyclose
    - misspell
  settings:
    depguard:
      # Layer rules from CLAUDE.md. When a module is added, add its adapter
      # packages to the "adapters" lists below.
      rules:
        platform-is-generic:
          files: ["**/internal/platform/**"]
          deny:
            - pkg: colonyhall/internal/modules
              desc: platform must not depend on business modules
            - pkg: colonyhall/internal/httpx
              desc: platform must not depend on transport helpers
        policy-is-pure:
          files: ["**/internal/policy/**"]
          deny:
            - pkg: colonyhall/internal
              desc: policy is pure functions; pass facts in, do not import other packages
        module-core-has-no-io:
          # model.go, events.go, service.go, store.go, api.go of every module
          files: ["**/internal/modules/*/*.go", "!$test"]
          deny:
            - pkg: github.com/jackc/pgx
              desc: SQL belongs in the module's postgres/ package
            - pkg: net/http
              desc: HTTP belongs in the module's httpapi/ package
            - pkg: github.com/modelcontextprotocol/go-sdk
              desc: MCP belongs in the module's mcptools/ package
            - pkg: github.com/coder/websocket
              desc: WebSocket belongs in internal/gateway
        guard-is-an-api-client:
          # The guard runs on agent machines and talks to the server only over
          # the public REST API.
          files: ["**/internal/guard/**", "**/cmd/colony/**"]
          deny:
            - pkg: colonyhall/internal/modules
              desc: the guard uses the REST API, not server internals
            - pkg: colonyhall/internal/server
            - pkg: colonyhall/internal/eventlog
            - pkg: colonyhall/internal/httpx
        no-foreign-adapters:
          # Modules may use another module's root package (its api.go), never its adapters.
          # A module's own postgres/ package may import its generated postgres/sqlcgen.
          files: ["**/internal/modules/**", "!**/internal/modules/*/postgres/**", "**/internal/gateway/**", "**/internal/mcpserver/**", "**/internal/eventlog/*.go"]
          deny:
            - pkg: colonyhall/internal/modules/identity/postgres
            - pkg: colonyhall/internal/modules/identity/memory
            - pkg: colonyhall/internal/modules/identity/httpapi
            - pkg: colonyhall/internal/modules/identity/mcptools
            - pkg: colonyhall/internal/modules/conversation/postgres
            - pkg: colonyhall/internal/modules/conversation/memory
            - pkg: colonyhall/internal/modules/conversation/httpapi
            - pkg: colonyhall/internal/modules/conversation/mcptools
            - pkg: colonyhall/internal/modules/delivery/postgres
            - pkg: colonyhall/internal/modules/delivery/memory
            - pkg: colonyhall/internal/modules/delivery/httpapi
            - pkg: colonyhall/internal/modules/delivery/mcptools
            - pkg: colonyhall/internal/modules/audit/postgres
            - pkg: colonyhall/internal/modules/audit/memory
            - pkg: colonyhall/internal/modules/audit/httpapi
            - pkg: colonyhall/internal/modules/hosts/postgres
            - pkg: colonyhall/internal/modules/hosts/memory
            - pkg: colonyhall/internal/modules/hosts/httpapi
            - pkg: colonyhall/internal/modules/runs/postgres
            - pkg: colonyhall/internal/modules/runs/memory
            - pkg: colonyhall/internal/modules/runs/httpapi
            - pkg: colonyhall/internal/modules/schedule/postgres
            - pkg: colonyhall/internal/modules/schedule/memory
            - pkg: colonyhall/internal/modules/schedule/httpapi
            - pkg: colonyhall/internal/modules/approval/postgres
            - pkg: colonyhall/internal/modules/approval/memory
            - pkg: colonyhall/internal/modules/approval/httpapi
            - pkg: colonyhall/internal/modules/approval/mcptools
            - pkg: colonyhall/internal/modules/wiki/postgres
            - pkg: colonyhall/internal/modules/wiki/memory
            - pkg: colonyhall/internal/modules/wiki/httpapi
            - pkg: colonyhall/internal/modules/wiki/mcptools
            - pkg: colonyhall/internal/modules/preview/postgres
            - pkg: colonyhall/internal/modules/preview/memory
            - pkg: colonyhall/internal/modules/preview/httpapi
            - pkg: colonyhall/internal/modules/preview/mcptools
            - pkg: colonyhall/internal/server
              desc: only cmd/ may use the composition root

formatters:
  enable:
    - gofmt
