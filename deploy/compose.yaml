# Production stack (homelab): the Colonyhall server only. Postgres is the
# homelab's shared instance (homelab-shared-postgres on the external
# shared-db-net network, own database and least-privilege user); see
# docs/05-homelab-telepites.md.
#
#   cp deploy/.env.prod.example deploy/.env   # fill it in, chmod 600
#   docker compose -f deploy/compose.yaml up -d --build
#
# No development seed: create the first owner with `colonyhall bootstrap`.
name: colonyhall

services:
  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      COLONY_STORE: postgres
      COLONY_DATABASE_URL: ${COLONY_DATABASE_URL:?set COLONY_DATABASE_URL in deploy/.env}
      COLONY_HTTP_ADDR: ":8080"
      # Reached over plain HTTP on Tailscale, so the session cookie cannot be
      # HTTPS-only; set it to 1 if the server ever sits behind HTTPS.
      COLONY_SECURE_COOKIES: ${COLONY_SECURE_COOKIES:-0}
      COLONY_FILES_DIR: /data/files
      COLONY_MAX_UPLOAD_MB: ${COLONY_MAX_UPLOAD_MB:-25}
      COLONY_GITEA_URL: ${COLONY_GITEA_URL:-}
      COLONY_GITEA_PUBLIC_URL: ${COLONY_GITEA_PUBLIC_URL:-}
      COLONY_GITEA_TOKEN: ${COLONY_GITEA_TOKEN:-}
      COLONY_GITEA_WEBHOOK_SECRET: ${COLONY_GITEA_WEBHOOK_SECRET:-}
      COLONY_EMBED_URL: ${COLONY_EMBED_URL:-}
      COLONY_RERANK_URL: ${COLONY_RERANK_URL:-}
      COLONY_RERANK_TOP: ${COLONY_RERANK_TOP:-}
    volumes:
      - files:/data/files
    ports:
      # Only on the homelab's Tailscale address: never 0.0.0.0, never public.
      - "${COLONY_BIND:?set COLONY_BIND to the homelab Tailscale IP}:${COLONY_PORT:-8080}:8080"
    networks:
      - default
      - shared-db-net

volumes:
  files:

networks:
  shared-db-net:
    external: true
