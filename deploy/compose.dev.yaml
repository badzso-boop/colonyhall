# Local development stack: Postgres + Colonyhall with the development seed.
#   make dev     → http://localhost:8080 (admin token is printed in the log)
# Postgres is published on 5433 so it does not clash with a local 5432.
name: colonyhall-dev

services:
  postgres:
    image: pgvector/pgvector:pg17
    # Comes back with Docker (e.g. after a WSL restart); `make down` stops it for good.
    restart: unless-stopped
    environment:
      POSTGRES_USER: colony
      POSTGRES_PASSWORD: colony
      POSTGRES_DB: colony
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U colony -d colony"]
      interval: 2s
      timeout: 3s
      retries: 30

  server:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      COLONY_STORE: postgres
      # colony_app: a role row-level security applies to; `make dev` creates it
      # (deploy/dev-app-role.sql) before the server starts.
      COLONY_DATABASE_URL: postgres://colony_app:colony_app@postgres:5432/colony?sslmode=disable
      COLONY_HTTP_ADDR: ":8080"
      COLONY_DEV_SEED: "1"
      COLONY_SECURE_COOKIES: "0"   # plain HTTP on localhost
      COLONY_FILES_DIR: /data/files
      COLONY_MAX_UPLOAD_MB: "25"
      # Gitea integration (optional): set in deploy/.env (gitignored), see
      # deploy/.env.example. Empty URL = the git module stays off.
      COLONY_GITEA_URL: ${COLONY_GITEA_URL:-}
      COLONY_GITEA_TOKEN: ${COLONY_GITEA_TOKEN:-}
      COLONY_GITEA_PUBLIC_URL: ${COLONY_GITEA_PUBLIC_URL:-}
      # Where this server's source can be downloaded (AGPL section 13); empty: upstream.
      COLONY_SOURCE_URL: ${COLONY_SOURCE_URL:-}
      COLONY_GITEA_WEBHOOK_SECRET: ${COLONY_GITEA_WEBHOOK_SECRET:-}
      COLONY_EMBED_URL: ${COLONY_EMBED_URL:-}
      COLONY_RERANK_URL: ${COLONY_RERANK_URL:-}
      # Round 40: reverse proxies whose X-Forwarded-For is believed, and the
      # addresses never locked out by the login limits (IPs or CIDRs, comma-separated).
      COLONY_TRUSTED_PROXIES: ${COLONY_TRUSTED_PROXIES:-}
      COLONY_LOGIN_ALLOWLIST: ${COLONY_LOGIN_ALLOWLIST:-}
    volumes:
      - filesdata:/data/files
    ports:
      # COLONY_BIND=0.0.0.0 also exposes it on other interfaces (e.g. Tailscale).
      - "${COLONY_BIND:-127.0.0.1}:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  filesdata:
