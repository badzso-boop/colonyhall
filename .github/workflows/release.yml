# Release: on a v* tag, build colony and colonyhall for Linux and macOS
# (amd64, arm64), the server image for GHCR, SHA256SUMS and build provenance
# attestations, and publish them as a GitHub release (docs/15-telepites-terv.md).
# A manual run builds everything without publishing, to try it out.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp (dry run, nothing is published), e.g. v0.0.0-test"
        required: true
        default: v0.0.0-test

permissions:
  contents: write      # create the release
  packages: write      # push the server image
  id-token: write      # sign the attestations
  attestations: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/colonyhall

jobs:
  binaries:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=${{ github.event_name == 'push' && github.ref_name || inputs.version }}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build
        run: scripts/release.sh "${{ steps.v.outputs.version }}" dist
      - name: Attest
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*.tar.gz, dist/install.sh"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish the release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.v.outputs.version }}" dist/* --title "Colonyhall ${{ steps.v.outputs.version }}" --generate-notes --verify-tag

  image:
    runs-on: ubuntu-24.04
    needs: binaries
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ needs.binaries.outputs.version }}
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE }}:${{ needs.binaries.outputs.version }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.binaries.outputs.version }}
      - name: Attest the image
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
