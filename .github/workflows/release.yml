# Release: on a v* tag, build colony and colonyhall for Linux and macOS
# (amd64, arm64), the server image for GHCR, SHA256SUMS and build provenance
# attestations, and publish them as a GitHub release (docs/15-telepites-terv.md).
# A manual run builds everything without publishing, to try it out.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp (dry run, nothing is published), e.g. v0.0.0-test"
        required: true
        default: v0.0.0-test

# Nothing by default; each job asks for what it needs. Third-party actions are
# pinned to a commit (the tag is in the comment) so a moved tag cannot change
# what runs with these permissions.
permissions: {}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/colonyhall

jobs:
  # Round 40: the build runs third-party code (npm install scripts, Go
  # module builds), so it gets no write permission, no signing token and no
  # persisted checkout credentials. Signing and publishing happen in a
  # separate job that runs nothing from the dependencies.
  binaries:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        # The tag or the input reaches the shell only through the environment,
        # and only after it is checked (no workflow-expression injection).
        env:
          RAW: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
        run: |
          case "$RAW" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "version must look like v1.2.3 (got $RAW)" >&2; exit 1 ;;
          esac
          case "$RAW" in *[!A-Za-z0-9.+-]*) echo "unexpected characters in $RAW" >&2; exit 1 ;; esac
          echo "version=$RAW" >> "$GITHUB_OUTPUT"
          case "$RAW" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;; esac
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: scripts/release.sh "$VERSION" dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    runs-on: ubuntu-24.04
    needs: binaries
    if: github.event_name == 'push'
    permissions:
      actions: read        # download the build's artifact
      contents: write      # create the release
      id-token: write      # sign the attestations
      attestations: write
    steps:
      # No checkout and no dependency code: only the built files, the
      # attestation action and the gh CLI run here.
      - name: Download the build
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$REPO" --name dist --dir dist
      - name: Check the checksums
        run: cd dist && sha256sum -c SHA256SUMS
      - name: Attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*.tar.gz, dist/install.sh, dist/SHA256SUMS"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.binaries.outputs.version }}
          PRERELEASE: ${{ needs.binaries.outputs.prerelease }}
        run: |
          flags=""
          [ "$PRERELEASE" = true ] && flags="--prerelease"
          gh release create "$VERSION" dist/* --repo "$REPO" --title "Colonyhall $VERSION" --generate-notes --verify-tag $flags

  image:
    runs-on: ubuntu-24.04
    needs: binaries
    permissions:
      contents: read
      packages: write      # push the server image
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ needs.binaries.outputs.version }}
          push: ${{ github.event_name == 'push' }}
          # latest moves only with a final release, never with a pre-release.
          tags: |
            ${{ env.IMAGE }}:${{ needs.binaries.outputs.version }}
            ${{ needs.binaries.outputs.prerelease == 'false' && format('{0}:latest', env.IMAGE) || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.binaries.outputs.version }}
      - name: Attest the image
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
