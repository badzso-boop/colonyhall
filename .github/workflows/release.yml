# Release: on a v* tag, build colony and colonyhall for Linux and macOS
# (amd64, arm64), the server image for GHCR, SHA256SUMS and build provenance
# attestations, and publish them as a GitHub release (docs/15-telepites-terv.md).
# A manual run builds everything without publishing, to try it out.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp (dry run, nothing is published), e.g. v0.0.0-test"
        required: true
        default: v0.0.0-test

# Nothing by default; each job asks for what it needs. Third-party actions are
# pinned to a commit (the tag is in the comment) so a moved tag cannot change
# what runs with these permissions.
permissions: {}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/colonyhall

jobs:
  binaries:
    runs-on: ubuntu-24.04
    permissions:
      contents: write      # create the release
      id-token: write      # sign the attestations
      attestations: write
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: v
        # The tag or the input reaches the shell only through the environment,
        # and only after it is checked (no workflow-expression injection).
        env:
          RAW: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
        run: |
          case "$RAW" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "version must look like v1.2.3 (got $RAW)" >&2; exit 1 ;;
          esac
          case "$RAW" in *[!A-Za-z0-9.+-]*) echo "unexpected characters in $RAW" >&2; exit 1 ;; esac
          echo "version=$RAW" >> "$GITHUB_OUTPUT"
          case "$RAW" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;; esac
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: scripts/release.sh "$VERSION" dist
      - name: Attest
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: "dist/*.tar.gz, dist/install.sh"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/
      - name: Publish the release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
          PRERELEASE: ${{ steps.v.outputs.prerelease }}
        run: |
          flags=""
          [ "$PRERELEASE" = true ] && flags="--prerelease"
          gh release create "$VERSION" dist/* --title "Colonyhall $VERSION" --generate-notes --verify-tag $flags

  image:
    runs-on: ubuntu-24.04
    needs: binaries
    permissions:
      contents: read
      packages: write      # push the server image
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ needs.binaries.outputs.version }}
          push: ${{ github.event_name == 'push' }}
          # latest moves only with a final release, never with a pre-release.
          tags: |
            ${{ env.IMAGE }}:${{ needs.binaries.outputs.version }}
            ${{ needs.binaries.outputs.prerelease == 'false' && format('{0}:latest', env.IMAGE) || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.binaries.outputs.version }}
      - name: Attest the image
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
