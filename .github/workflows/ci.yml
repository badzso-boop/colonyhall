# Continuous integration (docs/02-muszaki-specifikacio.md, "CI").
#
# Every check is its own job and starts at once; only the image build waits
# for the build job (and the browser tests will, once they exist). A small
# `changes` job decides from the changed paths which jobs a change needs
# (scripts/ci-changes.sh), and `ci-ok` is the one required status check: it
# passes when every needed job passed and the rest were skipped by the filter
# (scripts/ci-ok.sh). Adding a job means adding it to ci-ok's needs and to
# scripts/ci-ok.sh, never changing the branch protection.
#
# The same jobs run locally with `make ci` (scripts/ci.sh).
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Nightly: the race detector and the vulnerability scan only.
    - cron: "17 2 * * *"

# Where the jobs run: the repository variable CI_RUNNER, a JSON array of
# runner labels (the maintainer's homelab runner: ["self-hosted","linux",
# "colonyhall"]). Unset or empty: GitHub-hosted ubuntu-24.04. The workflow
# itself allows the self-hosted runner only while the repository is private
# and never for a pull request from a fork, so a stranger's code can never
# run on that machine, even if the variable is left set. The timeouts allow
# for its two slower cores.
# A newer push to the same branch or pull request cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Nothing by default; every job reads the repository and nothing else. No
# secrets anywhere in this workflow, so pull requests from forks run it as is
# (pull_request, never pull_request_target). Third-party actions are pinned to
# a commit, the tag is in the comment.
permissions: {}

env:
  GOLANGCI_LINT_VERSION: v2.15.0
  NODE_VERSION: 22

jobs:
  changes:
    runs-on: ${{ (vars.CI_RUNNER && github.event.repository.private && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON(vars.CI_RUNNER) || 'ubuntu-24.04' }}
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      go: ${{ steps.filter.outputs.go }}
      web: ${{ steps.filter.outputs.web }}
      devpage: ${{ steps.filter.outputs.devpage }}
      shell: ${{ steps.filter.outputs.shell }}
      install: ${{ steps.filter.outputs.install }}
      actions: ${{ steps.filter.outputs.actions }}
      gen: ${{ steps.filter.outputs.gen }}
      build: ${{ steps.filter.outputs.build }}
      docker: ${{ steps.filter.outputs.docker }}
      race: ${{ steps.filter.outputs.race }}
      vuln: ${{ steps.filter.outputs.vuln }}
      browser: ${{ steps.filter.outputs.browser }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: filter
        # Commit ids reach the shell through the environment only.
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.sha }}
        run: |
          case "$EVENT" in
            workflow_dispatch) mode="all" ;;
            schedule) mode="nightly" ;;
            pull_request) mode="pr"; range="$BASE...$HEAD" ;;
            push) mode="push"; range="$BEFORE..$HEAD" ;;
            *) mode="all" ;;
          esac
          files=""
          if [ -n "${range:-}" ]; then
            # A new branch or a force push has no usable "before": run all.
            if ! files=$(git diff --name-only "$range"); then mode="all"; fi
          fi
          echo "mode: $mode"; printf '%s\n' "$files" | sed 's/^/  /'
          printf '%s\n' "$files" | scripts/ci-changes.sh "$mode" | tee -a "$GITHUB_OUTPUT"

  go-test:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ${{ (vars.CI_RUNNER && github.event.repository.private && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON(vars.CI_RUNNER) || 'ubuntu-24.04' }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # A self-hosted runner keeps its module cache between jobs.
          cache: ${{ runner.environment == 'github-hosted' }}
      - name: Enable the sandbox tests (bwrap)
        # A self-hosted runner has bwrap installed and no sudo.
        if: runner.environment == 'github-hosted'
        # The guard's sandbox tests skip themselves without a working bwrap,
        # and Ubuntu 24.04 blocks unprivileged user namespaces by default.
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --unshare-all --bind / / true
      - run: make test-unit

  go-e2e:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ${{ (vars.CI_RUNNER && github.event.repository.private && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON(vars.CI_RUNNER) || 'ubuntu-24.04' }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # A self-hosted runner keeps its module cache between jobs.
          cache: ${{ runner.environment == 'github-hosted' }}
      - name: Enable the sandbox tests (bwrap)
        # A self-hosted runner has bwrap installed and no sudo.
        if: runner.environment == 'github-hosted'
        # The guard's sandbox tests skip themselves without a working bwrap,
        # and Ubuntu 24.04 blocks unprivileged user namespaces by default.
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --unshare-all --bind / / true
      - run: make test-e2e

  # The slowest Go job: on pushes to main and nightly, not on every pull
  # request push (scripts/ci-changes.sh, race).
  go-race:
    needs: changes
    if: needs.changes.outputs.race == 'true'
    runs-on: ${{ (vars.CI_RUNNER && github.event.repository.private && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON(vars.CI_RUNNER) || 'ubuntu-24.04' }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # A self-hosted runner keeps its module cache between jobs.
          cache: ${{ runner.environment == 'github-hosted' }}
      - name: Enable the sandbox tests (bwrap)
        # A self-hosted runner has bwrap installed and no sudo.
        if: runner.environment == 'github-hosted'
        # The guard's sandbox tests skip themselves without a working bwrap,
        # and Ubuntu 24.04 blocks unprivileged user namespaces by default.
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --unshare-all --bind / / true
      - run: make test-race

  go-pg:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ${{ (vars.CI_RUNNER && github.event.repository.private && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON(vars.CI_RUNNER) || 'ubuntu-24.04' }}
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      # The dev stack's image (deploy/compose.dev.yaml); the pgvector image
      # once the search round needs it.
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: colony
          POSTGRES_PASSWORD: colony
          POSTGRES_DB: colony_test
        # A random host port: a self-hosted runner's machine may run its own
        # Postgres on 5432.
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U colony -d colony_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # A self-hosted runner keeps its module cache between jobs.
          cache: ${{ runner.environment == 'github-hosted' }}
      - run: make test-pg TEST_DB='postgres://colony:colony@localhost:${{ job.services.postgres.ports['5432'] }}/colony_test?sslmode=disable'

  go-lint:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ${{ (vars.CI_RUNNER && github.event.repository.private && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON(vars.CI_RUNNER) || 'ubuntu-24.04' }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # A self-hosted runner keeps its module cache between jobs.
          cache: ${{ runner.environment == 'github-hosted' }}
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

  gen-check:
    needs: changes
    if: needs.changes.outputs.gen == 'true'
    runs-on: ${{ (vars.CI_RUNNER && github.event.repository.private && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON(vars.CI_RUNNER) || 'ubuntu-24.04' }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # A self-hosted runner keeps its module cache between jobs.
          cache: ${{ runner.environment == 'github-hosted' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      # oapi-codegen (go tool), openapi-typescript (npm), sqlc (pinned image).
      - run: make gen-check

  web-typecheck:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ${{ (vars.CI_RUNNER && github.event.repository.private && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON(vars.CI_RUNNER) || 'ubuntu-24.04' }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make web-typecheck

  web-lint:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ${{ (vars.CI_RUNNER && github.event.repository.private && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON(vars.CI_RUNNER) || 'ubuntu-24.04' }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make web-lint

  # Vitest. One shard today: on a runner the whole suite takes about 40 s
  # with 2 workers, less than a shard job's own set-up costs. Raise `shard`
  # and SHARDS together when it grows past a few minutes
  # (round 42 has the measurements).
  web-test:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ${{ (vars.CI_RUNNER && github.event.repository.private && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON(vars.CI_RUNNER) || 'ubuntu-24.04' }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - env:
          SHARD: ${{ matrix.shard }}
          SHARDS: 1
        # vite.config.ts takes a quarter of the cores (for a busy WSL host);
        # a runner has only this job, so use them all.
        run: make web-vitest VITEST_ARGS="--shard=$SHARD/$SHARDS --maxWorkers=100%"

  devpage-test:
    needs: changes
    if: needs.changes.outputs.devpage == 'true'
    runs-on: ${{ (vars.CI_RUNNER && github.event.repository.private && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON(vars.CI_RUNNER) || 'ubuntu-24.04' }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: make test-devpage

  shellcheck:
    needs: changes
    if: needs.changes.outputs.shell == 'true'
    runs-on: ${{ (vars.CI_RUNNER && github.event.repository.private && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON(vars.CI_RUNNER) || 'ubuntu-24.04' }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make shellcheck

  # No secrets and no private infrastructure details (addresses, host and
  # user names) in the tracked files: on every run, docs-only changes too.
  privacy:
    runs-on: ${{ (vars.CI_RUNNER && github.event.repository.private && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON(vars.CI_RUNNER) || 'ubuntu-24.04' }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make privacy

  # The workflows themselves, and the tests of the CI's own scripts.
  actionlint:
    needs: changes
    if: needs.changes.outputs.actions == 'true'
    runs-on: ${{ (vars.CI_RUNNER && github.event.repository.private && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON(vars.CI_RUNNER) || 'ubuntu-24.04' }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make actionlint ci-selftest

  vuln:
    needs: changes
    if: needs.changes.outputs.vuln == 'true'
    runs-on: ${{ (vars.CI_RUNNER && github.event.repository.private && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON(vars.CI_RUNNER) || 'ubuntu-24.04' }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # A self-hosted runner keeps its module cache between jobs.
          cache: ${{ runner.environment == 'github-hosted' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: make vuln

  # install.sh in Debian, Ubuntu and Fedora containers. It needs no build
  # artifact (the tests serve a fake release), so it starts at once.
  install-test:
    needs: changes
    if: needs.changes.outputs.install == 'true'
    runs-on: ${{ (vars.CI_RUNNER && github.event.repository.private && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON(vars.CI_RUNNER) || 'ubuntu-24.04' }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # A self-hosted runner keeps its module cache between jobs.
          cache: ${{ runner.environment == 'github-hosted' }}
      - run: make test-install

  # The PWA build and the binaries with the real embedded web/dist. Starts at
  # once (it does not wait for the tests); the jobs after it use its output.
  build:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ${{ (vars.CI_RUNNER && github.event.repository.private && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON(vars.CI_RUNNER) || 'ubuntu-24.04' }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # A self-hosted runner keeps its module cache between jobs.
          cache: ${{ runner.environment == 'github-hosted' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make web build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries
          path: bin/
          retention-days: 1

  # deploy/Dockerfile still builds (no push, one platform).
  docker-image:
    needs: [changes, build]
    if: needs.changes.outputs.docker == 'true'
    runs-on: ${{ (vars.CI_RUNNER && github.event.repository.private && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON(vars.CI_RUNNER) || 'ubuntu-24.04' }}
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # On a self-hosted runner the build uses the machine's Docker and its
      # layer cache; the GitHub Actions cache service answered it with an
      # HTML error page (2026-11-14), and a local cache needs no upload.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: ${{ runner.environment == 'github-hosted' && 'docker-container' || 'docker' }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: ${{ runner.environment == 'github-hosted' && 'type=gha' || '' }}
          cache-to: ${{ runner.environment == 'github-hosted' && 'type=gha,mode=max' || '' }}

  # Browser end-to-end tests: not written yet (docs/02-muszaki-specifikacio.md,
  # "CI", has the plan). Switched on by `browser=$build` in
  # scripts/ci-changes.sh; ci-ok already expects them then.
  e2e-browser:
    needs: [changes, build]
    if: needs.changes.outputs.browser == 'true'
    runs-on: ${{ (vars.CI_RUNNER && github.event.repository.private && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON(vars.CI_RUNNER) || 'ubuntu-24.04' }}
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - run: |
          echo "TODO: download the binaries artifact, start colonyhall with memory stores and"
          echo "the dev seed, run the Playwright smoke paths, upload traces on failure."
          exit 1

  # The one required status check.
  ci-ok:
    needs:
      - changes
      - privacy
      - go-test
      - go-e2e
      - go-race
      - go-pg
      - go-lint
      - gen-check
      - web-typecheck
      - web-lint
      - web-test
      - devpage-test
      - shellcheck
      - actionlint
      - vuln
      - build
      - install-test
      - docker-image
      - e2e-browser
    if: always()
    runs-on: ${{ (vars.CI_RUNNER && github.event.repository.private && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON(vars.CI_RUNNER) || 'ubuntu-24.04' }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: scripts/ci-ok.sh
