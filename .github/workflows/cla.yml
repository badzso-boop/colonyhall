# The CLA check (CLA.md), with contributor-assistant/github-action: no
# external service and no extra secret; the signatures are stored as JSON
# on the `cla-signatures` branch of this repository.
#
# NOT ENABLED YET: it only runs on manual dispatch, where it does nothing
# useful. To enable it (the maintainer does this when the repository goes
# public):
#   1. create the `cla-signatures` branch (empty is fine) and exempt it from
#      the branch protection, so the action can commit to it;
#   2. replace the `on:` block below with:
#        on:
#          issue_comment:
#            types: [created]
#          pull_request_target:
#            types: [opened, closed, synchronize]
#   3. make "CLA" a required check on main next to ci-ok.
# pull_request_target runs with the base branch's code and a write token: this
# job never checks out or runs the pull request's code, and must not.
name: CLA

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: write # the signatures branch
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch'
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/${{ github.repository }}/blob/main/CLA.md
          branch: cla-signatures
          allowlist: badzso-boop,dependabot[bot]
          custom-notsigned-prcomment: >-
            Thank you for your contribution. Before it can be merged, please read the
            [Colonyhall Contributor License Agreement](https://github.com/${{ github.repository }}/blob/main/CLA.md)
            and sign it by commenting on this pull request with the sentence below. You only sign once.
