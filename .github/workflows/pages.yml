# Builds site/ and deploys it to GitHub Pages. NOT ENABLED: manual dispatch
# only, until the maintainer turns Pages on (Settings -> Pages -> GitHub
# Actions) and the site's design is approved (docs/17, round 48 part 5).
name: pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm --prefix site run build
      # Lighthouse, mobile profile (docs/18, section 8): the job fails below
      # Performance 90, Accessibility 100, Best Practices 95, SEO 95, or over
      # LCP 2.5 s, CLS 0.05, TBT 200 ms. Reports stay in the job (no upload
      # to a third party).
      - name: Lighthouse
        run: npx --yes @lhci/cli@0.16.1 autorun --config=site/lighthouserc.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: lighthouse
          path: site/.lighthouseci
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
