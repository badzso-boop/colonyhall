# Builds site/ and deploys it to GitHub Pages. NOT ENABLED: manual dispatch
# only, until the maintainer turns Pages on (Settings -> Pages -> GitHub
# Actions) and the site's design is approved (docs/17, round 48 part 5).
name: pages

on:
  workflow_dispatch:

# Only the deploy job may write to Pages; the build job runs third-party
# npm code (Lighthouse CI) and gets read access alone.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read # configure-pages reads the Pages settings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm --prefix site run build
        # Our own cookieless visit counter (docs/18): the addresses are
        # repository variables, not committed; unset = no counter.
        env:
          SITE_ANALYTICS_SCRIPT: ${{ vars.SITE_ANALYTICS_SCRIPT }}
          SITE_ANALYTICS_WEBSITE_ID: ${{ vars.SITE_ANALYTICS_WEBSITE_ID }}
          SITE_ANALYTICS_DOMAINS: ${{ vars.SITE_ANALYTICS_DOMAINS }}
      # The site is packed for Pages before Lighthouse runs (round 40):
      # Lighthouse CI is third-party code fetched at run time and must not
      # be able to change what gets deployed. A Lighthouse failure still
      # fails the job, so the deploy does not run.
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist
      # Lighthouse, mobile profile (docs/18, section 8): the job fails below
      # Performance 90, Accessibility 100, Best Practices 95, SEO 95, or over
      # LCP 2.5 s, CLS 0.05, TBT 200 ms. Reports stay in the job (no upload
      # to a third party).
      - name: Lighthouse
        run: npx --yes @lhci/cli@0.16.1 autorun --config=site/lighthouserc.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lighthouse
          path: site/.lighthouseci
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
