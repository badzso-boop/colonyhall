# Dependency updates (round 40). Weekly, grouped so each ecosystem comes as
# one pull request (security updates still arrive on their own). The pull
# requests run the normal CI; nothing merges automatically.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      go-modules:
        patterns: ["*"]

  - package-ecosystem: npm
    directories: [/web, /site]
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      web-runtime:
        dependency-type: production
        patterns: ["*"]
      web-dev:
        dependency-type: development
        patterns: ["*"]

  # The workflows pin every action by commit SHA; Dependabot moves the SHA
  # and the version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: [/deploy, /deploy/embed]
    schedule: { interval: weekly, day: monday }
    # Node: only LTS lines, chosen by hand (Dependabot offered 22 -> 25, an
    # odd, short-lived release). Python: by hand, after checking that the
    # model server's wheels (onnxruntime) exist for the new version
    # (it offered 3.12 -> 3.15). Patch updates still come. (2026-11-14)
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      base-images:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directories: [/deploy, /deploy/rerank]
    schedule: { interval: weekly, day: monday }
    groups:
      compose-images:
        patterns: ["*"]
