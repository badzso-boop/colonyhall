name: Feature request
description: An idea or a missing capability.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want to do, and what stops you today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: How you imagine it working. Rough is fine.
  - type: textarea
    id: alternatives
    attributes:
      label: What have you tried instead?
