# sqlc generates type-safe Go from the SQL in each postgres/queries.sql.
# Run with `make gen` (uses the pinned sqlc Docker image).
# The first entry defines the shared Go options (&go); the others reuse them.
version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: internal/eventlog/postgres/queries.sql
    gen:
      go: &go
        package: sqlcgen
        out: internal/eventlog/postgres/sqlcgen
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type: { import: github.com/google/uuid, type: UUID, pointer: true }
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type: { import: time, type: Time, pointer: true }
          # pgvector columns are written and read as text ('[0.1,0.2,…]'):
          # no pgvector Go dependency in every generated package.
          - db_type: vector
            go_type: string
          - db_type: vector
            nullable: true
            go_type: { type: string, pointer: true }
  - engine: postgresql
    schema: migrations
    queries: internal/modules/identity/postgres/queries.sql
    gen: { go: { <<: *go, out: internal/modules/identity/postgres/sqlcgen } }
  - engine: postgresql
    schema: migrations
