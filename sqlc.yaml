# sqlc generates type-safe Go from the SQL in each postgres/queries.sql.
# Run with `make gen` (uses the pinned sqlc Docker image).
# The first entry defines the shared Go options (&go); the others reuse them.
version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: internal/eventlog/postgres/queries.sql
    gen:
      go: &go
        package: sqlcgen
        out: internal/eventlog/postgres/sqlcgen
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type: { import: github.com/google/uuid, type: UUID, pointer: true }
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type: { import: time, type: Time, pointer: true }
  - engine: postgresql
    schema: migrations
    queries: internal/modules/identity/postgres/queries.sql
    gen: { go: { <<: *go, out: internal/modules/identity/postgres/sqlcgen } }
  - engine: postgresql
    schema: migrations
    queries: internal/modules/conversation/postgres/queries.sql
    gen: { go: { <<: *go, out: internal/modules/conversation/postgres/sqlcgen } }
  - engine: postgresql
    schema: migrations
    queries: internal/modules/delivery/postgres/queries.sql
    gen: { go: { <<: *go, out: internal/modules/delivery/postgres/sqlcgen } }
  - engine: postgresql
    schema: migrations
    queries: internal/modules/audit/postgres/queries.sql
    gen: { go: { <<: *go, out: internal/modules/audit/postgres/sqlcgen } }
  - engine: postgresql
    schema: migrations
    queries: internal/modules/hosts/postgres/queries.sql
    gen: { go: { <<: *go, out: internal/modules/hosts/postgres/sqlcgen } }
  - engine: postgresql
    schema: migrations
    queries: internal/modules/runs/postgres/queries.sql
    gen: { go: { <<: *go, out: internal/modules/runs/postgres/sqlcgen } }
  - engine: postgresql
    schema: migrations
    queries: internal/modules/schedule/postgres/queries.sql
    gen: { go: { <<: *go, out: internal/modules/schedule/postgres/sqlcgen } }
  - engine: postgresql
    schema: migrations
    queries: internal/modules/approval/postgres/queries.sql
    gen: { go: { <<: *go, out: internal/modules/approval/postgres/sqlcgen } }
  - engine: postgresql
    schema: migrations
    queries: internal/modules/wiki/postgres/queries.sql
    gen: { go: { <<: *go, out: internal/modules/wiki/postgres/sqlcgen } }
  - engine: postgresql
    schema: migrations
    queries: internal/modules/question/postgres/queries.sql
    gen: { go: { <<: *go, out: internal/modules/question/postgres/sqlcgen } }
  - engine: postgresql
    schema: migrations
    queries: internal/modules/files/postgres/queries.sql
    gen: { go: { <<: *go, out: internal/modules/files/postgres/sqlcgen } }
