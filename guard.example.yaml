# colony guard config. Copy to guard.yaml (gitignored).
#
# Host mode (normal): pair the machine once, install the systemd service,
# then the server decides which agents run here and which folders they may
# use, within the roots below.
#   colony guard enroll -server http://localhost:8080 -code XXXX-XXXX-XXXX -name my-machine
#   colony guard install -config guard.yaml
#   colony guard -config guard.yaml
server: http://localhost:8080
host_token_file: ~/.config/colonyhall/host.token

# The ONLY folders agents on this machine can ever be given. The server
# cannot extend this list; every granted path is checked against it.
roots:
  - /mnt/g/Projects

# Shared secrets exchange directory (optional).
# The guard checks on start that this folder exists and is writable.
# When usable, direct-mode agents receive secrets through <exchange_dir>/<project>/
# with mode 0600 instead of in chat.
# exchange_dir: ~/colonyhall-exchange

# Claude Code login of this machine (round 38). The machine's owner sets it
# from the PWA (Machines page, "Claude-belépés"): the token from
# `claude setup-token`, for their own subscription. Every Claude Code run of
# this guard gets it as CLAUDE_CODE_OAUTH_TOKEN; without it the runs use the
# machine user's own login. Default: claude.token next to host_token_file.
# The file is 0600 and agents can never read it.
# claude_token_file: ~/.config/colonyhall/claude.token

# Each agent gets its own folder here (work dir, empty dir for wake-ups).
# The guard's state lives next to it (its parent folder): usage checks,
# terminals, preview override files, the proxy and web_read sockets.
# The default derives from the guard user's HOME, so a second guard under
# another Linux user needs no change here.
# sandbox_dir: ~/.local/share/colonyhall/sandbox

# Work runs happen inside bwrap. Without bwrap, work is refused unless
# you set this to false.
# require_sandbox: true

# Sandbox network isolation:
# filtered: (default) sandbox has no network routes; traffic goes through an allowlist HTTP proxy
# log:      allow everything through the proxy, but log newly seen host:port (used to discover endpoints)
# open:     no network unshare or proxy (shares host network, legacy behaviour)
# sandbox_network: filtered

# Additional allowed host:port entries for sandboxed agents on this machine.
# Matching is exact host and port, except an explicit leading *. (e.g. *.example.com:443).
# sandbox_allow:
#   - api.example.com:443
#   - "*.github.com:443"

# Allow agents with sandbox: false (e.g. direct mode) to run on this machine.
# Default false: the server cannot turn off the sandbox unless this is true.
# Set to true if you run your own trusted agents directly against your code tree
# without bubblewrap isolation.
# allow_unsandboxed: true

# Web-olvasás szűrők (csak allow_web_read engedélyezett sandboxos futásokhoz):
# web_read_allow: ha be van állítva, CSAK ezek a hostok tölthetők le (pontos egyezés vagy *. előtag).
# web_read_deny:  mindig megtagadott hostok, az allow lista előtt ellenőrizve.
# Ha egyik sincs megadva: bármely publikus weboldal elérhető. Privát/belső IP címek sosem érhetők el.
# web_read_allow:
#   - "*.go.dev"
#   - "docs.python.org"
# web_read_deny:
#   - "unwanted.example.com"

# Previews (docker compose, full-access agents): host ports come from this
# range, 10 per agent. A port another program holds is skipped. Two guards
# on one machine must get ranges that do not overlap, e.g. 41000-41999 and
# 42000-42999.
# preview_ports: 41000-41999
# preview_host: 127.0.0.1

# tmux socket name of the agents' terminals (tmux -L). tmux keeps sockets
# per Linux user ($TMUX_TMPDIR/tmux-<uid>/), so guards of different users
# never share one; only two guards of the same user need different names.
# The attach line on the web page assumes the default.
# tmux_socket: colonyhall

# At most this many client runs (decide, work, direct, summaries) of all
# agents on this machine at once; for a small machine. The others wait:
# their messages stay in the inbox (no attempt is counted) and each thread
# gets one silent note "⏳ sorban állok, a gép most foglalt"; a waiting
# agent starts as soon as a run ends. The usage check (/usage) and agent
# terminals do not count. Default 0: no limit.
# max_concurrent_runs: 2

# commands: { claude-code: claude, antigravity: agy }
# Inactivity and duration caps for direct and work runs:
# idle_timeout: kill when client produces no stream output for this duration (default 15m)
# max_run: absolute maximum run duration cap (default 4h)
# defaults: { poll: 5s, fallback_poll: 60s, debounce: 3s, batch: 10, decide_timeout: 3m, work_timeout: 15m, idle_timeout: 15m, max_run: 4h }

# Claude Code rate limit reserve and warning thresholds (guard-wide):
# rate_limit_reserve: 90  # pause new Claude Code runs at or above 90% utilization (default 90)
# How often to ask claude and agy for their usage (`/usage`, no model call,
# nothing is used up); the answer shows on the Machines and Runs pages, and a
# Claude reading above rate_limit_reserve pauses Claude runs. Default 15m;
# a negative value turns it off.
# usage_poll: 15m
# rate_limit_warn: 80     # show warning colour on UI at or above 80% utilization (default 80)

# --- Agents mode (quick single-machine setup, no pairing) ---------------
# Instead of host_token_file/roots, list agents with their own tokens:
# agents:
#   - name: claude
#     client: claude-code
#     token_env: COLONY_TOKEN_CLAUDE
#     model: haiku            # cheap decision run (~1.7k tokens per wake-up)
#     work_model: sonnet
#     dir: /path/to/worktree
#     allow_work: false
