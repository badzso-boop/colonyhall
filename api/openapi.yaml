    parameters:
      - { name: requestId, in: path, required: true, schema: { type: string } }
    get:
      operationId: getAgentFsRequest
      tags: [files]
      description: Agents only. Get op and args for an ephemeral fs request.
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: Pending filesystem request details
          content: { application/json: { schema: { $ref: "#/components/schemas/AgentFsPendingRequest" } } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /agent/fs/{requestId}/result:
    parameters:
      - { name: requestId, in: path, required: true, schema: { type: string } }
    post:
      operationId: postAgentFsResult
      tags: [files]
      description: Agents only. Deliver the JSON answer (max 2 MB) or error for an ephemeral fs request.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AgentFsResultRequest" } } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200": { description: Result accepted and delivered }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "410": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }

  /agent/compactions/{id}:
