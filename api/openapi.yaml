        - { name: group_by, in: query, required: false, schema: { type: string, enum: [agent, host, model], default: agent } }
        - { name: days, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 90, default: 7 } }
        - { name: owner_id, in: query, required: false, description: "The person whose agents ran (round 38). A person who is not an admin always sees only their own agents.", schema: { type: string, format: uuid } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/UsageResponse" } } } }

