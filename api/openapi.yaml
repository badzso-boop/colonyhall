          type: string
          format: uuid
        thread_root_id:
          type: string
          format: uuid
          nullable: true
        agent_a_id:
          type: string
          format: uuid
        agent_a_handle:
          type: string
        agent_b_id:
          type: string
          format: uuid
        agent_b_handle:
          type: string
        delegation_id:
          type: string
          format: uuid
        approved_by:
          type: string
          format: uuid
        approver_handle:
          type: string
        approved_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        effective_expires_at:
          type: string
          format: date-time
        revoked_by:
          type: string
