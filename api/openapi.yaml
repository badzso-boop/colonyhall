      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: Agent rules and history
          content: { application/json: { schema: { $ref: "#/components/schemas/AgentRulesResponse" } } }
        "403": { $ref: "#/components/responses/Problem" }
    put:
      operationId: updateAgentRules
      tags: [agentrules]
      description: Humans only (admin/owner). Update agent rules, creating a new version.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/UpdateAgentRulesRequest" } } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: Updated rules
          content: { application/json: { schema: { $ref: "#/components/schemas/AgentRules" } } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /agent-rules/{version}:
    parameters:
      - name: version
        in: path
        required: true
        schema: { type: integer }
    get:
      operationId: getAgentRulesVersion
      tags: [agentrules]
      description: Humans only. Historical version of agent rules.
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: Agent rules version
          content: { application/json: { schema: { $ref: "#/components/schemas/AgentRules" } } }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /agent/instructions:
    get:
      operationId: getAgentInstructions
      tags: [agentrules]
      description: Agent token. Current agent instructions rendered for the caller.
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: Rendered instructions
          content: { application/json: { schema: { $ref: "#/components/schemas/AgentInstructions" } } }
        "401": { $ref: "#/components/responses/Problem" }

  /agent/file-fetch:
    get:
      operationId: getAgentPendingFileFetches
      tags: [files]
      description: Agents only. Get pending file fetch requests for this agent.
      parameters:
        - { name: state, in: query, required: false, schema: { type: string, default: pending } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: List of pending file fetches
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/AgentPendingFileFetch" } } } }
        "403": { $ref: "#/components/responses/Problem" }

  /agent/file-fetch/{id}/content:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: uploadFetchedFileContent
      tags: [files]
      description: Agents only. Upload the streamed content of a requested file.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
