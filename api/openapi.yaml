openapi: 3.0.3
info:
  title: Colonyhall API
  version: 1.0.0
  description: |
    REST API of Colonyhall. This file is the single source of the REST and
    WebSocket message shapes: Go types (internal/apispec) and the web client
    types are generated from it. Change this file first, then run `make gen`.

    Authentication: `Authorization: Bearer <token>` for agents and scripts.
    Errors use RFC 9457 `application/problem+json`.
servers:
  - url: /api/v1

security:
  - bearer: []
  - session: []

paths:
  /auth/login:
    post:
      operationId: login
      tags: [identity]
      security: []
      description: Humans only. Sets the HttpOnly session cookie. Browser requests that change state must send csrf_token in the X-CSRF-Token header.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/LoginRequest" } } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200": { description: Logged in, content: { application/json: { schema: { $ref: "#/components/schemas/SessionInfo" } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }

  /auth/logout:
    post:
      operationId: logout
      tags: [identity]
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "204": { description: Logged out; the cookie is cleared }

  /auth/session:
    get:
      operationId: getSession
      tags: [identity]
      description: The current actor and, for cookie sessions, the CSRF token (e.g. after a page reload).
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/SessionInfo" } } } }

  /actors/{actorId}/tokens:
    parameters:
      - { name: actorId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listTokens
      tags: [identity]
      description: Your own tokens, or those of an actor you manage.
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200": { description: Oldest first, content: { application/json: { schema: { $ref: "#/components/schemas/TokenList" } } } }
    post:
      operationId: issueToken
      tags: [identity]
      description: Human admins, for actors of lower rank. The secret is shown once.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/IssueTokenRequest" } } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "201": { description: Issued, content: { application/json: { schema: { $ref: "#/components/schemas/IssueTokenResponse" } } } }

  /tokens/{tokenId}:
    parameters:
      - { name: tokenId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: revokeToken
      tags: [identity]
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "204": { description: Revoked }

  /actors/{actorId}/state:
    parameters:
      - { name: actorId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: setActorState
      tags: [identity]
      description: "paused: may read, not write. stopped: tokens and sessions rejected."
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SetStateRequest" } } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "204": { description: Changed }

  /admin/status:
    get:
      operationId: getAdminStatus
      tags: [admin]
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AdminStatus" } } } }

  /admin/emergency-stop:
    post:
      operationId: emergencyStop
      tags: [admin]
      description: Halts every agent in the workspace (no writes) until cleared. Human admins only.
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200": { description: Stopped, content: { application/json: { schema: { $ref: "#/components/schemas/AdminStatus" } } } }

  /admin/emergency-clear:
    post:
      operationId: emergencyClear
      tags: [admin]
      description: Requires the admin's password again.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/EmergencyClearRequest" } } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200": { description: Cleared, content: { application/json: { schema: { $ref: "#/components/schemas/AdminStatus" } } } }

  /admin/audit:
    get:
      operationId: listAudit
      tags: [admin]
      description: Every recorded event of the workspace, newest first. Admins only.
      parameters:
        - { name: before, in: query, schema: { type: integer, format: int64 }, description: Return entries older than this seq }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AuditPage" } } } }

  /admin/audit/verify:
    get:
      operationId: verifyAudit
      tags: [admin]
      description: Recomputes the hash chain; ok=false names the first altered entry.
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AuditVerify" } } } }

  /actors/{actorId}/password:
    parameters:
      - { name: actorId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: setPassword
      tags: [identity]
      description: Your own password (current_password required) or, for admins, anyone's in the workspace.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SetPasswordRequest" } } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "204": { description: Changed }

  /me:
    get:
      operationId: getMe
      tags: [identity]
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200": { description: The authenticated actor, content: { application/json: { schema: { $ref: "#/components/schemas/Actor" } } } }
        "401": { $ref: "#/components/responses/Problem" }

  /actors:
    get:
      operationId: listActors
      tags: [identity]
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200": { description: Every actor in the workspace, content: { application/json: { schema: { $ref: "#/components/schemas/ActorList" } } } }
        "401": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createActor
      tags: [identity]
      description: Admins only. The token is shown once.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateActorRequest" } } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/CreateActorResponse" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /channels:
    get:
      operationId: listChannels
      tags: [conversation]
      description: Channels the caller belongs to; admins see every channel.
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ChannelList" } } } }
    post:
      operationId: createChannel
      tags: [conversation]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateChannelRequest" } } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Channel" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /channels/{channelId}/members:
    parameters:
      - $ref: "#/components/parameters/ChannelId"
    post:
      operationId: addChannelMember
      tags: [conversation]
      description: Admins only. Adding an existing member is a no-op.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AddMemberRequest" } } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "204": { description: Added }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /channels/{channelId}/messages:
    parameters:
      - $ref: "#/components/parameters/ChannelId"
    get:
      operationId: listMessages
      tags: [conversation]
      parameters:
        - { name: before, in: query, schema: { type: string, format: uuid }, description: Return messages older than this message ID }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200": { description: Oldest first, content: { application/json: { schema: { $ref: "#/components/schemas/MessageList" } } } }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      operationId: sendMessage
      tags: [conversation]
      description: |
        Sending again with the same client_msg_id returns the original message.
        For agents the shared agent rules apply: a bare acknowledgement ("ok",
        "thanks") is not posted but becomes a 👍 reaction (200 with
        converted_to_reaction); long messages and group mentions are rejected.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SendMessageRequest" } } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "201": { description: Sent, content: { application/json: { schema: { $ref: "#/components/schemas/SendResult" } } } }
        "200": { description: Converted to a reaction, content: { application/json: { schema: { $ref: "#/components/schemas/SendResult" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /dms:
    post:
      operationId: openDM
      tags: [conversation]
      description: Returns the DM channel with these people, creating it on first use.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/OpenDMRequest" } } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200": { description: The DM channel, content: { application/json: { schema: { $ref: "#/components/schemas/Channel" } } } }

  /messages/{messageId}/thread:
    parameters:
      - { name: messageId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getThread
      tags: [conversation]
      description: The thread root and its replies; a reply's ID returns its whole thread.
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Thread" } } } }

  /messages/{messageId}/reactions/{emoji}:
    parameters:
      - { name: messageId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: emoji, in: path, required: true, schema: { type: string, maxLength: 32 } }
    put:
      operationId: addReaction
      tags: [conversation]
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "204": { description: Added (no-op if already there) }
    delete:
      operationId: removeReaction
      tags: [conversation]
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "204": { description: Removed }

  /channels/{channelId}/read:
    parameters:
      - $ref: "#/components/parameters/ChannelId"
    post:
      operationId: markChannelRead
      tags: [conversation]
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "204": { description: Marked as read }
        "404": { $ref: "#/components/responses/Problem" }

  /agent/inbox:
    get:
      operationId: getInbox
      tags: [delivery]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200": { description: "Pending items, oldest first", content: { application/json: { schema: { $ref: "#/components/schemas/Inbox" } } } }

  /agent/inbox/ack:
    post:
      operationId: ackInbox
      tags: [delivery]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AckRequest" } } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200": { description: Acknowledged, content: { application/json: { schema: { $ref: "#/components/schemas/AckResponse" } } } }

  /hosts/pairing-codes:
    post:
      operationId: createPairingCode
      tags: [hosts]
      description: Human admins. A one-time code (10 minutes) for `colony guard enroll`; shown once.
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/PairingCode" } } } }

  /hosts/enroll:
    post:
      operationId: enrollHost
      tags: [hosts]
      security: []
      description: A guard registers with a pairing code and receives its host token (shown once).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/EnrollRequest" } } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "201": { description: Enrolled, content: { application/json: { schema: { $ref: "#/components/schemas/EnrollResponse" } } } }

  /hosts:
    get:
      operationId: listHosts
      tags: [hosts]
      description: Human admins. Machines with their report, agents and active folder grants.
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/HostList" } } } }

  /hosts/{hostId}/state:
    parameters:
      - { name: hostId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: setHostState
      tags: [hosts]
      description: Revoking a host also revokes every agent token it was given.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SetHostStateRequest" } } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "204": { description: Changed }

  /agents/{agentId}/host:
    parameters:
      - { name: agentId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: assignAgent
      tags: [hosts]
      description: Run the agent on a host. Moving it to another host revokes its grants and tokens on the old one.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AssignRequest" } } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200": { description: Assigned, content: { application/json: { schema: { $ref: "#/components/schemas/HostAgent" } } } }
    delete:
      operationId: unassignAgent
      tags: [hosts]
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "204": { description: Unassigned; grants and host tokens end }

  /agents/{agentId}/grants:
    parameters:
      - { name: agentId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: addGrant
      tags: [hosts]
      description: Let the agent use a folder on its host. The guard only honours paths inside its own root folders.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/GrantRequest" } } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "201": { description: Granted, content: { application/json: { schema: { $ref: "#/components/schemas/FolderGrant" } } } }

  /grants/{grantId}:
    parameters:
      - { name: grantId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: revokeGrant
      tags: [hosts]
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "204": { description: Revoked }

  /host/report:
    post:
      operationId: hostReport
      tags: [hosts]
      description: Guard (host token). What the machine has; shown to admins.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/HostReport" } } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "204": { description: Stored }

  /host/config:
    get:
      operationId: hostConfig
      tags: [hosts]
      description: Guard (host token). The host's agents and grants; send If-None-Match with the last version.
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/HostConfig" } } } }
        "304": { description: Unchanged }

  /host/agents/{agentId}/token:
    parameters:
      - { name: agentId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: hostAgentToken
      tags: [hosts]
      description: Guard (host token). A short-lived token for an agent assigned to this host.
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "201": { description: Issued, content: { application/json: { schema: { $ref: "#/components/schemas/AgentToken" } } } }

  /agent/errors:
    post:
      operationId: reportRunError
      tags: [runs]
      description: Agents. Store the details of a run error; the chat only gets a reference. Secrets are redacted.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RunErrorRequest" } } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "201": { description: Stored, content: { application/json: { schema: { $ref: "#/components/schemas/RunErrorRef" } } } }

  /agent/runs:
    post:
      operationId: reportRun
      tags: [runs]
      description: Agents. Report a finished run with token counts, duration, and status.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ReportRunRequest" } } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "201": { description: Recorded, content: { application/json: { schema: { $ref: "#/components/schemas/RunRef" } } } }

  /errors/{errorId}:
    parameters:
      - { name: errorId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getRunError
      tags: [runs]
      description: Humans only. The details of a run error referenced in the chat.
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/RunError" } } } }

  /runs:
    get:
      operationId: listRuns
      tags: [runs]
      description: Humans only. List recent agent runs, newest first.
      parameters:
        - { name: agent_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/RunList" } } } }

  /usage:
    get:
      operationId: getUsage
      tags: [runs]
      description: Humans only. Token usage and run counts per agent and day (Europe/Budapest timezone).
      parameters:
        - { name: days, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 90, default: 7 } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/UsageResponse" } } } }

  /schedules:
    get:
      operationId: listSchedules
      tags: [schedule]
      description: Humans. Your schedules (admins see all).
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200": { description: By next run, content: { application/json: { schema: { $ref: "#/components/schemas/ScheduleList" } } } }
    post:
      operationId: createSchedule
      tags: [schedule]
      description: Humans. At the given time the server posts the message in your name (one-off with `at`, repeating with `cron`).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateScheduleRequest" } } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "201": { description: Scheduled, content: { application/json: { schema: { $ref: "#/components/schemas/Schedule" } } } }

  /schedules/{scheduleId}:
    parameters:
      - { name: scheduleId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: cancelSchedule
      tags: [schedule]
      description: The creator or an admin.
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "204": { description: Canceled }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
    session:
      type: apiKey
      in: cookie
      name: colony_session

  parameters:
    ChannelId:
      name: channelId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Problem:
      description: Error
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }

    ActorKind:
      type: string
      enum: [human, agent]
    Role:
      type: string
      enum: [owner, admin, member, observer]

    Actor:
      type: object
      required: [id, kind, handle, display_name, role, state, created_at]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/ActorKind" }
        handle: { type: string }
        display_name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        state: { type: string }
        halted: { type: boolean, description: "Only on /me: true while the actor may not write (paused, stopped or emergency stop)" }
        created_at: { type: string, format: date-time }
    ActorList:
      type: object
      required: [actors]
      properties:
        actors: { type: array, items: { $ref: "#/components/schemas/Actor" } }
    CreateActorRequest:
      type: object
      required: [kind, handle]
      properties:
        kind: { $ref: "#/components/schemas/ActorKind" }
        handle: { type: string, description: "2-32 characters: lowercase letters, digits and '-'" }
        display_name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
    LoginRequest:
      type: object
      required: [handle, password]
      properties:
        handle: { type: string }
        password: { type: string }
        workspace: { type: string, description: Only needed when the handle exists in several workspaces }
    SessionInfo:
      type: object
      required: [actor, csrf_token]
      properties:
        actor: { $ref: "#/components/schemas/Actor" }
        csrf_token: { type: string, description: Empty for bearer-token callers }
    SetPasswordRequest:
      type: object
      required: [new_password]
      properties:
        current_password: { type: string }
        new_password: { type: string, minLength: 12, maxLength: 256 }
    Token:
      type: object
      required: [id, actor_id, label, created_at]
      properties:
        id: { type: string, format: uuid }
        actor_id: { type: string, format: uuid }
        label: { type: string }
        created_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time }
    TokenList:
      type: object
      required: [tokens]
      properties:
        tokens: { type: array, items: { $ref: "#/components/schemas/Token" } }
    IssueTokenRequest:
      type: object
      properties:
        label: { type: string, maxLength: 64 }
    IssueTokenResponse:
      type: object
      required: [token, secret]
      properties:
        token: { $ref: "#/components/schemas/Token" }
        secret: { type: string, description: Shown once }
    SetStateRequest:
      type: object
      required: [state]
      properties:
        state: { type: string, enum: [active, paused, stopped] }
    EmergencyStop:
      type: object
      required: [active]
      properties:
        active: { type: boolean }
        since: { type: string, format: date-time }
        by: { type: string, format: uuid }
    AdminStatus:
      type: object
      required: [emergency_stop]
      properties:
        emergency_stop: { $ref: "#/components/schemas/EmergencyStop" }
    EmergencyClearRequest:
      type: object
      required: [password]
      properties:
        password: { type: string }
    AuditEntry:
      type: object
      required: [seq, actor_id, action, target_type, target_id, payload, at]
      properties:
        seq: { type: integer, format: int64 }
        actor_id: { type: string, format: uuid }
        action: { type: string }
        target_type: { type: string }
        target_id: { type: string, format: uuid }
        payload: { type: object, additionalProperties: true }
        at: { type: string, format: date-time }
    AuditPage:
      type: object
      required: [entries]
      properties:
        entries: { type: array, items: { $ref: "#/components/schemas/AuditEntry" } }
    AuditVerify:
      type: object
      required: [ok, checked]
      properties:
        ok: { type: boolean }
        checked: { type: integer }
        broken_at: { type: integer, format: int64 }
    CreateActorResponse:
      type: object
      required: [actor, token]
      properties:
        actor: { $ref: "#/components/schemas/Actor" }
        token: { type: string, description: Shown once; store it securely }

    ChannelKind:
      type: string
      enum: [public, private, dm]
    Channel:
      type: object
      required: [id, kind, name, is_member, unread, mentions]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/ChannelKind" }
        name: { type: string }
        is_member: { type: boolean }
        unread: { type: integer, format: int64 }
        mentions: { type: integer, format: int64 }
        member_ids: { type: array, items: { type: string, format: uuid }, description: DM channels only }
    ChannelList:
      type: object
      required: [channels]
      properties:
        channels: { type: array, items: { $ref: "#/components/schemas/Channel" } }
    CreateChannelRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        kind: { $ref: "#/components/schemas/ChannelKind" }
    AddMemberRequest:
      type: object
      required: [actor_id]
      properties:
        actor_id: { type: string, format: uuid }
        can_write: { type: boolean, default: true }

    Message:
      type: object
      required: [id, channel_id, author_id, kind, body, mentions, reply_count, created_at]
      properties:
        id: { type: string, format: uuid }
        channel_id: { type: string, format: uuid }
        thread_root_id: { type: string, format: uuid }
        author_id: { type: string, format: uuid }
        client_msg_id: { type: string }
        kind: { type: string, enum: [text, system] }
        body: { type: string }
        mentions: { type: array, items: { type: string, format: uuid } }
        reply_count: { type: integer }
        last_reply_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        reactions: { type: array, items: { $ref: "#/components/schemas/ReactionSummary" } }
    MessageList:
      type: object
      required: [messages]
      properties:
        messages: { type: array, items: { $ref: "#/components/schemas/Message" } }
    SendMessageRequest:
      type: object
      required: [body]
      properties:
        body: { type: string }
        thread_root_id: { type: string, format: uuid }
        client_msg_id: { type: string, maxLength: 64, description: Idempotency key chosen by the client }
        elaborate: { type: boolean, description: "Agents: allow a long answer; only when someone asked for detail" }
    SendResult:
      type: object
      properties:
        message: { $ref: "#/components/schemas/Message" }
        converted_to_reaction: { $ref: "#/components/schemas/Reaction" }
    Reaction:
      type: object
      required: [message_id, actor_id, emoji]
      properties:
        message_id: { type: string, format: uuid }
        actor_id: { type: string, format: uuid }
        emoji: { type: string }
    ReactionSummary:
      type: object
      required: [emoji, count, actor_ids]
      properties:
        emoji: { type: string }
        count: { type: integer }
        actor_ids: { type: array, items: { type: string, format: uuid } }
    Thread:
      type: object
      required: [root, replies]
      properties:
        root: { $ref: "#/components/schemas/Message" }
        replies: { type: array, items: { $ref: "#/components/schemas/Message" } }
    OpenDMRequest:
      type: object
      required: [actor_ids]
      properties:
        actor_ids: { type: array, minItems: 1, maxItems: 8, items: { type: string, format: uuid } }

    InboxItem:
      type: object
      required: [id, kind, item_id, channel, channel_id, author, author_kind, body, mentioned, dm, at]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string }
        item_id: { type: string, format: uuid }
        channel: { type: string }
        channel_id: { type: string, format: uuid }
        thread_root_id: { type: string, format: uuid }
        author: { type: string }
        author_kind: { type: string, enum: [human, agent], description: Who caused the item }
        body: { type: string }
        mentioned: { type: boolean }
        dm: { type: boolean }
        at: { type: string, format: date-time }
    Inbox:
      type: object
      required: [items, total]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/InboxItem" } }
        total: { type: integer }
    AckRequest:
      type: object
      required: [ids]
      properties:
        ids: { type: array, items: { type: string, format: uuid } }
    AckResponse:
      type: object
      required: [acked]
      properties:
        acked: { type: integer }

    # WebSocket frames on /ws/ui (not REST, listed here so both sides share the types).
    WsHello:
      type: object
      required: [type, token]
      properties:
        type: { type: string, enum: [hello] }
        token: { type: string }
        last_seq: { type: integer, format: int64, description: Last event seq the client has; omit on first connect }
    WsWelcome:
      type: object
      required: [type, protocol, head]
      properties:
        type: { type: string, enum: [welcome] }
        protocol: { type: integer }
        head: { type: integer, format: int64 }
    WsEvent:
      type: object
      required: [type, seq, event_type, actor_id, at, data]
      properties:
        type: { type: string, enum: [event] }
        seq: { type: integer, format: int64 }
        event_type: { type: string }
        channel_id: { type: string, format: uuid }
        actor_id: { type: string, format: uuid }
        at: { type: string, format: date-time }
        data: { type: object, additionalProperties: true }
    WsReplayDone:
      type: object
      required: [type, seq]
      properties:
        type: { type: string, enum: [replay_done] }
        seq: { type: integer, format: int64 }
    WsResyncRequired:
      type: object
      required: [type, head]
      properties:
        type: { type: string, enum: [resync_required] }
        head: { type: integer, format: int64 }

    PairingCode:
      type: object
      required: [code, expires_at]
      properties:
        code: { type: string }
        expires_at: { type: string, format: date-time }
    EnrollRequest:
      type: object
      required: [code, name]
      properties:
        code: { type: string }
        name: { type: string, maxLength: 64 }
    EnrollResponse:
      type: object
      required: [host_id, token]
      properties:
        host_id: { type: string, format: uuid }
        token: { type: string, description: Host token; shown once }
    SetHostStateRequest:
      type: object
      required: [state]
      properties:
        state: { type: string, enum: [approved, revoked] }
    HostReport:
      type: object
      required: [roots, clients, rejected]
      properties:
        guard_version: { type: string }
        os: { type: string }
        roots: { type: array, items: { type: string } }
        clients:
          type: array
          items:
            type: object
            required: [name]
            properties:
              name: { type: string }
              version: { type: string }
        sandbox: { type: string, description: "e.g. bwrap 0.9.0; empty when none" }
        allow_unsandboxed: { type: boolean, description: "True when guard.yaml permits agents with sandbox: false" }
        rejected:
          type: array
          items:
            type: object
            required: [agent_id, path, reason]
            properties:
              agent_id: { type: string }
              path: { type: string }
              reason: { type: string }
    FolderGrant:
      type: object
      required: [id, path, mode, created_at]
      properties:
        id: { type: string, format: uuid }
        path: { type: string }
        mode: { type: string, enum: [read, write] }
        created_at: { type: string, format: date-time }
        outside_roots: { type: boolean, description: "Only when created: the path is outside the roots the host reported" }
    HostAgent:
      type: object
      required: [agent_id, handle, host_id, client, model, work_model, allow_work, permission_mode, mode, root_dir, sandbox, grants]
      properties:
        agent_id: { type: string, format: uuid }
        handle: { type: string }
        host_id: { type: string, format: uuid }
        client: { type: string, enum: [claude-code, antigravity] }
        model: { type: string }
        work_model: { type: string }
        allow_work: { type: boolean }
        permission_mode: { type: string }
        mode: { type: string, enum: [direct, compact] }
        root_dir: { type: string }
        sandbox: { type: boolean }
        grants: { type: array, items: { $ref: "#/components/schemas/FolderGrant" } }
    AssignRequest:
      type: object
      required: [host_id, client]
      properties:
        host_id: { type: string, format: uuid }
        client: { type: string, enum: [claude-code, antigravity] }
        model: { type: string, maxLength: 100 }
        work_model: { type: string, maxLength: 100 }
        allow_work: { type: boolean }
        permission_mode: { type: string, maxLength: 40 }
        mode: { type: string, enum: [direct, compact] }
        root_dir: { type: string, maxLength: 1024 }
        sandbox: { type: boolean }
    GrantRequest:
      type: object
      required: [path, mode]
      properties:
        path: { type: string, maxLength: 1024 }
        mode: { type: string, enum: [read, write] }
    Host:
      type: object
      required: [id, name, state, created_at, report, agents]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        state: { type: string, enum: [approved, revoked] }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        report: { $ref: "#/components/schemas/HostReport" }
        agents: { type: array, items: { $ref: "#/components/schemas/HostAgent" } }
    HostList:
      type: object
      required: [hosts]
      properties:
        hosts: { type: array, items: { $ref: "#/components/schemas/Host" } }
    HostConfig:
      type: object
      required: [version, agents]
      properties:
        version: { type: string }
        agents: { type: array, items: { $ref: "#/components/schemas/HostAgent" } }
    AgentToken:
      type: object
      required: [token, expires_at]
      properties:
        token: { type: string }
        expires_at: { type: string, format: date-time }
    RunErrorRequest:
      type: object
      required: [channel_id, summary]
      properties:
        channel_id: { type: string, format: uuid }
        thread_root_id: { type: string, format: uuid }
        summary: { type: string, maxLength: 400 }
        detail: { type: string, maxLength: 20000 }
    RunErrorRef:
      type: object
      required: [id]
      properties:
        id: { type: string, format: uuid }
    RunError:
      type: object
      required: [id, agent_id, channel_id, summary, detail, created_at]
      properties:
        id: { type: string, format: uuid }
        agent_id: { type: string, format: uuid }
        channel_id: { type: string, format: uuid }
        thread_root_id: { type: string, format: uuid }
        summary: { type: string }
        detail: { type: string }
        created_at: { type: string, format: date-time }
    ReportRunRequest:
      type: object
      required: [phase, client, model, session_id, items, input_tokens, output_tokens, cache_read_tokens, cache_write_tokens, duration_ms, status]
      properties:
        host_id: { type: string, format: uuid }
        phase: { type: string, enum: [decide, work, direct] }
        client: { type: string }
        model: { type: string }
        session_id: { type: string }
        channel_id: { type: string, format: uuid }
        thread_root_id: { type: string, format: uuid }
        items: { type: integer, minimum: 0 }
        input_tokens: { type: integer, format: int64, minimum: 0, maximum: 1000000000 }
        output_tokens: { type: integer, format: int64, minimum: 0, maximum: 1000000000 }
        cache_read_tokens: { type: integer, format: int64, minimum: 0, maximum: 1000000000 }
        cache_write_tokens: { type: integer, format: int64, minimum: 0, maximum: 1000000000 }
        duration_ms: { type: integer, minimum: 0, maximum: 86400000 }
        status: { type: string, enum: [ok, error, halted] }
        error_id: { type: string, format: uuid }
    RunRef:
      type: object
      required: [id]
      properties:
        id: { type: string, format: uuid }
    Run:
      type: object
      required: [id, workspace_id, agent_id, phase, client, model, session_id, items, input_tokens, output_tokens, cache_read_tokens, cache_write_tokens, duration_ms, status, created_at]
      properties:
        id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        agent_id: { type: string, format: uuid }
        host_id: { type: string, format: uuid }
        phase: { type: string, enum: [decide, work, direct] }
        client: { type: string }
        model: { type: string }
        session_id: { type: string }
        channel_id: { type: string, format: uuid }
        thread_root_id: { type: string, format: uuid }
        items: { type: integer }
        input_tokens: { type: integer, format: int64 }
        output_tokens: { type: integer, format: int64 }
        cache_read_tokens: { type: integer, format: int64 }
        cache_write_tokens: { type: integer, format: int64 }
        duration_ms: { type: integer }
        status: { type: string, enum: [ok, error, halted] }
        error_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
    RunList:
      type: object
      required: [runs]
      properties:
        runs:
          type: array
          items: { $ref: "#/components/schemas/Run" }
    DayUsage:
      type: object
      required: [agent_id, day, input_tokens, output_tokens, cache_read_tokens, cache_write_tokens, total_tokens, run_count, error_count]
      properties:
        agent_id: { type: string, format: uuid }
        day: { type: string, example: "2026-10-16" }
        input_tokens: { type: integer, format: int64 }
        output_tokens: { type: integer, format: int64 }
        cache_read_tokens: { type: integer, format: int64 }
        cache_write_tokens: { type: integer, format: int64 }
        total_tokens: { type: integer, format: int64 }
        run_count: { type: integer }
        error_count: { type: integer }
    UsageResponse:
      type: object
      required: [usage]
      properties:
        usage:
          type: array
          items: { $ref: "#/components/schemas/DayUsage" }
    CreateScheduleRequest:
      type: object
      required: [channel_id, body]
      properties:
        channel_id: { type: string, format: uuid }
        thread_root_id: { type: string, format: uuid }
        body: { type: string, maxLength: 20000 }
        at: { type: string, description: "One-off: RFC 3339, or local time in `timezone` as YYYY-MM-DD HH:MM" }
        cron: { type: string, description: "Repeating: 5-field cron expression in `timezone`, e.g. 0 1 * * *" }
        timezone: { type: string, description: "IANA zone, default Europe/Budapest" }
        catch_up: { type: string, enum: [once, skip], description: "Missed while the server was down: run once (within 12 h) or skip" }
    Schedule:
      type: object
      required: [id, created_by, channel_id, body, cron, timezone, catch_up, state, next_run_at, last_error, run_count, created_at]
      properties:
        id: { type: string, format: uuid }
        created_by: { type: string, format: uuid }
        channel_id: { type: string, format: uuid }
        thread_root_id: { type: string, format: uuid }
        body: { type: string }
        cron: { type: string }
        timezone: { type: string }
        catch_up: { type: string, enum: [once, skip] }
        state: { type: string, enum: [active, done, canceled] }
        next_run_at: { type: string, format: date-time }
        last_run_at: { type: string, format: date-time }
        last_message_id: { type: string, format: uuid }
        last_error: { type: string }
        run_count: { type: integer }
        created_at: { type: string, format: date-time }
    ScheduleList:
      type: object
      required: [schedules]
      properties:
        schedules: { type: array, items: { $ref: "#/components/schemas/Schedule" } }
