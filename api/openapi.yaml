        - name: channel_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: thread_root_id
          in: query
          schema: { type: string, format: uuid }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/AgentContext" } } }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

