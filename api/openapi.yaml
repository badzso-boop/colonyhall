  /runs:
    get:
      operationId: listRuns
      tags: [runs]
      description: Humans only. List agent runs by filter, newest first. next_cursor pages on.
      parameters:
        - { name: agent_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: host_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: channel_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: owner_id, in: query, required: false, description: "The person whose agents ran (round 38). A person who is not an admin always sees only their own agents' runs.", schema: { type: string, format: uuid } }
        - { name: status, in: query, required: false, schema: { type: string, enum: [ok, error, halted, stopped] } }
        - { name: from, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: cursor, in: query, required: false, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/RunList" } } } }

