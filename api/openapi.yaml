    post:
      operationId: appendWikiPage
      tags: [wiki]
      description: Any actor. Append a section to an existing wiki page.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AppendWikiPageRequest" } } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200": { description: Appended, content: { application/json: { schema: { $ref: "#/components/schemas/WikiPage" } } } }

  /wiki/{slug}/restore:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string, maxLength: 80 } }
    post:
      operationId: restoreWikiPage
      tags: [wiki]
      description: Humans only. Restore a soft-deleted wiki page.
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200": { description: Restored, content: { application/json: { schema: { $ref: "#/components/schemas/WikiPage" } } } }

  /wiki/{slug}/revisions:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string, maxLength: 80 } }
    get:
      operationId: listWikiRevisions
      tags: [wiki]
      description: Any actor. List all revisions of a wiki page.
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200": { description: Revisions, content: { application/json: { schema: { $ref: "#/components/schemas/WikiRevisionList" } } } }

  /questions:
    get:
      operationId: listQuestions
      tags: [question]
      description: List questions in the workspace, optionally filtered by state.
      parameters:
        - { name: state, in: query, required: false, schema: { type: string }, description: "Filter by state: open, answered, escalated, withdrawn, expired" }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200": { description: Questions, content: { application/json: { schema: { $ref: "#/components/schemas/QuestionList" } } } }

  /questions/{questionId}/answer:
    parameters:
      - { name: questionId, in: path, required: true, schema: { type: string }, description: "Question ID (UUID) or number (e.g. Q-12)" }
    post:
      operationId: answerQuestion
      tags: [question]
      description: Answer an open or escalated question.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AnswerQuestionRequest" } } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200": { description: Answered question, content: { application/json: { schema: { $ref: "#/components/schemas/Question" } } } }
  /delegations:
    get:
      operationId: listDelegations
      tags: [delegation]
      description: List delegation requests in the workspace.
      parameters:
        - name: state
          in: query
          required: false
          schema:
            type: string
            enum: [pending, approved, denied, expired]
          description: "Filter by state: pending, approved, denied, expired"
        - name: message_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: "Filter by message ID"
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: Delegations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DelegationList"
        "403": { $ref: "#/components/responses/Problem" }

  /delegation-settings:
    get:
      operationId: getDelegationSettings
      tags: [delegation]
      description: Get delegation settings for the workspace.
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: Delegation settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DelegationSettings"
        "403": { $ref: "#/components/responses/Problem" }
    put:
      operationId: updateDelegationSettings
      tags: [delegation]
      description: Update delegation settings for the workspace (admin only).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDelegationSettingsRequest"
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: Updated delegation settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DelegationSettings"
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /delegation-grants:
    get:
      operationId: listDelegationGrants
      tags: [delegation]
      description: List delegation grants in the workspace.
      parameters:
        - name: active
          in: query
          required: false
          schema:
            type: boolean
          description: "Filter active grants only"
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: Delegation grants
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DelegationGrantList"
        "403": { $ref: "#/components/responses/Problem" }

  /delegation-grants/{id}/revoke:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: revokeDelegationGrant
      tags: [delegation]
      description: Revoke an active delegation grant (admin only).
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: Revoked delegation grant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DelegationGrant"
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /files/{fileId}:
    parameters:
      - name: fileId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getFile
      tags: [files]
      description: Get file metadata. Caller must have read access to the channel.
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: File metadata
          content: { application/json: { schema: { $ref: "#/components/schemas/File" } } }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /files/{fileId}/content:
    parameters:
      - name: fileId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: downloadFileContent
      tags: [files]
      description: Download file content. Served with Content-Disposition attachment.
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: File content
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /git/mappings:
    get:
      operationId: listGitMappings
      tags: [git]
      description: Lists repository-to-channel notification mappings. Admins only.
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/GitRepoMappingList" } } }
    post:
      operationId: setGitMapping
      tags: [git]
      description: Sets or updates a repository-to-channel mapping. Admins only.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SetGitRepoMappingRequest" } } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/GitRepoMapping" } } }

  /git/mappings/{owner}/{repo}:
    parameters:
      - { name: owner, in: path, required: true, schema: { type: string } }
      - { name: repo, in: path, required: true, schema: { type: string } }
    delete:
      operationId: deleteGitMapping
      tags: [git]
      description: Deletes a repository-to-channel mapping. Admins only.
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "204": { description: Deleted }

  /hooks/gitea:
    post:
      operationId: handleGiteaWebhook
      tags: [git]
      description: Receives incoming webhooks from Gitea. Verified with X-Gitea-Signature HMAC.
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200": { description: Processed or ignored }
        "401": { description: Invalid signature }

  /previews:
    get:
      operationId: listPreviews
      tags: [previews]
      description: Humans. List previews in the workspace.
      parameters:
        - { name: agent_id, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PreviewList" } } } }

  /previews/{previewId}:
    parameters:
      - { name: previewId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getPreview
      tags: [previews]
      description: Humans. Get a preview by ID.
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Preview" } } } }

  /previews/{previewId}/stop:
    parameters:
      - { name: previewId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: stopPreview
      tags: [previews]
      description: Humans. Stop a running preview.
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200": { description: Stopped, content: { application/json: { schema: { $ref: "#/components/schemas/Preview" } } } }

  /planner/tasks:
    get:
      operationId: listPlannerTasks
      tags: [planner]
      description: Humans only. The caller's open tasks in their order, then tasks done in the last 14 days.
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: Tasks
          content: { application/json: { schema: { $ref: "#/components/schemas/PlannerTaskList" } } }
    post:
      operationId: createPlannerTask
      tags: [planner]
      description: Humans only. Adds a scheduled task at the top of the caller's list.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreatePlannerTaskRequest" } } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "201":
          description: Created task
          content: { application/json: { schema: { $ref: "#/components/schemas/PlannerTask" } } }

  /planner/tasks/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updatePlannerTask
      tags: [planner]
      description: Humans only, own tasks. Change title, description or status, or move the task between two others.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/UpdatePlannerTaskRequest" } } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: Updated task
          content: { application/json: { schema: { $ref: "#/components/schemas/PlannerTask" } } }
    delete:
      operationId: deletePlannerTask
      tags: [planner]
      description: Humans only, own tasks. Soft-deletes the task.
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "204": { description: Deleted }

  /planner/access:
    get:
      operationId: getPlannerAccess
      tags: [planner]
      description: Humans only. Which agents may read the caller's tasks and calendars.
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: Access settings
          content: { application/json: { schema: { $ref: "#/components/schemas/PlannerAccess" } } }
    put:
      operationId: putPlannerAccess
      tags: [planner]
      description: Humans only. Replaces who may read the caller's tasks and calendars.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PlannerAccess" } } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: Access settings
          content: { application/json: { schema: { $ref: "#/components/schemas/PlannerAccess" } } }

  /planner/calendars:
    get:
      operationId: listPlannerCalendars
      tags: [planner]
      description: Humans only. The caller's subscribed calendars; the URL is never returned, only a masked form.
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: Calendars
          content: { application/json: { schema: { $ref: "#/components/schemas/PlannerCalendarList" } } }
    post:
      operationId: addPlannerCalendar
      tags: [planner]
      description: Humans only. Subscribes to an https or webcal ICS link and fetches it once.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AddPlannerCalendarRequest" } } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "201":
          description: Calendar
          content: { application/json: { schema: { $ref: "#/components/schemas/PlannerCalendar" } } }

  /planner/calendars/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: deletePlannerCalendar
      tags: [planner]
      description: Humans only, own calendars. Removes the subscription and its cached events.
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "204": { description: Deleted }

  /planner/calendars/{id}/refresh:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: refreshPlannerCalendar
      tags: [planner]
      description: Humans only, own calendars. Fetches the calendar now.
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: Calendar
          content: { application/json: { schema: { $ref: "#/components/schemas/PlannerCalendar" } } }

  /planner/events:
    get:
      operationId: listPlannerEvents
      tags: [planner]
