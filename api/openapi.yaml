      required: [id, channel_id, messages]
      properties:
        id: { type: string, format: uuid }
        channel_id: { type: string, format: uuid }
        thread_root_id: { type: string, format: uuid, nullable: true }
        previous_summary: { type: string, nullable: true }
        messages: { type: array, items: { $ref: "#/components/schemas/CompactionTaskMessage" } }
        max_summary_chars: { type: integer }

    CompactionResultRequest:
      type: object
      properties:
        markdown: { type: string, maxLength: 40000 }
        error_code: { type: string }

    UpdateCompactionSummaryRequest:
      type: object
      required: [markdown]
      properties:
        markdown: { type: string, maxLength: 40000 }

    ContextMessage:
      type: object
      required: [id, author_handle, author_kind, body, created_at]
      properties:
        id: { type: string, format: uuid }
        author_handle: { type: string }
        author_kind: { type: string }
        body: { type: string }
        attachments: { type: array, items: { type: string } }
        created_at: { type: string, format: date-time }

    AgentContext:
      type: object
      required: [messages_after, has_more]
      properties:
        compaction_id: { type: string, format: uuid, nullable: true }
        summary_markdown: { type: string, nullable: true }
        messages_after: { type: array, items: { $ref: "#/components/schemas/ContextMessage" } }
        has_more: { type: boolean }

    Delegation:
      type: object
      required:
        - id
        - workspace_id
        - message_id
        - channel_id
        - from_agent_id
        - to_agent_id
        - question_id
        - state
        - created_at
      properties:
        id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        message_id:
          type: string
          format: uuid
        channel_id:
          type: string
          format: uuid
        thread_root_id:
          type: string
          format: uuid
        from_agent_id:
          type: string
          format: uuid
        from_agent_handle:
          type: string
        to_agent_id:
          type: string
          format: uuid
        to_agent_handle:
          type: string
        question_id:
          type: string
          format: uuid
        state:
          type: string
          enum: [pending, approved, denied, expired, cancelled]
        decided_by:
          type: string
          format: uuid
        decided_by_handle:
          type: string
        approver_handle:
          type: string
        decided_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        approved_by_grant:
          type: boolean
          description: "Whether this delegation was approved through an existing grant"
        grant_idle_minutes:
          type: integer
          description: "Grant idle limit in minutes (if it created a grant)"
        grant_max_hours:
          type: integer
          description: "Grant max lifetime in hours (if it created a grant)"

    DelegationList:
      type: object
      required: [delegations]
      properties:
        delegations:
          type: array
          items:
            $ref: "#/components/schemas/Delegation"

    DelegationSettings:
      type: object
      required:
        - grant_idle_minutes
        - grant_max_hours
        - updated_at
      properties:
        grant_idle_minutes:
          type: integer
          minimum: 5
          maximum: 1440
          description: "Idle expiry time in minutes (default 60, range 5-1440)"
        grant_max_hours:
          type: integer
          minimum: 1
          maximum: 72
          description: "Maximum lifetime in hours (default 12, range 1-72)"
        updated_at:
          type: string
          format: date-time

    UpdateDelegationSettingsRequest:
      type: object
      required:
        - grant_idle_minutes
        - grant_max_hours
      properties:
        grant_idle_minutes:
          type: integer
          minimum: 5
          maximum: 1440
          description: "Idle expiry time in minutes (5-1440)"
        grant_max_hours:
          type: integer
          minimum: 1
          maximum: 72
          description: "Maximum lifetime in hours (1-72)"

    DelegationGrant:
      type: object
      required:
