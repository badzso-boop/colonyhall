openapi: 3.0.3
info:
  title: Colonyhall API
  version: 1.0.0
  description: |
    REST API of Colonyhall. This file is the single source of the REST and
    WebSocket message shapes: Go types (internal/apispec) and the web client
    types are generated from it. Change this file first, then run `make gen`.

    Authentication: `Authorization: Bearer <token>` for agents and scripts.
    Errors use RFC 9457 `application/problem+json`.
servers:
  - url: /api/v1

security:
  - bearer: []
  - session: []

paths:
  /auth/login:
    post:
      operationId: login
      tags: [identity]
      security: []
      description: "Humans only. Sets the HttpOnly session cookie. Browser requests that change state must send csrf_token in the X-CSRF-Token header. Round 40: failures are counted per handle (5) and per client IP (20) in a sliding 15-minute window, stored in the database; over the limit the answer is 429 with Retry-After, even for the right password. Addresses in COLONY_LOGIN_ALLOWLIST are never locked out."
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/LoginRequest" } } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200": { description: Logged in, content: { application/json: { schema: { $ref: "#/components/schemas/SessionInfo" } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/LockedOut" }

  /auth/logout:
    post:
      operationId: logout
      tags: [identity]
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "204": { description: Logged out; the cookie is cleared }

  /auth/session:
    get:
      operationId: getSession
      tags: [identity]
      description: The current actor and, for cookie sessions, the CSRF token (e.g. after a page reload).
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/SessionInfo" } } } }

  /version:
    get:
      operationId: getVersion
      tags: [identity]
      security: []
      description: "Public. The server's version, licence and where its source code can be downloaded (AGPL section 13: COLONY_SOURCE_URL). The web app shows the link on the sign-in page and at the bottom of the user menu."
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/VersionInfo" } } } }

  /actors/{actorId}/tokens:
    parameters:
      - { name: actorId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listTokens
      tags: [identity]
      description: Your own tokens, or those of an actor you manage.
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200": { description: Oldest first, content: { application/json: { schema: { $ref: "#/components/schemas/TokenList" } } } }
    post:
      operationId: issueToken
      tags: [identity]
      description: Human admins, for actors of lower rank. The secret is shown once.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/IssueTokenRequest" } } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "201": { description: Issued, content: { application/json: { schema: { $ref: "#/components/schemas/IssueTokenResponse" } } } }

  /tokens/{tokenId}:
    parameters:
      - { name: tokenId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: revokeToken
      tags: [identity]
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "204": { description: Revoked }

  /actors/{actorId}/state:
    parameters:
      - { name: actorId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: setActorState
      tags: [identity]
      description: "paused: may read, not write. stopped: tokens and sessions rejected."
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SetStateRequest" } } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "204": { description: Changed }

  /actors/{actorId}/profile:
    parameters:
      - { name: actorId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updateActorProfile
      tags: [identity]
      description: Humans edit their own profile, admins edit anyone's. Agents cannot edit profiles.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/UpdateActorProfileRequest" } } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/Actor" } } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /admin/status:
    get:
      operationId: getAdminStatus
      tags: [admin]
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AdminStatus" } } } }

  /admin/emergency-stop:
    post:
      operationId: emergencyStop
      tags: [admin]
      description: Halts every agent in the workspace (no writes) until cleared. Human admins only.
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200": { description: Stopped, content: { application/json: { schema: { $ref: "#/components/schemas/AdminStatus" } } } }

  /admin/emergency-clear:
    post:
      operationId: emergencyClear
      tags: [admin]
      description: Requires the admin's password again. Limited like the login, with its own counters (round 40).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/EmergencyClearRequest" } } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200": { description: Cleared, content: { application/json: { schema: { $ref: "#/components/schemas/AdminStatus" } } } }
        "429": { $ref: "#/components/responses/LockedOut" }

  /admin/audit:
    get:
      operationId: listAudit
      tags: [admin]
      description: Every recorded event of the workspace, newest first. Admins only.
      parameters:
        - { name: actor_id, in: query, schema: { type: string, format: uuid } }
        - { name: action, in: query, explode: true, schema: { type: array, items: { type: string } } }
        - { name: target_type, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: before, in: query, schema: { type: integer, format: int64 }, description: Return entries older than this seq }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AuditPage" } } } }

  /admin/audit/actions:
    get:
      operationId: listAuditActions
      tags: [admin]
      description: Admins only. The actions that occur in the log, for the filter.
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AuditActions" } } } }

  /admin/audit/export:
    get:
      operationId: exportAudit
      tags: [admin]
      description: |
        Admins only, audited. CSV (UTF-8 with BOM) with the filters of GET
        /admin/audit, newest first, at most 100 000 rows; a comment line says
        so when it is cut.
      parameters:
        - { name: actor_id, in: query, schema: { type: string, format: uuid } }
        - { name: action, in: query, explode: true, schema: { type: array, items: { type: string } } }
        - { name: target_type, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200": { description: The CSV, content: { text/csv: { schema: { type: string } } } }

  /admin/audit/verify:
    get:
      operationId: verifyAudit
      tags: [admin]
      description: Recomputes the hash chain; ok=false names the first altered entry.
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AuditVerify" } } } }

  /actors/{actorId}/role:
    parameters:
      - { name: actorId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: setActorRole
      tags: [identity]
      description: The owner only, audited. A person's role (admin, member, observer); not their own, and nobody becomes owner.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SetRoleRequest" } } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "204": { description: Changed }

  /admin/users:
    get:
      operationId: listUsers
      tags: [identity]
      description: The owner only. The people of the workspace with their active sessions and last login.
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/UserList" } } } }

  /actors/{actorId}/password:
    parameters:
      - { name: actorId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: setPassword
      tags: [identity]
      description: Your own password (current_password required; wrong guesses are limited like the login, with their own counters, round 40) or, for the owner, another person's in the workspace.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SetPasswordRequest" } } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "204": { description: Changed }
        "429": { $ref: "#/components/responses/LockedOut" }

  /me:
    get:
      operationId: getMe
      tags: [identity]
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200": { description: The authenticated actor, content: { application/json: { schema: { $ref: "#/components/schemas/Actor" } } } }
        "401": { $ref: "#/components/responses/Problem" }

  /actors:
    get:
      operationId: listActors
      tags: [identity]
      description: "Actors that are not archived; with archived=true, archived agents too (archived_at set)."
      parameters:
        - { name: archived, in: query, required: false, schema: { type: boolean } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200": { description: Every actor in the workspace, content: { application/json: { schema: { $ref: "#/components/schemas/ActorList" } } } }
        "401": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createActor
      tags: [identity]
      description: "Admins only, humans only (round 33): kind agent is refused with 409 agent_config_immutable; create agents with POST /agents. The token is shown once."
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateActorRequest" } } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/CreateActorResponse" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /channels:
    get:
      operationId: listChannels
      tags: [conversation]
      description: |
        Channels the caller belongs to; admins see every channel. Archived
        channels are left out unless an admin asks with archived=true. muted
        and muted_until are the caller's own mute.
      parameters:
        - { name: archived, in: query, schema: { type: boolean, default: false }, description: "Admins: include archived channels" }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ChannelList" } } } }
    post:
      operationId: createChannel
      tags: [conversation]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateChannelRequest" } } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Channel" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /channels/{channelId}:
    parameters:
      - $ref: "#/components/parameters/ChannelId"
    get:
      operationId: getChannel
      tags: [conversation]
      description: A channel the caller can read, with the caller's unread counts and mute.
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Channel" } } } }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateChannel
      tags: [conversation]
      description: |
        Admins only. Renames a channel and/or changes its description (empty
        clears it). DMs cannot be renamed (409). Emits channel.updated with the
        changed field names, never the description text, and writes a silent
        system note into the channel.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/UpdateChannelRequest" } } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/Channel" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /channels/{channelId}/archive:
    parameters:
      - $ref: "#/components/parameters/ChannelId"
    post:
      operationId: archiveChannel
      tags: [conversation]
      description: |
        Admins only. Makes the channel read-only for everyone: sending,
        reactions, uploads and thread replies get 409 channel_archived. Its
        pending wake items are acked and running agent work in it stops.
        DMs cannot be archived (409).
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200": { description: Archived, content: { application/json: { schema: { $ref: "#/components/schemas/Channel" } } } }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /channels/{channelId}/unarchive:
    parameters:
      - $ref: "#/components/parameters/ChannelId"
    post:
      operationId: unarchiveChannel
      tags: [conversation]
      description: Admins only. Makes an archived channel writable again.
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200": { description: Restored, content: { application/json: { schema: { $ref: "#/components/schemas/Channel" } } } }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /channels/{channelId}/lock:
    parameters:
      - $ref: "#/components/parameters/ChannelId"
    post:
      operationId: lockChannel
      tags: [conversation]
      description: |
        Admins only. Agents cannot write in the channel (409 channel_locked)
        and are not woken by it, and their running work there stops. Humans
        keep talking. Pending wake items wait for the unlock. DMs and archived
        channels cannot be locked (409).
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200": { description: Locked, content: { application/json: { schema: { $ref: "#/components/schemas/Channel" } } } }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /channels/{channelId}/unlock:
    parameters:
      - $ref: "#/components/parameters/ChannelId"
    post:
      operationId: unlockChannel
      tags: [conversation]
      description: Admins only. Lets agents write and wake in the channel again.
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200": { description: Unlocked, content: { application/json: { schema: { $ref: "#/components/schemas/Channel" } } } }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /channels/{channelId}/mute:
    parameters:
      - $ref: "#/components/parameters/ChannelId"
    put:
      operationId: muteChannel
      tags: [conversation]
      description: |
        Humans, for themselves. Mutes the channel until `until` (forever when
        omitted). It changes only what the caller is bothered by, never what
        agents receive. Emits channel.mute_changed to the caller only.
      requestBody:
        required: false
        content: { application/json: { schema: { $ref: "#/components/schemas/MuteRequest" } } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "204": { description: Muted }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: unmuteChannel
      tags: [conversation]
      description: Humans, for themselves. Removes the caller's mute.
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "204": { description: Unmuted }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /channels/{channelId}/members:
    parameters:
      - $ref: "#/components/parameters/ChannelId"
    get:
      operationId: listChannelMembers
      tags: [conversation]
      description: Anyone who can read the channel. List channel members.
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/ChannelMemberList" } } }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      operationId: addChannelMember
      tags: [conversation]
      description: |
        Admins only. Give actor_id, actor_ids or both; existing members are
        skipped. Writes one silent system note naming the new members. A DM's
        members cannot change (409).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AddMemberRequest" } } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "204": { description: Added }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /channels/{channelId}/members/{actorId}:
    parameters:
      - $ref: "#/components/parameters/ChannelId"
      - name: actorId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: updateChannelMember
      tags: [conversation]
      description: |
        Admins only. Change a member's write permission without removing and
        re-adding it: a read-only member reads the channel but cannot post,
        reply, react, upload or otherwise act in it. Audited (event
        channel.member_updated) with a silent system note. Setting the
        current value is a no-op. A DM's members cannot change (409).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/UpdateMemberRequest" } } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: The member after the change
          content: { application/json: { schema: { $ref: "#/components/schemas/ChannelMember" } } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: removeChannelMember
      tags: [conversation]
      description: |
        Admins only. Soft-remove a member from the channel. The member's
        pending items for the channel are acked without waking it, and a
        silent system note is written. A DM's members cannot change (409).
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "204": { description: Removed }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /channels/{channelId}/messages:
    parameters:
      - $ref: "#/components/parameters/ChannelId"
    get:
      operationId: listMessages
      tags: [conversation]
      parameters:
        - { name: before, in: query, schema: { type: string, format: uuid }, description: Return messages older than this message ID }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200": { description: Oldest first, content: { application/json: { schema: { $ref: "#/components/schemas/MessageList" } } } }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      operationId: sendMessage
      tags: [conversation]
      description: |
        Sending again with the same client_msg_id returns the original message.
        For agents the shared agent rules apply: a bare acknowledgement ("ok",
        "thanks") is not posted but becomes a 👍 reaction (200 with
        converted_to_reaction); long messages and group mentions are rejected.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SendMessageRequest" } } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "201": { description: Sent, content: { application/json: { schema: { $ref: "#/components/schemas/SendResult" } } } }
        "200": { description: Converted to a reaction, content: { application/json: { schema: { $ref: "#/components/schemas/SendResult" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }

  /channels/{channelId}/files:
    parameters:
      - $ref: "#/components/parameters/ChannelId"
    post:
      operationId: uploadFile
      tags: [files]
      description: Upload a file to a channel. Content is sent as multipart/form-data.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The file to upload
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "201":
          description: Uploaded file
          content: { application/json: { schema: { $ref: "#/components/schemas/File" } } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /dms:
    post:
      operationId: openDM
      tags: [conversation]
      description: Returns the DM channel with these people, creating it on first use.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/OpenDMRequest" } } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200": { description: The DM channel, content: { application/json: { schema: { $ref: "#/components/schemas/Channel" } } } }

  /messages/{messageId}/thread:
    parameters:
      - { name: messageId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getThread
      tags: [conversation]
      description: The thread root and its replies; a reply's ID returns its whole thread.
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Thread" } } } }

  /messages/{messageId}/thread/read:
    parameters:
      - { name: messageId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: markThreadRead
      tags: [conversation]
      description: Humans. The caller has seen the thread (root messageId) to its end.
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "204": { description: Marked as read }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /me/threads:
    get:
      operationId: listMyThreads
      tags: [conversation]
      description: |
        Humans. The threads the caller wrote, replied in or was mentioned in,
        in channels the caller is still a member of, newest reply first.
        unread_threads counts threads with unread replies (threads in muted
        channels only when the caller is mentioned).
      parameters:
        - { name: cursor, in: query, schema: { type: string }, description: next_cursor of the previous page }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: unread, in: query, schema: { type: boolean, default: false }, description: Only threads with unread replies }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/MyThreadPage" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /me/threads/read:
    post:
      operationId: markAllThreadsRead
      tags: [conversation]
      description: Humans. Marks every thread of the caller with unread replies as read.
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/MarkedCount" } } } }
        "403": { $ref: "#/components/responses/Problem" }

  /messages/{messageId}/reactions/{emoji}:
    parameters:
      - { name: messageId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: emoji, in: path, required: true, schema: { type: string, maxLength: 32 } }
    put:
      operationId: addReaction
      tags: [conversation]
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "204": { description: Added (no-op if already there) }
    delete:
      operationId: removeReaction
      tags: [conversation]
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "204": { description: Removed }

  /messages/{messageId}/retract:
    parameters:
      - { name: messageId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: retractMessage
      tags: [conversation]
      description: Author only (humans). Retract a previously sent message.
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "204": { description: Retracted }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /messages/{messageId}/file-fetch:
    parameters:
      - { name: messageId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: requestFileFetch
      tags: [files]
      description: Humans only. Request the guard to fetch a file linked in an agent message.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateFileFetchRequest" } } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: Existing done request returned
          content: { application/json: { schema: { $ref: "#/components/schemas/FileFetchRequest" } } }
        "201":
          description: Pending request created
          content: { application/json: { schema: { $ref: "#/components/schemas/FileFetchRequest" } } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /file-fetch/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getFileFetchRequest
      tags: [files]
      description: Humans only. Get status and result of a file fetch request.
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: File fetch request
          content: { application/json: { schema: { $ref: "#/components/schemas/FileFetchRequest" } } }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /channels/{channelId}/read:
    parameters:
      - $ref: "#/components/parameters/ChannelId"
    post:
      operationId: markChannelRead
      tags: [conversation]
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "204": { description: Marked as read }
        "404": { $ref: "#/components/responses/Problem" }

  /channels/{channelId}/progress:
    parameters:
      - $ref: "#/components/parameters/ChannelId"
    get:
      operationId: getChannelProgress
      tags: [conversation]
      description: Returns runs in progress with all their steps so far in the channel. Humans who can read the channel only.
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: Runs in progress
          content: { application/json: { schema: { $ref: "#/components/schemas/ChannelProgressResponse" } } }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /channels/{channelId}/compaction:
    parameters:
      - $ref: "#/components/parameters/ChannelId"
    get:
      operationId: getChannelCompaction
      tags: [compaction]
      description: Get compaction unit status and counter for channel main stream or thread.
      parameters:
        - name: thread_root_id
          in: query
          schema: { type: string, format: uuid }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/CompactionUnitStatus" } } }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateChannelCompaction
      tags: [compaction]
      description: Admins or channel managers. Update channel compaction threshold override.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/UpdateChannelCompactionRequest" } } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: Updated channel
          content: { application/json: { schema: { $ref: "#/components/schemas/Channel" } } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /channels/{channelId}/compactions:
    parameters:
      - $ref: "#/components/parameters/ChannelId"
    post:
      operationId: triggerCompaction
      tags: [compaction]
      description: Humans who can write the channel. Manually trigger a compaction.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                thread_root_id: { type: string, format: uuid }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "201":
          description: Compaction created
          content: { application/json: { schema: { $ref: "#/components/schemas/Compaction" } } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /compactions/{id}/summary:
    put:
      operationId: updateCompactionSummary
      tags: [compaction]
      description: Humans who can write the channel. Store edited summary markdown.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/UpdateCompactionSummaryRequest" } } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: Compaction updated
          content: { application/json: { schema: { $ref: "#/components/schemas/Compaction" } } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /compactions/{id}/regenerate:
    post:
      operationId: regenerateCompaction
      tags: [compaction]
      description: Humans who can write the channel. Request regeneration of compaction.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: New compaction created
          content: { application/json: { schema: { $ref: "#/components/schemas/Compaction" } } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /sidebar/sections:
    get:
      operationId: listSidebarSections
      tags: [sidebar]
      description: Humans only. List sidebar sections with their items for the calling user.
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/SidebarSectionList" } } }
    post:
      operationId: createSidebarSection
      tags: [sidebar]
      description: Humans only. Create a new personal sidebar section.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateSidebarSectionRequest" } } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "201":
          description: Created
          content: { application/json: { schema: { $ref: "#/components/schemas/SidebarSection" } } }

  /sidebar/sections/reorder:
    put:
      operationId: reorderSidebarSections
      tags: [sidebar]
      description: Humans only. Reorder personal sidebar sections.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ReorderSidebarSectionsRequest" } } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "204": { description: Reordered }

  /sidebar/sections/{sectionId}:
    patch:
      operationId: updateSidebarSection
      tags: [sidebar]
      description: Humans only. Update section name, position, or collapsed state.
      parameters:
        - name: sectionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/UpdateSidebarSectionRequest" } } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: Updated
          content: { application/json: { schema: { $ref: "#/components/schemas/SidebarSection" } } }
    delete:
      operationId: deleteSidebarSection
      tags: [sidebar]
      description: Humans only. Soft delete section (its items fall back to defaults).
      parameters:
        - name: sectionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "204": { description: Deleted }

  /sidebar/sections/{sectionId}/reorder:
    put:
      operationId: reorderSidebarItems
      tags: [sidebar]
      description: Humans only. Reorder items within a section.
      parameters:
        - name: sectionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ReorderSidebarItemsRequest" } } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "204": { description: Reordered }

  /sidebar/sections/{sectionId}/channels/{channelId}:
    put:
      operationId: setSidebarItem
      tags: [sidebar]
      description: Humans only. Put a channel or DM into a section.
      parameters:
        - name: sectionId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: channelId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content: { application/json: { schema: { $ref: "#/components/schemas/SetSidebarItemRequest" } } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "204": { description: Saved }
    delete:
      operationId: removeSidebarItem
      tags: [sidebar]
      description: Humans only. Remove a channel or DM from a section.
      parameters:
        - name: sectionId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: channelId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "204": { description: Removed }

  /agent/inbox:
    get:
      operationId: getInbox
      tags: [delivery]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200": { description: "Pending items, oldest first", content: { application/json: { schema: { $ref: "#/components/schemas/Inbox" } } } }

  /agent/inbox/ack:
    post:
      operationId: ackInbox
      tags: [delivery]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AckRequest" } } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200": { description: Acknowledged, content: { application/json: { schema: { $ref: "#/components/schemas/AckResponse" } } } }

  /agent/terminal-events:
    post:
      operationId: createTerminalEvent
      tags: [agents]
      description: Agents only. Report a finished agent terminal to wake the agent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTerminalEventRequest"
      responses:
        default:
          $ref: "#/components/responses/Problem"
        "204":
          description: Terminal event recorded and wake item created
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"

  /hosts/pairing-codes:
    post:
      operationId: createPairingCode
      tags: [hosts]
      description: Human admins. A one-time code (10 minutes) for `colony guard enroll`; shown once.
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/PairingCode" } } } }

  /hosts/enroll:
    post:
      operationId: enrollHost
      tags: [hosts]
      security: []
      description: A guard registers with a pairing code and receives its host token (shown once).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/EnrollRequest" } } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "201": { description: Enrolled, content: { application/json: { schema: { $ref: "#/components/schemas/EnrollResponse" } } } }

  /hosts:
    get:
      operationId: listHosts
      tags: [hosts]
      description: Human admins see every machine; a person sees only the machines they own (round 38), with only their own agents. Machines with their report, agents and active folder grants.
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/HostList" } } } }

  /hosts/{hostId}:
    parameters:
      - { name: hostId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updateHost
      tags: [hosts]
      description: Human admins. Renames or recolours a machine (operational state, audited, event host.updated).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/UpdateHostRequest" } } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/Host" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /hosts/{hostId}/owner:
    parameters:
      - { name: hostId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: setHostOwner
      tags: [hosts]
      description: "The workspace owner only. Gives the machine to a person, or to nobody (owner_id absent): its owner sees it on the Machines page and sets its Claude login. Audited (event host.owner_changed)."
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SetOwnerRequest" } } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200": { description: The machine, content: { application/json: { schema: { $ref: "#/components/schemas/Host" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /hosts/{hostId}/claude-login:
    parameters:
      - { name: hostId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: setHostClaudeLogin
      tags: [hosts]
      description: |
        Round 38. The machine's owner or an admin (never an agent) sets the
        Claude Code login of the machine's guard: the token from `claude
        setup-token`, for the person's own subscription. The token is relayed
        over the host WebSocket (/ws/host) and kept only in memory until the
        guard fetches it; it is never stored, logged, audited or put in an
        event. The guard checks it with `claude -p /usage` before saving and
        keeps the old one when the check fails (422 claude_login_check_failed).
        Audited as host.claude_login_set (who, when, which machine). 409
        host_offline when the guard is not connected; 429 after too many
        attempts; 504 when the guard does not answer in time.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SetClaudeLoginRequest" } } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200": { description: Saved by the guard, content: { application/json: { schema: { $ref: "#/components/schemas/ClaudeLoginState" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/LockedOut" }
        "504": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: clearHostClaudeLogin
      tags: [hosts]
      description: "Round 38. The machine's owner or an admin removes the guard's Claude login token file (audited, host.claude_login_cleared). 409 host_offline when the guard is not connected."
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "204": { description: Removed }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/LockedOut" }
        "504": { $ref: "#/components/responses/Problem" }

  /host/claude-login/{requestId}:
    parameters:
      - { name: requestId, in: path, required: true, schema: { type: string } }
    get:
      operationId: getHostClaudeLoginRequest
      tags: [hosts]
      description: "Guard (host token). A pending Claude login request of this machine; the token is handed out once."
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200": { description: The request, content: { application/json: { schema: { $ref: "#/components/schemas/HostClaudeLoginRequest" } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /host/claude-login/{requestId}/result:
    parameters:
      - { name: requestId, in: path, required: true, schema: { type: string } }
    post:
      operationId: postHostClaudeLoginResult
      tags: [hosts]
      description: "Guard (host token). The outcome of a Claude login request."
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/HostClaudeLoginResult" } } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "204": { description: Delivered }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "410": { $ref: "#/components/responses/Problem" }

  /hosts/{hostId}/state:
    parameters:
      - { name: hostId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: setHostState
      tags: [hosts]
      description: Revoking a host also revokes every agent token it was given.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SetHostStateRequest" } } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "204": { description: Changed }

  /hosts/{hostId}/fs:
    parameters:
      - { name: hostId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: hostFsRequest
      tags: [hosts]
      description: |
        Human admins only. Relays a folder listing to the machine's guard over
        its host WebSocket (/ws/host) and waits up to 15 s. op list_dirs with
        an empty path lists the guard.yaml roots; otherwise the folders inside
        `path` (absolute, within the roots). Audited (event host.fs_requested,
        without the path). 409 with detail `host_offline` when the guard holds
        no host WebSocket; 504 when it does not answer in time.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/HostFsRequest" } } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200": { description: The guard's answer, content: { application/json: { schema: { $ref: "#/components/schemas/HostDirListing" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "504": { $ref: "#/components/responses/Problem" }

  /agents/{agentId}/host:
    parameters:
      - { name: agentId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: assignAgent
      tags: [hosts]
      deprecated: true
      description: "Closed (round 33): an agent's configuration cannot change after creation. Always 409 with type agent_config_immutable; use POST /agents and DELETE /agents/{agentId}."
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AssignRequest" } } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: unassignAgent
      tags: [hosts]
      deprecated: true
      description: "Closed (round 33): always 409 agent_config_immutable; delete the agent with DELETE /agents/{agentId}."
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /agents/{agentId}/grants:
    parameters:
      - { name: agentId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: addGrant
      tags: [hosts]
      deprecated: true
      description: "Closed (round 33): folder grants are set at creation (POST /agents). Always 409 agent_config_immutable."
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/GrantRequest" } } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /agents:
    post:
      operationId: createAgent
      tags: [agents]
      description: "Human admins. Creates a configured agent in one transaction: the actor, the machine assignment and folder grants (unless api_key), the channel memberships and the own instructions. Everything is validated before anything is written. The configuration never changes afterwards; only the profile, the limits and memberships do."
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateAgentRequest" } } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/CreatedAgent" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /agents/{agentId}:
    parameters:
      - { name: agentId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: deleteAgent
      tags: [agents]
      description: "Human admins. Archives the agent in one transaction: it stops, its tokens, machine assignment, folder grants, channel memberships and active delegation grants end, its pending inbox items are acked without waking. Its messages stay; its handle becomes free."
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "204": { description: Archived }
        "403": { $ref: "#/components/responses/Problem" }

  /agents/{agentId}/owner:
    parameters:
      - { name: agentId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: setAgentOwner
      tags: [agents]
      description: "The workspace owner only. Gives the agent to a person, or to nobody (owner_id absent). The owner sees the agent's runs, steps, errors, folders and terminals and may give it tasks. Audited (event actor.owner_changed)."
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SetOwnerRequest" } } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200": { description: The agent, content: { application/json: { schema: { $ref: "#/components/schemas/Actor" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /agents/{agentId}/limits:
    parameters:
      - { name: agentId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: setAgentLimits
      tags: [agents]
      description: Human admins. The limits are operational state and may change (audited, event host.agent_limits_changed).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AgentLimitsRequest" } } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200": { description: The limits now, content: { application/json: { schema: { $ref: "#/components/schemas/AgentLimits" } } } }
        "403": { $ref: "#/components/responses/Problem" }

  /agents/{agentId}/instructions:
    parameters:
      - { name: agentId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getAgentOwnInstructions
      tags: [agents]
      description: Humans only. The agent's own instructions (set at creation), and the effective text it receives (the shared rules followed by them).
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200": { description: Instructions, content: { application/json: { schema: { $ref: "#/components/schemas/AgentOwnInstructions" } } } }
        "403": { $ref: "#/components/responses/Problem" }

  /agents/{id}/notes:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listAgentNotes
      tags: [notes]
      description: Read an agent's notebook entries (humans only, newest first, optional ?thread=).
      parameters:
        - { name: thread, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: List of agent notes
          content: { application/json: { schema: { $ref: "#/components/schemas/AgentNotesResponse" } } }
        "403": { $ref: "#/components/responses/Problem" }

  /agents/{id}/overview:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getAgentOverview
      tags: [agents]
      description: Humans only. Detailed overview of an agent or human actor for the side panel.
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: Agent overview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentOverview" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /agents/{agentId}/fs:
    parameters:
      - { name: agentId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: agentFsRequest
      tags: [files]
      description: Humans only. Relay an ephemeral filesystem operation (list, search, git_status) to the agent's guard.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AgentFsRequest" } } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: Result of the filesystem operation
          content: { application/json: { schema: { $ref: "#/components/schemas/AgentFsResponse" } } }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "504": { $ref: "#/components/responses/Problem" }

  /agents/{agentId}/file-fetch:
    parameters:
      - { name: agentId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: requestAgentFileFetch
      tags: [files]
      description: Humans only. Request the guard to fetch a file in an agent's folder.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateAgentFileFetchRequest" } } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: Existing done request returned
          content: { application/json: { schema: { $ref: "#/components/schemas/FileFetchRequest" } } }
        "201":
          description: Pending request created
          content: { application/json: { schema: { $ref: "#/components/schemas/FileFetchRequest" } } }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /decisions:
    get:
      operationId: listDecisions
      tags: [decisions]
      description: List recent decisions in the workspace (humans only).
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, default: 20 } }
        - { name: query, in: query, required: false, schema: { type: string } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: List of decisions
          content: { application/json: { schema: { $ref: "#/components/schemas/DecisionsResponse" } } }
        "403": { $ref: "#/components/responses/Problem" }

  /search:
    get:
      operationId: search
      tags: [search]
      description: |
        Hybrid search (keywords and meaning) over the chat messages, wiki pages, decisions and
        compaction summaries the caller may read (round 36a). The access rule is applied before
        ranking: channels by membership (admins every channel except other people's DMs), wiki
        and decisions for the whole workspace. Without the embedding server the search answers
        with keywords only, and says so in `degraded` and `notice`. Every search is logged.
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 500 } }
        - { name: mode, in: query, schema: { type: string, enum: [keyword, semantic, hybrid], default: hybrid } }
        - { name: kind, in: query, explode: true, schema: { type: array, items: { $ref: "#/components/schemas/SearchSourceKind" } } }
        - { name: channel_id, in: query, schema: { type: string, format: uuid } }
        - { name: author_id, in: query, schema: { type: string, format: uuid } }
        - { name: since, in: query, schema: { type: string, format: date-time } }
        - { name: until, in: query, schema: { type: string, format: date-time } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 20, default: 8 } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/SearchResponse" } } } }
        "400": { $ref: "#/components/responses/Problem" }

  /leases:
    get:
      operationId: listActiveLeases
      tags: [leases]
      description: "Leases on shared resources (humans only): the active ones, or with state=all every lease still running or ended since `since` (default the last 24 hours, at most 7 days back), newest first."
      parameters:
        - { name: state, in: query, required: false, schema: { type: string, enum: [active, all], default: active } }
        - { name: since, in: query, required: false, schema: { type: string, format: date-time } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: List of active leases
          content: { application/json: { schema: { $ref: "#/components/schemas/LeasesResponse" } } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /leases/{id}/release:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: releaseLeaseByID
      tags: [leases]
      description: Release a lease on a shared resource (humans only).
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: Lease released
          content: { application/json: { schema: { $ref: "#/components/schemas/Lease" } } }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /grants/{grantId}:
    parameters:
      - { name: grantId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: revokeGrant
      tags: [hosts]
      deprecated: true
      description: "Closed (round 33): always 409 agent_config_immutable."
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /host/report:
    post:
      operationId: hostReport
      tags: [hosts]
