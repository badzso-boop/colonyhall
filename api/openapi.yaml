      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/ScribeCompactionTask" } } }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /agent/compactions/{id}/result:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: submitScribeCompactionResult
      tags: [compaction]
      description: Scribe agent only. Submit generated summary markdown or error code.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CompactionResultRequest" } } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: Compaction completed
          content: { application/json: { schema: { $ref: "#/components/schemas/Compaction" } } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

