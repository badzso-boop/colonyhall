      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/HostReport" } } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "204": { description: Stored }

  /host/config:
    get:
      operationId: hostConfig
      tags: [hosts]
      description: Guard (host token). The host's agents and grants; send If-None-Match with the last version.
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/HostConfig" } } } }
        "304": { description: Unchanged }

  /host/fs/{requestId}:
    parameters:
      - { name: requestId, in: path, required: true, schema: { type: string } }
    get:
      operationId: getHostFsRequest
      tags: [hosts]
      description: Guard (host token). The op and arguments of a pending host fs request; another host's request is 404.
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200": { description: Pending request, content: { application/json: { schema: { $ref: "#/components/schemas/HostFsPendingRequest" } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /host/fs/{requestId}/result:
    parameters:
      - { name: requestId, in: path, required: true, schema: { type: string } }
    post:
      operationId: postHostFsResult
      tags: [hosts]
      description: |
        Guard (host token). Delivers the answer (max 1 MiB, at most 500
        entries) to the waiting admin. Another host's request is 404; an
        answer after the timeout is 410.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/HostDirListing" } } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "204": { description: Delivered }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "410": { $ref: "#/components/responses/Problem" }

  /host/agents/{agentId}/token:
    parameters:
      - { name: agentId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: hostAgentToken
      tags: [hosts]
      description: Guard (host token). A short-lived token for an agent assigned to this host.
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "201": { description: Issued, content: { application/json: { schema: { $ref: "#/components/schemas/AgentToken" } } } }

  /host/previews/{previewId}:
    parameters:
      - { name: previewId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: hostReportPreview
      tags: [previews]
      description: Guard (host token). Report preview state (running with url, failed with error, or stopped).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/HostPreviewReport" } } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "204": { description: Stored }

  /agent/activity:
    post:
      operationId: reportAgentActivity
      tags: [agents]
      description: Agents only. Report current working or idle state in a channel/thread.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AgentActivityRequest" } } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "204": { description: Updated }

  /agent/terminal-start:
    post:
      operationId: reportTerminalStart
      tags: [agents]
      description: Agents only. Post a silent terminal start message to thread.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/TerminalStartRequest" } } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "204": { description: Posted }

  /agent/retract-note:
    post:
      operationId: reportRetractNote
      tags: [agents]
      description: Agents only. Post a silent note when a running message was retracted.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RetractNoteRequest" } } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "204": { description: Posted }

  /agent/ratelimit-note:
    post:
      operationId: reportRateLimitNote
      tags: [agents]
      description: Agents only. Post a silent note when Claude usage hits reserve or reset pause, an Antigravity model's quota runs out, or the agent waits for its machine (max_concurrent_runs).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RateLimitNoteRequest" } } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "204": { description: Posted }

