      operationId: addPrice
      tags: [runs]
      description: Admins only, audited. Adds a row; old rows stay, so old runs keep the price of their time.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AddPriceRequest" } } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "201": { description: Added, content: { application/json: { schema: { $ref: "#/components/schemas/ModelPrice" } } } }

  /settings/currency:
    get:
      operationId: getCurrency
      tags: [runs]
      description: Admins only. The manual USD to HUF rate; empty until it is set.
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/CurrencySettings" } } } }
    put:
      operationId: setCurrency
      tags: [runs]
      description: Admins only, audited. HUF is computed in the client, so this rewrites no history.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SetCurrencyRequest" } } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/CurrencySettings" } } } }

  /settings/compaction:
    get:
      operationId: getCompactionSettings
      tags: [compaction]
      description: Humans only. Get workspace compaction settings.
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: Compaction settings
          content: { application/json: { schema: { $ref: "#/components/schemas/CompactionSettings" } } }
        "403": { $ref: "#/components/responses/Problem" }
    put:
      operationId: updateCompactionSettings
      tags: [compaction]
      description: Admins only. Update workspace compaction settings.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/UpdateCompactionSettingsRequest" } } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: Updated compaction settings
          content: { application/json: { schema: { $ref: "#/components/schemas/CompactionSettings" } } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /settings/file-fetch:
    get:
      operationId: getFileFetchSettings
      tags: [files]
      description: Humans only. Get workspace file fetch limits.
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: File fetch settings
          content: { application/json: { schema: { $ref: "#/components/schemas/FileFetchSettings" } } }
        "403": { $ref: "#/components/responses/Problem" }
    put:
      operationId: updateFileFetchSettings
      tags: [files]
      description: Admins only. Update workspace file fetch limits.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/UpdateFileFetchSettingsRequest" } } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: Updated file fetch settings
          content: { application/json: { schema: { $ref: "#/components/schemas/FileFetchSettings" } } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
    session:
      type: apiKey
      in: cookie
      name: colony_session

  parameters:
    ChannelId:
      name: channelId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Problem:
      description: Error
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    LockedOut:
      description: Too many attempts (round 40); try again after Retry-After seconds.
      headers:
        Retry-After:
          description: Seconds until the next attempt is accepted.
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }

    PlannerTaskStatus:
      type: string
      enum: [scheduled, started, done]
    PlannerTask:
      type: object
      required: [id, title, description, status, position, status_changed_at, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        status: { $ref: "#/components/schemas/PlannerTaskStatus" }
        position: { type: number, format: double }
        started_at: { type: string, format: date-time }
        done_at: { type: string, format: date-time }
        status_changed_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    PlannerTaskList:
      type: object
      required: [tasks]
      properties:
        tasks: { type: array, items: { $ref: "#/components/schemas/PlannerTask" } }
    CreatePlannerTaskRequest:
      type: object
      required: [title]
      properties:
        title: { type: string }
        description: { type: string }
    UpdatePlannerTaskRequest:
      type: object
      properties:
        title: { type: string }
        description: { type: string }
        status: { $ref: "#/components/schemas/PlannerTaskStatus" }
        move: { type: boolean, description: "Move the task between after_id and before_id (either may be omitted at the ends)" }
        after_id: { type: string, format: uuid }
        before_id: { type: string, format: uuid }
    PlannerAccess:
      type: object
      required: [task_all, task_agent_ids, cal_agent_ids]
      properties:
        task_all: { type: boolean, description: "Every agent of the workspace may read the tasks" }
        task_agent_ids: { type: array, items: { type: string, format: uuid } }
        cal_agent_ids: { type: array, items: { type: string, format: uuid } }
    PlannerCalendar:
      type: object
      required: [id, name, url_masked, colour, last_error, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        url_masked: { type: string }
        colour: { type: string }
        last_fetched_at: { type: string, format: date-time }
        last_error: { type: string }
        created_at: { type: string, format: date-time }
    PlannerCalendarList:
      type: object
      required: [calendars]
      properties:
        calendars: { type: array, items: { $ref: "#/components/schemas/PlannerCalendar" } }
    AddPlannerCalendarRequest:
      type: object
      required: [name, url]
      properties:
        name: { type: string }
        url: { type: string, description: "https:// or webcal:// ICS link (a secret: never returned)" }
        colour: { type: string }
    PlannerEvent:
      type: object
      required: [calendar_id, title, start, end, all_day, location, description]
      properties:
        calendar_id: { type: string, format: uuid }
        title: { type: string }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        all_day: { type: boolean }
        location: { type: string }
        description: { type: string }
    PlannerEventList:
      type: object
      required: [events]
      properties:
        events: { type: array, items: { $ref: "#/components/schemas/PlannerEvent" } }

    ActorKind:
      type: string
      enum: [human, agent]
    Role:
      type: string
      enum: [owner, admin, member, observer]

    Actor:
      type: object
      required: [id, kind, handle, display_name, role, state, created_at]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/ActorKind" }
        handle: { type: string }
        display_name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        state: { type: string }
        halted: { type: boolean, description: "Only on /me: true while the actor may not write (paused, stopped or emergency stop)" }
        created_at: { type: string, format: date-time }
        description: { type: string, maxLength: 300 }
        avatar_emoji: { type: string, maxLength: 32 }
        timezone: { type: string, maxLength: 64 }
        status_text: { type: string, maxLength: 80 }
        color: { $ref: "#/components/schemas/Hue" }
        archived_at: { type: string, format: date-time, description: "Set on a deleted (archived) agent; its handle may belong to a newer agent" }
        owner_id: { type: string, format: uuid, description: "Agents only: the person the agent belongs to (round 38); absent: nobody's" }
        effective_color:
          allOf: [{ $ref: "#/components/schemas/Hue" }]
          description: "The colour to show: the agent's own, else its machine's; absent when neither"
    UpdateActorProfileRequest:
      type: object
      properties:
        display_name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string, maxLength: 300 }
        avatar_emoji: { type: string, maxLength: 32 }
        timezone: { type: string, maxLength: 64 }
        status_text: { type: string, maxLength: 80 }
        color:
          type: string
          description: "Admins, agents only: a palette hue (see Hue), or empty to show the machine's colour again"
    ActorList:
      type: object
      required: [actors]
      properties:
        actors: { type: array, items: { $ref: "#/components/schemas/Actor" } }
    CreateActorRequest:
      type: object
      required: [kind, handle]
      properties:
        kind: { $ref: "#/components/schemas/ActorKind" }
        handle: { type: string, description: "2-32 characters: lowercase letters, digits and '-'" }
        display_name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        password: { type: string, minLength: 12, maxLength: 256, description: "The owner creating a person: their initial password" }
    SetRoleRequest:
      type: object
      required: [role]
      properties:
        role: { $ref: "#/components/schemas/Role" }
    UserRow:
      type: object
      required: [actor, active_sessions]
      properties:
        actor: { $ref: "#/components/schemas/Actor" }
        active_sessions: { type: integer }
        last_login_at: { type: string, format: date-time, nullable: true }
        last_active_at: { type: string, format: date-time, nullable: true, description: "Latest use of a session or token (a minute's precision)" }
    UserList:
      type: object
      required: [users]
      properties:
        users: { type: array, items: { $ref: "#/components/schemas/UserRow" } }
    LoginRequest:
      type: object
      required: [handle, password]
      properties:
        handle: { type: string }
        password: { type: string }
        workspace: { type: string, description: Only needed when the handle exists in several workspaces }
    VersionInfo:
      type: object
      required: [version, license, source_url]
      properties:
        version: { type: string, description: "The build's version, \"dev\" for a development build" }
        license: { type: string, description: SPDX identifier, example: AGPL-3.0-only }
        source_url: { type: string, format: uri, description: Where the source code of this server can be downloaded }
    SessionInfo:
      type: object
      required: [actor, csrf_token]
      properties:
        actor: { $ref: "#/components/schemas/Actor" }
        csrf_token: { type: string, description: Empty for bearer-token callers }
    SetPasswordRequest:
      type: object
      required: [new_password]
      properties:
        current_password: { type: string }
        new_password: { type: string, minLength: 12, maxLength: 256 }
    Token:
      type: object
      required: [id, actor_id, label, created_at]
      properties:
        id: { type: string, format: uuid }
        actor_id: { type: string, format: uuid }
        label: { type: string }
        created_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time }
        prefix: { type: string, description: 'The first characters ("col_" + 4); absent on tokens made before round 35b' }
        last_used_at: { type: string, format: date-time, description: "Latest use, recorded at most once a minute" }
    TokenList:
      type: object
      required: [tokens]
      properties:
        tokens: { type: array, items: { $ref: "#/components/schemas/Token" } }
    IssueTokenRequest:
      type: object
      properties:
        label: { type: string, maxLength: 64 }
    IssueTokenResponse:
      type: object
      required: [token, secret]
      properties:
        token: { $ref: "#/components/schemas/Token" }
        secret: { type: string, description: Shown once }
    SetStateRequest:
      type: object
      required: [state]
      properties:
        state: { type: string, enum: [active, paused, stopped] }
    EmergencyStop:
      type: object
      required: [active]
      properties:
        active: { type: boolean }
        since: { type: string, format: date-time }
        by: { type: string, format: uuid }
    AdminStatus:
      type: object
      required: [emergency_stop]
      properties:
        emergency_stop: { $ref: "#/components/schemas/EmergencyStop" }
        system:
          description: Human admins only. Never holds a secret or an environment value.
          allOf: [{ $ref: "#/components/schemas/SystemStatus" }]
    StatusConsumer:
      type: object
      required: [name, offset, lag, lag_seconds]
      properties:
        name: { type: string }
        offset: { type: integer, format: int64 }
        lag: { type: integer, format: int64 }
        lag_seconds: { type: integer, format: int64, description: Age of the oldest event it has not processed. }
    StatusGuard:
      type: object
      required: [id, name, online]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        last_seen_at: { type: string, format: date-time }
        guard_version: { type: string }
        online: { type: boolean, description: Seen in the last 90 seconds. }
    StatusTableSize:
      type: object
      required: [name, total_bytes, rows_estimate]
      properties:
        name: { type: string }
        total_bytes: { type: integer, format: int64, description: With indexes and TOAST. }
        rows_estimate: { type: integer, format: int64, description: "The planner's estimate (pg_class.reltuples), not count(*)." }
    StatusSizeSample:
      type: object
      required: [date, size_bytes]
      properties:
        date: { type: string, format: date }
        size_bytes: { type: integer, format: int64 }
    SystemStatus:
      type: object
      required: [version, uptime_seconds, database, event_head, consumers, connections, guards, scheduler, compaction, gitea_configured, gitea_webhook_configured, max_upload_mb, security]
      properties:
        version: { type: string }
        uptime_seconds: { type: integer, format: int64 }
        database:
          type: object
          required: [ok, latency_ms]
          properties:
            ok: { type: boolean }
            latency_ms: { type: number, format: double }
            size_bytes: { type: integer, format: int64, description: "The whole database (pg_database_size); absent on the memory store." }
            tables:
              type: array
              description: The 10 largest tables, biggest first; absent on the memory store.
              items: { $ref: "#/components/schemas/StatusTableSize" }
            growth:
              type: array
              description: One sample of size_bytes a day (UTC) for the last 90 days, oldest first; absent on the memory store.
              items: { $ref: "#/components/schemas/StatusSizeSample" }
        event_head: { type: integer, format: int64 }
        consumers:
          type: array
          items: { $ref: "#/components/schemas/StatusConsumer" }
        connections:
          type: object
          required: [human, agent, host]
          properties:
            human: { type: integer }
            agent: { type: integer }
            host: { type: integer }
        guards:
          type: array
          items: { $ref: "#/components/schemas/StatusGuard" }
        scheduler:
          type: object
          required: [failed_24h]
          properties:
            next_run_at: { type: string, format: date-time }
            failed_24h: { type: integer }
        compaction:
          type: object
          required: [running, failed_24h]
          properties:
            running: { type: integer, format: int64 }
            failed_24h: { type: integer, format: int64 }
        gitea_configured: { type: boolean }
        gitea_webhook_configured: { type: boolean }
        max_upload_mb: { type: integer }
        search: { $ref: "#/components/schemas/SearchStatus" }
        security: { $ref: "#/components/schemas/SecurityStatus" }
    SecurityStatus:
      type: object
      description: "Round 40: the login and release limits. In multi-tenant mode only the workspace's own lockouts; in single-tenant mode also those of unknown handles."
      required: [lockouts_24h, lockouts, allowlist, trusted_proxies]
      properties:
        lockouts_24h: { type: integer, description: Lockouts in the last 24 hours. }
        lockouts:
          type: array
          description: The latest lockouts of the last 24 hours, newest first (at most 20).
          items: { $ref: "#/components/schemas/StatusLockout" }
        allowlist:
          type: array
          description: COLONY_LOGIN_ALLOWLIST (addresses and prefixes only).
          items: { type: string }
        trusted_proxies: { type: boolean, description: Whether COLONY_TRUSTED_PROXIES is set (X-Forwarded-For is believed from them). }
    StatusLockout:
      type: object
      required: [scope, handle, ip, at, until]
      properties:
        scope: { type: string, enum: [login, emergency_clear, password, claude_login] }
        handle: { type: string }
        ip: { type: string, description: The client address; empty when unknown. }
        at: { type: string, format: date-time }
        until: { type: string, format: date-time }
    SearchSourceKind:
      type: string
      enum: [message, wiki, decision, summary]
    SearchScores:
      type: object
      description: Each stage's score; a stage that did not see the hit has none. Admins only.
      required: [fused]
      properties:
        keyword: { type: number, format: double }
        semantic: { type: number, format: double }
        fused: { type: number, format: double, description: Reciprocal Rank Fusion. }
        rerank: { type: number, format: double }
    SearchHit:
      type: object
      required: [kind, source_id, part, header, snippet, at]
      properties:
        kind: { $ref: "#/components/schemas/SearchSourceKind" }
        source_id: { type: string, format: uuid, description: "The message, wiki page, decision or compaction." }
        ref: { type: string, description: "The wiki page's slug, or the decision's number (D-12)." }
        part: { type: integer, description: Which chunk of the source. }
        channel_id: { type: string, format: uuid }
        thread_root_id: { type: string, format: uuid }
        author_id: { type: string, format: uuid }
        at: { type: string, format: date-time }
        header: { type: string, description: "The chunk's context: channel, thread, author, date." }
        snippet: { type: string, description: "Plain text; keyword matches between « and »." }
        scores: { $ref: "#/components/schemas/SearchScores" }
    SearchResponse:
      type: object
      required: [mode, hits, degraded]
      properties:
        mode: { type: string, enum: [keyword, semantic, hybrid] }
        hits: { type: array, items: { $ref: "#/components/schemas/SearchHit" } }
        degraded:
          type: array
          description: What the search had to do without.
          items: { type: string, enum: [no_embedder, no_reranker] }
        notice: { type: string, description: A short line when a configured backend did not answer. }
    SearchBackend:
      type: object
      required: [configured, reachable]
      properties:
        configured: { type: boolean }
        reachable: { type: boolean, description: The last call succeeded. }
        model: { type: string }
        last_ok_at: { type: string, format: date-time }
        last_error: { type: string }
    SearchStatus:
      type: object
      required: [chunks, pending, models, embedder, reranker]
      properties:
        chunks: { type: integer }
        pending: { type: integer, description: Chunks waiting for an embedding. }
        last_embed_at: { type: string, format: date-time }
        models: { type: array, items: { type: string } }
        embedder: { $ref: "#/components/schemas/SearchBackend" }
        reranker: { $ref: "#/components/schemas/SearchBackend" }
        model_mismatch: { type: string, description: Set when the embedding server serves another model than the stored vectors. }
    EmergencyClearRequest:
      type: object
      required: [password]
      properties:
        password: { type: string }
    AuditEntry:
      type: object
      required: [seq, actor_id, action, target_type, target_id, payload, at]
      properties:
        seq: { type: integer, format: int64 }
        actor_id: { type: string, format: uuid }
        action: { type: string }
        target_type: { type: string }
        target_id: { type: string, format: uuid }
        payload: { type: object, additionalProperties: true }
        at: { type: string, format: date-time }
    AuditPage:
      type: object
      required: [entries]
      properties:
        entries: { type: array, items: { $ref: "#/components/schemas/AuditEntry" } }
    AuditActions:
      type: object
      required: [actions]
      properties:
        actions: { type: array, items: { type: string } }
    AuditVerify:
      type: object
      required: [ok, checked]
      properties:
        ok: { type: boolean }
        checked: { type: integer }
        broken_at: { type: integer, format: int64 }
    CreateActorResponse:
      type: object
      required: [actor, token]
      properties:
        actor: { $ref: "#/components/schemas/Actor" }
        token: { type: string, description: Shown once; store it securely }

    SidebarItem:
      type: object
      required: [channel_id, position]
      properties:
        channel_id: { type: string, format: uuid }
        position: { type: integer }

    SidebarSection:
      type: object
      required: [id, name, position, collapsed, items]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 40 }
        position: { type: integer }
        collapsed: { type: boolean }
        items:
          type: array
          items: { $ref: "#/components/schemas/SidebarItem" }

    SidebarSectionList:
      type: object
      required: [sections]
      properties:
        sections:
          type: array
          items: { $ref: "#/components/schemas/SidebarSection" }

    CreateSidebarSectionRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 40 }

    UpdateSidebarSectionRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 40 }
        position: { type: integer }
        collapsed: { type: boolean }

    ReorderSidebarSectionsRequest:
      type: object
      required: [section_ids]
      properties:
        section_ids:
          type: array
          items: { type: string, format: uuid }

    SetSidebarItemRequest:
      type: object
      properties:
        position: { type: integer }

    ReorderSidebarItemsRequest:
      type: object
      required: [channel_ids]
      properties:
        channel_ids:
          type: array
          items: { type: string, format: uuid }

    ChannelKind:
      type: string
      enum: [public, private, dm]
    Channel:
      type: object
      required: [id, kind, name, is_member, unread, mentions]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/ChannelKind" }
        name: { type: string }
        description: { type: string, maxLength: 250 }
        compact_threshold_tokens: { type: integer, nullable: true, minimum: 20000, maximum: 2000000 }
        is_member: { type: boolean }
        unread: { type: integer, format: int64 }
        mentions: { type: integer, format: int64 }
        member_ids: { type: array, items: { type: string, format: uuid }, description: DM channels only }
        archived_at: { type: string, format: date-time, nullable: true, description: Set while the channel is archived (read-only) }
        agent_locked_at: { type: string, format: date-time, nullable: true, description: Set while agents cannot write or wake here }
        muted: { type: boolean, description: The caller has muted the channel }
        muted_until: { type: string, format: date-time, nullable: true, description: "End of the caller's mute; null while muted means forever" }
    UpdateChannelRequest:
      type: object
      properties:
        name: { type: string }
        description: { type: string, maxLength: 250, description: Empty clears it }
    MuteRequest:
      type: object
      properties:
        until: { type: string, format: date-time, description: Omit to mute until unmuted }
    MyThread:
      type: object
      required: [root, channel_id, channel_name, unread_replies, mentioned, latest_replies]
      properties:
        root: { $ref: "#/components/schemas/Message" }
        channel_id: { type: string, format: uuid }
        channel_name: { type: string }
        channel_kind: { $ref: "#/components/schemas/ChannelKind" }
        last_read_at: { type: string, format: date-time, nullable: true }
        unread_replies: { type: integer, format: int64, description: "Others' replies after the caller last read or replied" }
        mentioned: { type: boolean, description: The caller is mentioned in the root or a reply }
        latest_replies: { type: array, items: { $ref: "#/components/schemas/Message" }, description: "The latest 2 replies, oldest first" }
    MyThreadPage:
      type: object
      required: [threads, unread_threads]
      properties:
        threads: { type: array, items: { $ref: "#/components/schemas/MyThread" } }
        next_cursor: { type: string, description: Absent on the last page }
        unread_threads: { type: integer }
    MarkedCount:
      type: object
      required: [marked]
      properties:
        marked: { type: integer }
    ChannelList:
      type: object
      required: [channels]
      properties:
        channels: { type: array, items: { $ref: "#/components/schemas/Channel" } }
    ChannelMember:
      type: object
      required: [actor_id, handle, kind, can_write]
      properties:
        actor_id: { type: string, format: uuid }
        handle: { type: string }
        display_name: { type: string }
        kind: { $ref: "#/components/schemas/ActorKind" }
        can_write: { type: boolean }
    ChannelMemberList:
      type: object
      required: [members]
      properties:
        members:
          type: array
          items: { $ref: "#/components/schemas/ChannelMember" }
    CreateChannelRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        kind: { $ref: "#/components/schemas/ChannelKind" }
        description: { type: string, maxLength: 250 }
        member_ids: { type: array, maxItems: 100, items: { type: string, format: uuid }, description: "Admins: initial members besides the creator" }
    AddMemberRequest:
      type: object
      properties:
        actor_id: { type: string, format: uuid }
        actor_ids: { type: array, maxItems: 100, items: { type: string, format: uuid } }
        can_write: { type: boolean, default: true }
    UpdateMemberRequest:
      type: object
      required: [can_write]
      properties:
        can_write: { type: boolean }

    Message:
      type: object
      required: [id, channel_id, author_id, kind, body, mentions, reply_count, created_at]
      properties:
        id: { type: string, format: uuid }
        channel_id: { type: string, format: uuid }
        thread_root_id: { type: string, format: uuid }
        author_id: { type: string, format: uuid }
        client_msg_id: { type: string }
        kind: { type: string, enum: [text, system] }
        body: { type: string }
        compaction_id: { type: string, format: uuid, nullable: true }
        mentions: { type: array, items: { type: string, format: uuid } }
        reply_count: { type: integer }
        last_reply_at: { type: string, format: date-time }
        reply_participant_ids:
          type: array
          description: Up to 3 authors of the replies, the most recent replier first (thread roots only).
          items: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        reactions: { type: array, items: { $ref: "#/components/schemas/ReactionSummary" } }
        attachments: { type: array, items: { $ref: "#/components/schemas/FileAttachment" } }
        link_cards: { type: array, items: { $ref: "#/components/schemas/LinkCard" } }
        deleted_at: { type: string, format: date-time, nullable: true }
        deleted_by: { type: string, format: uuid, nullable: true }
        origin: { $ref: "#/components/schemas/MessageOrigin" }
        answers: { $ref: "#/components/schemas/MessageAnswers" }
    MessageAnswers:
      type: object
      description: "Set on an agent's answer posted in its origin thread: the DM reply it answers"
      required: [message_id, channel_id, author_id]
      properties:
        message_id: { type: string, format: uuid }
        channel_id: { type: string, format: uuid }
        author_id: { type: string, format: uuid }
    MessageOrigin:
      type: object
      required: [channel_id, channel, thread_id]
      properties:
        channel_id: { type: string, format: uuid }
        channel: { type: string }
        thread_id: { type: string, format: uuid }
    MessageList:
      type: object
      required: [messages]
      properties:
        messages: { type: array, items: { $ref: "#/components/schemas/Message" } }
    SendMessageRequest:
      type: object
      required: [body]
      properties:
        body: { type: string }
        thread_root_id: { type: string, format: uuid }
        client_msg_id: { type: string, maxLength: 64, description: Idempotency key chosen by the client }
        elaborate: { type: boolean, description: "Agents: allow a long answer; only when someone asked for detail" }
        file_ids: { type: array, items: { type: string, format: uuid }, description: Attached file IDs }
        answers_message_id: { type: string, format: uuid, description: "Agents (guard): the message this answer replies to, in another channel the agent can read" }
    SendResult:
      type: object
      properties:
        message: { $ref: "#/components/schemas/Message" }
        converted_to_reaction: { $ref: "#/components/schemas/Reaction" }
    Reaction:
      type: object
      required: [message_id, actor_id, emoji]
      properties:
        message_id: { type: string, format: uuid }
        actor_id: { type: string, format: uuid }
        emoji: { type: string }
    ReactionSummary:
      type: object
      required: [emoji, count, actor_ids]
      properties:
        emoji: { type: string }
        count: { type: integer }
        actor_ids: { type: array, items: { type: string, format: uuid } }
    Thread:
      type: object
      required: [root, replies]
      properties:
        root: { $ref: "#/components/schemas/Message" }
        replies: { type: array, items: { $ref: "#/components/schemas/Message" } }
    OpenDMRequest:
      type: object
      required: [actor_ids]
      properties:
        actor_ids: { type: array, minItems: 1, maxItems: 8, items: { type: string, format: uuid } }

    InboxItem:
      type: object
      required: [id, kind, item_id, channel, channel_id, author, author_kind, body, mentioned, dm, at]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string }
        item_id: { type: string, format: uuid }
        channel: { type: string }
        channel_id: { type: string, format: uuid }
        thread_root_id: { type: string, format: uuid }
        author: { type: string }
        author_kind: { type: string, enum: [human, agent, system], description: Who caused the item }
        body: { type: string }
        mentioned: { type: boolean }
        dm: { type: boolean }
        at: { type: string, format: date-time }
        delegated_by: { type: string, description: "Handle of the approving admin for kind=delegated" }
        via_grant: { type: boolean, description: "Whether this delegated item was delivered via an active delegation grant" }
        reply_origin: { $ref: "#/components/schemas/ReplyOrigin" }
        request_origin:
          description: "A request another agent sent from a thread the recipient may write in (request_message_id is the request itself): the guard handles it in that thread's session and answers there."
          allOf: [{ $ref: "#/components/schemas/ReplyOrigin" }]
    ReplyOrigin:
      type: object
      required: [channel_id, channel, thread_root_id, request_message_id]
      properties:
        channel_id: { type: string, format: uuid }
        channel: { type: string }
        thread_root_id: { type: string, format: uuid }
        request_message_id: { type: string, format: uuid }
    Inbox:
      type: object
      required: [items, total]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/InboxItem" } }
        total: { type: integer }
    AckRequest:
      type: object
      required: [ids]
      properties:
        ids: { type: array, items: { type: string, format: uuid } }
    AckResponse:
      type: object
      required: [acked]
      properties:
        acked: { type: integer }

    # WebSocket frames on /ws/ui (not REST, listed here so both sides share the types).
    WsHello:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [hello] }
        token: { type: string, description: "Agents and scripts: a Bearer token. Browsers omit it; the session cookie of the upgrade request authenticates them." }
        last_seq: { type: integer, format: int64, description: Last event seq the client has; omit on first connect }
    WsWelcome:
      type: object
      required: [type, protocol, head]
      properties:
        type: { type: string, enum: [welcome] }
        protocol: { type: integer }
        head: { type: integer, format: int64 }
    WsEvent:
      type: object
      description: |
        A durable event. `data` depends on `event_type`; the payloads the web
        client reads are described by these schemas (the server sends them
        unchanged; unknown types must be ignored by clients):
        message.created → EventMessageCreated; message.retracted →
        EventMessageRetracted; reaction.added, reaction.removed →
        EventReaction; channel.created → EventChannelCreated;
        channel.member_added, channel.member_updated → EventMemberAdded;
        channel.member_removed → EventMemberRemoved; channel.updated → EventChannelUpdated;
        channel.archived, channel.unarchived, channel.locked, channel.unlocked → EventChannelArchived;
        channel.locked, channel.unlocked → EventChannelLocked;
        channel.mute_changed (the muting viewer only) → EventMuteChanged;
        actor.created → EventActorCreated;
        actor.state_changed → EventActorStateChanged; actor.profile_updated →
        EventActorProfileUpdated; workspace.emergency_activated,
        workspace.emergency_cleared → EventEmergency; delivery.item_created →
        EventDeliveryItemCreated.
      required: [type, seq, event_type, actor_id, at, data]
      properties:
        type: { type: string, enum: [event] }
        seq: { type: integer, format: int64 }
        event_type: { type: string }
        channel_id: { type: string, format: uuid }
        actor_id: { type: string, format: uuid }
        at: { type: string, format: date-time }
        data: { type: object, additionalProperties: true }
    WsReplayDone:
      type: object
      required: [type, seq]
      properties:
        type: { type: string, enum: [replay_done] }
        seq: { type: integer, format: int64 }
    WsResyncRequired:
      type: object
      required: [type, head]
      properties:
        type: { type: string, enum: [resync_required] }
        head: { type: integer, format: int64 }
    # WebSocket frames on /ws/host: the guard's own connection, authenticated
    # with its host token. It carries only relay requests for that host; no
    # events, no agent frames.
    WsHostHello:
      type: object
      required: [type, token]
      properties:
        type: { type: string, enum: [hello] }
        token: { type: string, description: "The host token (colh_…)." }
    WsHostWelcome:
      type: object
      required: [type, protocol, host_id]
      properties:
        type: { type: string, enum: [welcome] }
        protocol: { type: integer }
        host_id: { type: string, format: uuid }
    WsHostFsRequest:
      type: object
      description: Ephemeral. An admin waits for a host fs answer; the guard fetches GET /host/fs/{request_id} and posts the result.
      required: [type, request_id]
      properties:
        type: { type: string, enum: [host.fs.request] }
        request_id: { type: string }
    WsActivity:
      type: object
      description: Ephemeral (not in the event log). An agent started or stopped working in a channel or thread.
      required: [type, agent_id, channel_id, state]
      properties:
        type: { type: string, enum: [agent.activity] }
        agent_id: { type: string, format: uuid }
        channel_id: { type: string, format: uuid }
        thread_root_id: { type: string, format: uuid }
        state: { type: string, description: "working or idle" }
    WsProgress:
      type: object
      description: Ephemeral (not in the event log). The live steps of an agent's running work.
      required: [type, agent_id, channel_id, run_key, steps, done]
      properties:
        type: { type: string, enum: [agent.progress] }
        agent_id: { type: string, format: uuid }
        channel_id: { type: string, format: uuid }
        thread_root_id: { type: string, format: uuid }
        run_key: { type: string }
        steps: { type: array, items: { $ref: "#/components/schemas/AgentStep" } }
        done: { type: boolean }

    # Payloads of WsEvent.data (see the mapping in the WsEvent description).
    EventMessageCreated:
      type: object
      required: [message_id, channel_id, author_id, kind, body, mentions, created_at]
      properties:
        message_id: { type: string, format: uuid }
        channel_id: { type: string, format: uuid }
        thread_root_id: { type: string, format: uuid }
        author_id: { type: string, format: uuid }
        client_msg_id: { type: string }
        kind: { type: string, enum: [text, system] }
        body: { type: string }
        mentions: { type: array, items: { type: string, format: uuid } }
        no_thread_follow: { type: boolean }
        silent: { type: boolean }
        attachments: { type: array, items: { $ref: "#/components/schemas/EventAttachment" } }
        created_at: { type: string, format: date-time }
    EventAttachment:
      type: object
      required: [id, name, mime, size]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        mime: { type: string }
        size: { type: integer, format: int64 }
    EventMessageRetracted:
      type: object
      required: [message_id, channel_id, author_id, retracted_by, at]
      properties:
        message_id: { type: string, format: uuid }
        channel_id: { type: string, format: uuid }
        thread_root_id: { type: string, format: uuid }
        author_id: { type: string, format: uuid }
        retracted_by: { type: string, format: uuid }
        at: { type: string, format: date-time }
    EventReaction:
      type: object
      required: [message_id, channel_id, actor_id, message_author_id, emoji]
      properties:
        message_id: { type: string, format: uuid }
        channel_id: { type: string, format: uuid }
        actor_id: { type: string, format: uuid }
        message_author_id: { type: string, format: uuid }
        emoji: { type: string }
    EventChannelCreated:
      type: object
      required: [channel_id, kind, name]
      properties:
        channel_id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/ChannelKind" }
        name: { type: string }
    EventMemberAdded:
      type: object
      required: [channel_id, actor_id, can_write]
      properties:
        channel_id: { type: string, format: uuid }
        actor_id: { type: string, format: uuid }
        can_write: { type: boolean }
    EventMemberRemoved:
      type: object
      required: [channel_id, actor_id]
      properties:
        channel_id: { type: string, format: uuid }
        actor_id: { type: string, format: uuid }
    EventChannelUpdated:
      type: object
      description: The changed fields; never the description text (clients refetch the channel).
      required: [channel_id, fields]
      properties:
        channel_id: { type: string, format: uuid }
        fields: { type: array, items: { type: string, enum: [name, description] } }
        old_name: { type: string }
        new_name: { type: string }
    EventChannelArchived:
      type: object
      required: [channel_id, name]
      properties:
        channel_id: { type: string, format: uuid }
        name: { type: string }
    EventChannelLocked:
      type: object
      required: [channel_id, name]
      properties:
        channel_id: { type: string, format: uuid }
        name: { type: string }
    EventMuteChanged:
      type: object
      required: [channel_id, actor_id, muted]
      properties:
        channel_id: { type: string, format: uuid }
        actor_id: { type: string, format: uuid }
        muted: { type: boolean }
        muted_until: { type: string, format: date-time }
    EventActorCreated:
      type: object
      required: [actor_id, kind, handle, role]
      properties:
        actor_id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/ActorKind" }
        handle: { type: string }
        role: { $ref: "#/components/schemas/Role" }
    EventActorStateChanged:
      type: object
      required: [actor_id, state]
      properties:
        actor_id: { type: string, format: uuid }
        state: { type: string }
    EventActorProfileUpdated:
      type: object
      required: [actor_id, description, avatar_emoji, timezone, status_text]
      properties:
        actor_id: { type: string, format: uuid }
        description: { type: string }
        avatar_emoji: { type: string }
        timezone: { type: string }
        status_text: { type: string }
    EventEmergency:
      type: object
      required: [by]
      properties:
        by: { type: string, format: uuid }
    EventDeliveryItemCreated:
      type: object
      required: [recipient_id, item_kind]
      properties:
        recipient_id: { type: string, format: uuid }
        item_kind: { type: string }

    PairingCode:
      type: object
      required: [code, expires_at]
      properties:
        code: { type: string }
        expires_at: { type: string, format: date-time }
    EnrollRequest:
      type: object
      required: [code, name]
      properties:
        code: { type: string }
        name: { type: string, maxLength: 64 }
    EnrollResponse:
      type: object
      required: [host_id, token]
      properties:
        host_id: { type: string, format: uuid }
        token: { type: string, description: Host token; shown once }
    SetHostStateRequest:
      type: object
      required: [state]
      properties:
        state: { type: string, enum: [approved, revoked] }
    HostReport:
      type: object
      required: [roots, clients, rejected]
      properties:
        guard_version: { type: string }
        os: { type: string }
        roots: { type: array, items: { type: string } }
        clients:
          type: array
          items:
            type: object
            required: [name]
            properties:
              name: { type: string }
              version: { type: string }
        sandbox: { type: string, description: "e.g. bwrap 0.9.0; empty when none" }
        allow_unsandboxed: { type: boolean, description: "True when guard.yaml permits agents with sandbox: false" }
        exchange_dir: { type: string, description: "Path to the secrets exchange folder (optional)" }
        exchange_ok: { type: boolean, description: "True when exchange_dir exists and is writable" }
        doctor:
          type: array
          maxItems: 40
          description: "Round 41: the guard's `colony doctor` checks, refreshed every usage check; run `colony doctor` on the machine for the fixes"
          items: { $ref: "#/components/schemas/DoctorCheck" }
        doctor_checked_at: { type: string, format: date-time }
        codegraph: { $ref: "#/components/schemas/CodegraphReport" }
        claude_login_configured: { type: boolean, description: "Round 38: guard.yaml names a claude_token_file, so the Claude login can be set from the PWA" }
        claude_login_set_at: { type: string, format: date-time, description: "Round 38: when the Claude login token (claude setup-token) was set; absent when there is none. The token itself never leaves the machine." }
        rejected:
          type: array
          items:
            type: object
            required: [agent_id, path, reason]
            properties:
              agent_id: { type: string }
              path: { type: string }
              reason: { type: string }
        worktrees:
          type: array
          items:
            type: object
            required: [agent_id, path, branch]
            properties:
              agent_id: { type: string }
              path: { type: string }
              branch: { type: string }
        claude_limits: { $ref: "#/components/schemas/ClaudeLimits" }
        agy_limits:
          type: array
          maxItems: 20
          description: Antigravity models paused on this machine after a quota error.
          items: { $ref: "#/components/schemas/AgyLimit" }
        agy_usage:
          type: array
          maxItems: 10
          description: The Antigravity quota groups, from `agy -p /usage` (no model call).
          items: { $ref: "#/components/schemas/AgyUsageGroup" }
        usage_checked_at: { type: string, format: date-time, description: "When the guard last asked the clients for their usage (`/usage`)" }
    FolderGrant:
      type: object
      required: [id, path, mode, created_at]
      properties:
        id: { type: string, format: uuid }
        path: { type: string }
        mode: { type: string, enum: [read, write] }
        created_at: { type: string, format: date-time }
        outside_roots: { type: boolean, description: "Only when created: the path is outside the roots the host reported" }
    HostAgent:
      type: object
      required: [agent_id, handle, host_id, client, model, work_model, allow_work, permission_mode, mode, root_dir, worktree_repo, sandbox, approvals, max_session_tokens, daily_token_limit, grants]
      properties:
        agent_id: { type: string, format: uuid }
        handle: { type: string }
        host_id: { type: string, format: uuid }
        client: { type: string, enum: [claude-code, antigravity] }
        model: { type: string }
        work_model: { type: string }
        allow_work: { type: boolean }
        permission_mode: { type: string }
        mode: { type: string, enum: [direct, compact] }
        root_dir: { type: string }
        worktree_repo: { type: string }
        sandbox: { type: boolean }
        approvals: { type: string, enum: [none, chat] }
        max_session_tokens: { type: integer, default: 150000, description: "Max context tokens before starting a fresh session (0 = no limit)" }
        daily_token_limit: { type: integer, format: int64, default: 0, description: "Max tokens per Budapest calendar day (0 = none)" }
        allow_preview: { type: boolean }
        allow_web_read: { type: boolean }
        write_scope: { type: string, enum: [all, docs], description: "docs: a full-access Claude Code planner that may write only Markdown and hands code changes to its sandboxed partner (enforced by Claude Code permission rules on the guard)" }
        partner_id: { type: string, format: uuid, description: "docs only: the sandboxed agent that writes the code" }
        partner_handle: { type: string, description: "docs only: the partner's handle, without @" }
        grants: { type: array, items: { $ref: "#/components/schemas/FolderGrant" } }
    AssignRequest:
      type: object
      required: [host_id, client]
      properties:
        host_id: { type: string, format: uuid }
        client: { type: string, enum: [claude-code, antigravity] }
        model: { type: string, maxLength: 100 }
        work_model: { type: string, maxLength: 100 }
        allow_work: { type: boolean }
        permission_mode: { type: string, maxLength: 40 }
        mode: { type: string, enum: [direct, compact] }
        root_dir: { type: string, maxLength: 1024 }
        worktree_repo: { type: string, maxLength: 1024, description: "Git repo path for worktree. For sandboxed agents, the guard commits for the agent; nothing is pushed." }
        sandbox: { type: boolean }
        approvals: { type: string, enum: [none, chat] }
        max_session_tokens: { type: integer, minimum: 0, default: 150000 }
        daily_token_limit: { type: integer, format: int64, minimum: 0, default: 0 }
        allow_preview: { type: boolean }
        allow_web_read: { type: boolean }
        write_scope: { type: string, enum: [all, docs], default: all, description: "docs: only for a full-access (direct, not sandboxed) claude-code agent without chat approvals or previews; it writes only Markdown. Immutable." }
        partner_id: { type: string, format: uuid, description: "Required with write_scope docs, refused otherwise: a sandboxed agent of the workspace that gets the code changes" }
    CreateAgentRequest:
      type: object
      required: [handle]
      properties:
        handle: { type: string, description: "2-32 characters: lowercase letters, digits and '-'; free among agents that are not archived" }
        display_name: { type: string, maxLength: 80 }
        avatar_emoji: { type: string, maxLength: 32 }
        color: { $ref: "#/components/schemas/Hue" }
        description: { type: string, maxLength: 300 }
        api_key: { type: boolean, description: "An API-key agent with no machine: only the actor and a token (shown once); host fields must be absent" }
        host: { $ref: "#/components/schemas/AssignRequest" }
        grants: { type: array, maxItems: 64, items: { $ref: "#/components/schemas/GrantRequest" } }
        channel_ids: { type: array, maxItems: 100, items: { type: string, format: uuid } }
        instructions: { type: string, maxLength: 8000, description: "The agent's own instructions, appended to the shared rules; never secrets" }
        owner_id: { type: string, format: uuid, description: "The person the agent belongs to (round 38): they see its runs, steps, errors, folders and terminals and may give it tasks. Absent: nobody's (admins only)." }
    SetOwnerRequest:
      type: object
      properties:
        owner_id: { type: string, format: uuid, description: "A person of the workspace; absent: nobody's" }
    CreatedAgent:
      type: object
      required: [actor]
      properties:
        actor: { $ref: "#/components/schemas/Actor" }
        host: { $ref: "#/components/schemas/HostAgent" }
        token: { type: string, description: "API-key agents only; shown once" }
    AgentLimitsRequest:
      type: object
      properties:
        daily_token_limit: { type: integer, format: int64, minimum: 0, description: "0 = none" }
        max_session_tokens: { type: integer, minimum: 0, description: "0 = none" }
    AgentLimits:
      type: object
      required: [daily_token_limit, max_session_tokens]
      properties:
        daily_token_limit: { type: integer, format: int64 }
        max_session_tokens: { type: integer }
    AgentOwnInstructions:
      type: object
      required: [text, effective]
      properties:
        text: { type: string, description: "Empty when the agent has none" }
        version: { type: integer }
        created_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        effective: { type: string, description: "What the agent receives: the shared rules, then its own instructions, placeholders filled" }
    GrantRequest:
      type: object
      required: [path, mode]
      properties:
        path: { type: string, maxLength: 1024 }
        mode: { type: string, enum: [read, write] }
    Hue:
      type: string
      description: A colour of the fixed machine and agent palette (round 33); the client maps it to theme tokens.
      enum: [red, orange, amber, lime, green, teal, cyan, blue, violet, pink]
    UpdateHostRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        color: { $ref: "#/components/schemas/Hue" }
    Host:
      type: object
      required: [id, name, color, state, created_at, report, agents]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        color: { $ref: "#/components/schemas/Hue" }
        state: { type: string, enum: [approved, revoked] }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        report: { $ref: "#/components/schemas/HostReport" }
        agents: { type: array, items: { $ref: "#/components/schemas/HostAgent" } }
        owner_id: { type: string, format: uuid, description: "The person the machine belongs to (round 38): they see it on the Machines page; absent: nobody's (admins only)" }
    HostList:
      type: object
      required: [hosts]
      properties:
