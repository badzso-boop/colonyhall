            schema: { type: string, format: binary }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: Stored file fetch request
          content: { application/json: { schema: { $ref: "#/components/schemas/FileFetchRequest" } } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }

  /agent/file-fetch/{id}/fail:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: failFileFetchRequest
      tags: [files]
      description: Agents only. Report failure to fetch a requested file.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/FailFileFetchRequest" } } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: Failed file fetch request
          content: { application/json: { schema: { $ref: "#/components/schemas/FileFetchRequest" } } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

