<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Colonyhall (dev)</title>
<style>
  /* Phase 0 developer page. The real UI (React + Vite PWA) arrives in phase 1. */
  :root { --bg:#f4f5f3; --surface:#fff; --fg:#1d211f; --muted:#646b66; --line:#dcdfda; --accent:#a8670f; --agent:#3d5a80; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141715; --surface:#1c201e; --fg:#e6e9e6; --muted:#9aa29c; --line:#303632; --accent:#e0a347; --agent:#93b0d8; color-scheme: dark; } }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.45 system-ui, sans-serif; background:var(--bg); color:var(--fg); }
  header { display:flex; gap:12px; align-items:center; padding:10px 16px; border-bottom:1px solid var(--line); background:var(--surface); flex-wrap:wrap; }
  header b { color:var(--accent); }
  input, button { font:inherit; padding:6px 10px; border:1px solid var(--line); border-radius:6px; background:var(--surface); color:var(--fg); }
  button { cursor:pointer; }
  main { display:grid; grid-template-columns:220px 1fr; height:calc(100vh - 54px); }
  nav { border-right:1px solid var(--line); padding:10px; overflow:auto; }
  nav div { padding:5px 8px; border-radius:6px; cursor:pointer; display:flex; justify-content:space-between; }
  nav div.on { background:var(--surface); font-weight:600; }
  nav .n { color:var(--accent); font-weight:600; }
  section { display:grid; grid-template-rows:1fr auto; min-width:0; }
  #feed { overflow:auto; padding:12px 16px; }
  .msg { padding:6px 0; }
  .who { font-weight:600; } .who.agent { color:var(--agent); }
  .at { color:var(--muted); font-size:12px; margin-left:6px; }
  .body { white-space:pre-wrap; overflow-wrap:anywhere; }
  form { display:flex; gap:8px; padding:10px 16px; border-top:1px solid var(--line); }
  form input { flex:1; }
  #status { color:var(--muted); font-size:12px; margin-left:auto; }
  .msg.reply { margin-left:22px; padding-left:10px; border-left:2px solid var(--line); }
  .re { color:var(--muted); font-size:12px; }
  .acts { display:inline-flex; gap:4px; margin-left:8px; }
  .acts button, .chip { padding:0 6px; font-size:12px; border-radius:10px; }
  .chip.mine { border-color:var(--accent); }
  .chips { display:flex; gap:4px; margin-top:2px; flex-wrap:wrap; }
  #replybar { display:none; padding:4px 16px; font-size:12px; color:var(--muted); border-top:1px solid var(--line); }
  #replybar.on { display:flex; gap:8px; align-items:center; }
  #login { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  #login input { width:9em; }
  details summary { cursor:pointer; color:var(--muted); font-size:12px; }
  .dmbox { display:flex; gap:4px; margin-top:8px; } .dmbox input { width:100%; }
  #hostsPanel { overflow:auto; padding:12px 16px; display:none; }
  #hostsPanel.on { display:block; } #feed.off { display:none; }
  .card { border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin:0 0 12px; background:var(--surface); }
  .card h3 { margin:0 0 4px; font-size:15px; } .muted { color:var(--muted); font-size:12px; }
  .row { display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin:6px 0; }
  .grant { font-family:ui-monospace, monospace; font-size:12px; }
  .warn { color:#b3261e; } code.code { font-size:16px; letter-spacing:1px; }
  #errModal { position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; align-items:center; justify-content:center; padding:16px; z-index:10; }
  #errModal.on { display:flex; }
  #errModal .card { max-width:720px; width:100%; max-height:80vh; overflow:auto; }
  #errModal pre { white-space:pre-wrap; overflow-wrap:anywhere; font-size:12px; }
  @media (max-width:640px) { main { grid-template-columns:1fr; grid-template-rows:auto 1fr; height:auto; min-height:calc(100vh - 54px); }
    nav { border-right:0; border-bottom:1px solid var(--line); max-height:28vh; } section { height:calc(72vh - 54px); } }
</style>
</head>
<body>
<header>
  <b>Colonyhall</b>
  <form id="login">
    <input id="handle" autocomplete="username"><input id="password" type="password" autocomplete="current-password">
    <button id="loginbtn"></button>
    <details><summary>token</summary><input id="token" type="password" size="20" autocomplete="off"></details>
  </form>
  <span id="me"></span><button id="hostsbtn" hidden></button><button id="logout" hidden></button>
  <span id="status"></span>
</header>
<main>
  <nav><div id="channels"></div><div class="dmbox"><input id="dmto" placeholder="@handle"><button id="dmbtn">DM</button></div></nav>
  <section>
    <div id="feed"></div>
    <div id="hostsPanel"></div>
    <div>
      <div id="replybar"><span id="replyto"></span><button id="replycancel">✕</button></div>
      <form id="send"><input id="text" autocomplete="off"><button></button></form>
    </div>
  </section>
</main>
<div id="errModal"><div class="card"><h3 id="errTitle"></h3><div class="muted" id="errMeta"></div><pre id="errDetail"></pre><button id="errClose">✕</button></div></div>
<script>
const I18N = {
  hu: { handle: "név", password: "jelszó", login: "Belépés", logout: "Kilépés", send: "Küldés", message: "Üzenet… (@név megemlít)",
        online: "élő kapcsolat", offline: "nincs kapcsolat", reconnecting: "újracsatlakozás…", reply: "Válasz", replyIn: "Válasz a szálban:", inThread: "a szálban:",
        hosts: "Gépek", chat: "Chat", pair: "Párosítókód", pairHelp: "A gépen futtasd (10 percig érvényes):", revoke: "Visszavonás",
        lastSeen: "utoljára", never: "még soha", roots: "Gyökérmappák", clients: "Kliensek", sandbox: "Sandbox", none: "nincs",
        rejected: "Elutasított engedély", assign: "Agent hozzárendelése", work: "munka", grant: "Mappa engedélyezése",
        read: "olvas", write: "ír", unassign: "Levétel", outside: "a gép gyökérmappáin kívül esik", noHosts: "Még nincs párosított gép.",
        allowUnsandboxed: "sandbox nélkül engedélyezve", yes: "igen", no: "nem", errorDetails: "Hiba részletei" },
  en: { handle: "handle", password: "password", login: "Log in", logout: "Log out", send: "Send", message: "Message… (@name to mention)",
        online: "live", offline: "offline", reconnecting: "reconnecting…", reply: "Reply", replyIn: "Replying in thread:", inThread: "in thread:",
        hosts: "Machines", chat: "Chat", pair: "Pairing code", pairHelp: "Run on the machine (valid for 10 minutes):", revoke: "Revoke",
        lastSeen: "last seen", never: "never", roots: "Roots", clients: "Clients", sandbox: "Sandbox", none: "none",
        rejected: "Refused grant", assign: "Assign agent", work: "work", grant: "Grant folder",
        read: "read", write: "write", unassign: "Remove", outside: "outside the machine's roots", noHosts: "No machine paired yet.",
        allowUnsandboxed: "unsandboxed allowed", yes: "yes", no: "no", errorDetails: "Error details" },
};
const L = I18N[(navigator.language || "hu").slice(0, 2)] || I18N.hu;
const $ = (id) => document.getElementById(id);
$("handle").placeholder = L.handle; $("password").placeholder = L.password; $("loginbtn").textContent = L.login;
$("logout").textContent = L.logout; $("text").placeholder = L.message; document.querySelector("#send button").textContent = L.send;

let token = "", csrf = "", me = null, channels = [], actors = {}, current = null, lastSeq = null, ws = null;
let msgs = new Map(), replyRoot = null;
try { token = localStorage.getItem("colony_token") || ""; } catch {}

// Plain-HTTP pages (e.g. over Tailscale) have no crypto.randomUUID.
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));

async function api(path, opts = {}) {
  const headers = { "Content-Type": "application/json" };
  if (token) headers.Authorization = "Bearer " + token;
  else if (csrf) headers["X-CSRF-Token"] = csrf;
  const res = await fetch(path, { ...opts, headers, credentials: "same-origin" });
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || res.status);
  return res.status === 204 ? null : res.json();
}

function chanLabel(c) {
  if (c.kind !== "dm") return "#" + c.name;
  const others = (c.member_ids || []).filter(id => id !== me.id).map(id => "@" + (actors[id]?.handle || "?"));
  return "✉ " + (others.join(", ") || "@" + me.handle);
}

async function load() {
  const [a, c] = await Promise.all([api("/api/v1/actors"), api("/api/v1/channels")]);
  actors = Object.fromEntries(a.actors.map(x => [x.id, x]));
  channels = c.channels.filter(x => x.is_member);
  renderChannels();
  if (!current && channels.length) await open(channels[0].id);
}

function renderChannels() {
  $("channels").innerHTML = "";
  for (const c of channels) {
    const d = document.createElement("div");
    d.className = c.id === current ? "on" : "";
    d.innerHTML = `<span></span><span class="n">${c.unread > 0 && c.id !== current ? c.unread : ""}</span>`;
    d.firstChild.textContent = chanLabel(c);
    d.onclick = () => open(c.id);
    $("channels").appendChild(d);
  }
}

async function open(id) {
  current = id; setReply(null);
  const r = await api(`/api/v1/channels/${id}/messages?limit=100`);
  msgs = new Map(r.messages.map(m => [m.id, m]));
  renderFeed();
  await api(`/api/v1/channels/${id}/read`, { method: "POST" }).catch(() => {});
  const c = channels.find(x => x.id === id); if (c) c.unread = 0;
  renderChannels();
}

function renderFeed() {
  $("feed").innerHTML = "";
  for (const m of msgs.values()) $("feed").appendChild(renderMsg(m));
  $("feed").scrollTop = $("feed").scrollHeight;
}

function renderMsg(m) {
  const a = actors[m.author_id] || { handle: "?", kind: "human" };
  const div = document.createElement("div");
  div.className = "msg" + (m.thread_root_id ? " reply" : "");
  div.innerHTML = `<div class="re"></div><span class="who ${a.kind}"></span><span class="at"></span>` +
    `<span class="acts"><button data-e="👍">👍</button><button data-e="👎">👎</button><button data-r>${L.reply}</button></span>` +
    `<div class="body"></div><div class="chips"></div>`;
  if (m.thread_root_id) {
    const root = msgs.get(m.thread_root_id);
    div.querySelector(".re").textContent = "↪ " + L.inThread + " " + (root ? root.body.slice(0, 60) : "…");
  }
  div.querySelector(".who").textContent = "@" + a.handle;
  div.querySelector(".at").textContent = new Date(m.created_at).toLocaleTimeString();
  // "[error:<id>]" from the guard: details are for humans, shown on demand.
  const ref = /\[error:([0-9a-f-]{36})\]/.exec(m.body);
  div.querySelector(".body").textContent = ref ? m.body.replace(ref[0], "").trim() : m.body;
  if (ref && me.kind === "human") {
    const btn = el("button", { textContent: L.errorDetails });
    btn.onclick = () => showError(ref[1]);
    div.querySelector(".body").append(" ", btn);
  }
  for (const r of m.reactions || []) {
    const chip = document.createElement("button");
    chip.className = "chip" + (r.actor_ids.includes(me.id) ? " mine" : "");
    chip.textContent = r.emoji + " " + r.count;
    chip.title = r.actor_ids.map(id => "@" + (actors[id]?.handle || "?")).join(", ");
    chip.onclick = () => toggleReaction(m, r.emoji);
    div.querySelector(".chips").appendChild(chip);
  }
  div.querySelectorAll("[data-e]").forEach(b => b.onclick = () => toggleReaction(m, b.dataset.e));
  div.querySelector("[data-r]").onclick = () => setReply(m.thread_root_id || m.id);
  return div;
}

async function showError(id) {
  const e = await api(`/api/v1/errors/${id}`).catch(err => { alert(err.message); return null; });
  if (!e) return;
  $("errTitle").textContent = e.summary;
  $("errMeta").textContent = `@${actors[e.agent_id]?.handle || "?"} · ${new Date(e.created_at).toLocaleString()}`;
  $("errDetail").textContent = e.detail;
  $("errModal").className = "on";
}
$("errClose").onclick = () => { $("errModal").className = ""; };

async function toggleReaction(m, emoji) {
  const mine = (m.reactions || []).some(r => r.emoji === emoji && r.actor_ids.includes(me.id));
  await api(`/api/v1/messages/${m.id}/reactions/${encodeURIComponent(emoji)}`, { method: mine ? "DELETE" : "PUT" }).catch(e => alert(e.message));
}

function setReply(rootId) {
  replyRoot = rootId;
  $("replybar").className = rootId ? "on" : "";
  if (rootId) { const r = msgs.get(rootId); $("replyto").textContent = L.replyIn + " " + (r ? r.body.slice(0, 80) : ""); $("text").focus(); }
}
$("replycancel").onclick = () => setReply(null);

async function refreshMessage(id) {
  // Reactions changed: reload the open channel (cheap at dev-page scale).
  if (!msgs.has(id)) return;
  const r = await api(`/api/v1/channels/${current}/messages?limit=100`);
  msgs = new Map(r.messages.map(m => [m.id, m]));
  const keep = $("feed").scrollTop; renderFeed(); $("feed").scrollTop = keep;
}

function connectWS() {
  const url = (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws/ui";
  ws = new WebSocket(url);
  ws.onopen = () => ws.send(JSON.stringify(token ? { type: "hello", token, last_seq: lastSeq } : { type: "hello", last_seq: lastSeq }));
  ws.onmessage = async (ev) => {
    const f = JSON.parse(ev.data);
    if (f.type === "welcome") { if (lastSeq === null) lastSeq = f.head; $("status").textContent = L.online; }
    if (f.type === "resync_required") { lastSeq = f.head; await load(); }
    if (f.type !== "event") return;
    lastSeq = f.seq;
    const d = f.data || {};
    if (f.event_type === "message.created") {
      if (d.channel_id === current) {
        const m = { id: d.message_id, author_id: d.author_id, body: d.body, created_at: d.created_at, thread_root_id: d.thread_root_id, reactions: [] };
        msgs.set(m.id, m); $("feed").appendChild(renderMsg(m)); $("feed").scrollTop = $("feed").scrollHeight;
        api(`/api/v1/channels/${current}/read`, { method: "POST" }).catch(() => {});
      } else {
        const c = channels.find(x => x.id === d.channel_id);
        if (c) { c.unread++; renderChannels(); } else await load();
      }
    } else if (f.event_type.startsWith("reaction.") && d.channel_id === current) {
      await refreshMessage(d.message_id);
    } else if (f.event_type === "actor.created" || f.event_type.startsWith("channel.")) {
      await load();
    } else if (f.event_type.startsWith("host.") && hostsOpen) {
      renderHosts();
    }
  };
  ws.onclose = () => { $("status").textContent = L.reconnecting; setTimeout(connectWS, 2000); };
}

// --- Machines (admins) ---------------------------------------------------
const el = (tag, props = {}, ...kids) => { const e = document.createElement(tag); Object.assign(e, props); e.append(...kids); return e; };
let hostsOpen = false;
$("hostsbtn").textContent = L.hosts;
$("hostsbtn").onclick = () => { hostsOpen = !hostsOpen; $("hostsbtn").textContent = hostsOpen ? L.chat : L.hosts;
  $("feed").className = hostsOpen ? "off" : ""; $("hostsPanel").className = hostsOpen ? "on" : ""; if (hostsOpen) renderHosts(); };

async function renderHosts() {
  const panel = $("hostsPanel");
  const { hosts } = await api("/api/v1/hosts");
  panel.innerHTML = "";
  const pairBox = el("div", { className: "card" });
  const pairBtn = el("button", { textContent: L.pair });
  pairBtn.onclick = async () => {
    const pc = await api("/api/v1/hosts/pairing-codes", { method: "POST" }).catch(e => alert(e.message));
    if (!pc) return;
    pairBox.querySelector(".pairout")?.remove();
    pairBox.append(el("div", { className: "pairout" }, el("div", { className: "muted", textContent: L.pairHelp }),
      el("code", { className: "code", textContent: pc.code }), el("pre", { className: "grant",
        textContent: `colony guard enroll -server ${location.origin} -code ${pc.code} -name <gép-neve>` })));
  };
  pairBox.append(pairBtn);
  panel.append(pairBox);
  if (!hosts.length) panel.append(el("p", { className: "muted", textContent: L.noHosts }));
  const agents = Object.values(actors).filter(a => a.kind === "agent");
  for (const h of hosts) {
    const c = el("div", { className: "card" });
    const seen = h.last_seen_at ? new Date(h.last_seen_at).toLocaleString() : L.never;
    c.append(el("h3", { textContent: `${h.name} · ${h.state}` }), el("div", { className: "muted", textContent: `${L.lastSeen}: ${seen} · ${h.report.os || ""} · guard ${h.report.guard_version || "?"}` }));
    c.append(el("div", { className: "muted", textContent: `${L.roots}: ${(h.report.roots || []).join(", ") || L.none}` }));
    c.append(el("div", { className: "muted", textContent: `${L.clients}: ${(h.report.clients || []).map(x => x.name + (x.version ? " " + x.version : "")).join(", ") || L.none} · ${L.sandbox}: ${h.report.sandbox || L.none} · ${L.allowUnsandboxed}: ${h.report.allow_unsandboxed ? L.yes : L.no}` }));
    for (const r of h.report.rejected || []) c.append(el("div", { className: "warn grant", textContent: `${L.rejected}: @${actors[r.agent_id]?.handle || "?"} ${r.path} — ${r.reason}` }));
    if (h.state === "approved") {
      const rv = el("button", { textContent: L.revoke });
      rv.onclick = async () => { if (confirm(h.name + ": " + L.revoke + "?")) { await api(`/api/v1/hosts/${h.id}/state`, { method: "PUT", body: JSON.stringify({ state: "revoked" }) }).catch(e => alert(e.message)); renderHosts(); } };
      c.append(el("div", { className: "row" }, rv));
    }
    for (const a of h.agents) {
      const box = el("div", { className: "card" });
      const details = [
        a.client,
        a.mode || "compact",
        a.root_dir || "",
        a.sandbox ? "sandbox" : "no-sandbox",
        a.permission_mode || "",
        a.model || "-",
        a.allow_work ? L.work + ": " + (a.work_model || "-") : ""
      ].filter(Boolean).join(" · ");
      box.append(el("b", { textContent: `@${a.handle}` }), el("span", { className: "muted", textContent: ` · ${details}` }));
      const un = el("button", { textContent: L.unassign });
      un.onclick = async () => { await api(`/api/v1/agents/${a.agent_id}/host`, { method: "DELETE" }).catch(e => alert(e.message)); renderHosts(); };
      box.append(" ", un);
      for (const g of a.grants) {
        const x = el("button", { textContent: "✕" });
        x.onclick = async () => { await api(`/api/v1/grants/${g.id}`, { method: "DELETE" }).catch(e => alert(e.message)); renderHosts(); };
        box.append(el("div", { className: "row grant" }, `${g.mode === "write" ? L.write : L.read} · ${g.path} `, x));
      }
      const path = el("input", { placeholder: "/abs/path", size: 28 });
      const mode = el("select", {}, el("option", { value: "read", textContent: L.read }), el("option", { value: "write", textContent: L.write }));
      const add = el("button", { textContent: L.grant });
      add.onclick = async () => {
        const g = await api(`/api/v1/agents/${a.agent_id}/grants`, { method: "POST", body: JSON.stringify({ path: path.value.trim(), mode: mode.value }) }).catch(e => alert(e.message));
        if (g && g.outside_roots) alert(g.path + ": " + L.outside);
        renderHosts();
      };
      box.append(el("div", { className: "row" }, path, mode, add));
      c.append(box);
    }
    if (h.state === "approved") {
      const sel = el("select", {}, ...agents.map(a => el("option", { value: a.id, textContent: "@" + a.handle })));
      const client = el("select", {}, el("option", { value: "claude-code", textContent: "claude-code" }), el("option", { value: "antigravity", textContent: "antigravity" }));
      const mode = el("select", {}, el("option", { value: "direct", textContent: "direct" }), el("option", { value: "compact", textContent: "compact" }));
      const rootDir = el("input", { placeholder: "root dir (/path)", size: 16 });
      const permMode = el("select", {},
        el("option", { value: "auto", textContent: "auto" }),
        el("option", { value: "acceptEdits", textContent: "acceptEdits" }),
        el("option", { value: "default", textContent: "default" }),
        el("option", { value: "plan", textContent: "plan" }),
        el("option", { value: "bypassPermissions", textContent: "bypassPermissions (!)" })
      );
      const sandbox = el("input", { type: "checkbox" });
      const model = el("input", { placeholder: "model (haiku)", size: 14 });
      const wmodel = el("input", { placeholder: "work model", size: 12 });
      const work = el("input", { type: "checkbox" });
      const go = el("button", { textContent: L.assign });
      go.onclick = async () => {
        await api(`/api/v1/agents/${sel.value}/host`, { method: "PUT", body: JSON.stringify({
          host_id: h.id, client: client.value, mode: mode.value, root_dir: rootDir.value.trim(),
          sandbox: sandbox.checked, permission_mode: permMode.value,
          model: model.value.trim(), work_model: wmodel.value.trim(), allow_work: work.checked
        }) }).catch(e => alert(e.message));
        renderHosts();
      };
      c.append(el("div", { className: "row" }, sel, client, mode, rootDir, permMode, el("label", {}, sandbox, " sandbox"), model, wmodel, el("label", {}, work, " " + L.work), go));
    }
    panel.append(c);
  }
}

async function start() {
  const s = await api("/api/v1/auth/session");
  me = s.actor; csrf = s.csrf_token || "";
  $("login").hidden = true; $("logout").hidden = false; $("me").textContent = "@" + me.handle;
  $("hostsbtn").hidden = !(me.kind === "human" && (me.role === "owner" || me.role === "admin"));
  await load(); if (!ws) connectWS();
}

$("login").onsubmit = async (e) => {
  e.preventDefault();
  const t = $("token").value.trim();
  try {
    if (t) { token = t; try { localStorage.setItem("colony_token", t); } catch {} }
    else {
      token = "";
      const res = await fetch("/api/v1/auth/login", { method: "POST", headers: { "Content-Type": "application/json" }, credentials: "same-origin",
        body: JSON.stringify({ handle: $("handle").value.trim().replace(/^@/, ""), password: $("password").value }) });
      if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || res.status);
      $("password").value = "";
    }
    await start();
  } catch (err) { $("status").textContent = err.message; }
};

$("logout").onclick = async () => {
  await api("/api/v1/auth/logout", { method: "POST" }).catch(() => {});
  try { localStorage.removeItem("colony_token"); } catch {}
  location.reload();
};

$("dmbtn").onclick = async () => {
  const h = $("dmto").value.trim().replace(/^@/, "");
  const a = Object.values(actors).find(x => x.handle === h);
  if (!a) { alert("?" + h); return; }
  const c = await api("/api/v1/dms", { method: "POST", body: JSON.stringify({ actor_ids: [a.id] }) }).catch(e => alert(e.message));
  if (c) { $("dmto").value = ""; await load(); await open(c.id); }
};

$("send").onsubmit = async (e) => {
  e.preventDefault();
  const body = $("text").value.trim();
  if (!body || !current) return;
  $("text").value = "";
  const req = { body, client_msg_id: uid() };
  if (replyRoot) req.thread_root_id = replyRoot;
  await api(`/api/v1/channels/${current}/messages`, { method: "POST", body: JSON.stringify(req) }).catch(err => alert(err.message));
};

$("status").textContent = L.offline;
start().catch(() => {});
</script>
</body>
</html>
