<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Colonyhall (dev)</title>
<style>
  /* Phase 0 developer page. The real UI (React + Vite PWA) arrives in phase 1. */
  :root { --bg:#f4f5f3; --surface:#fff; --fg:#1d211f; --muted:#646b66; --line:#dcdfda; --accent:#a8670f; --agent:#3d5a80; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141715; --surface:#1c201e; --fg:#e6e9e6; --muted:#9aa29c; --line:#303632; --accent:#e0a347; --agent:#93b0d8; color-scheme: dark; } }
  * { box-sizing: border-box; }
  [hidden] { display:none !important; }  /* display:flex rules must not resurrect hidden elements (the login form) */
  body { margin:0; font:14px/1.45 system-ui, sans-serif; background:var(--bg); color:var(--fg); display:flex; flex-direction:column; height:100vh; height:100dvh; }
  header { flex:none; display:flex; gap:12px; align-items:center; padding:10px 16px; border-bottom:1px solid var(--line); background:var(--surface); flex-wrap:wrap; }
  header #tabs { display:flex; gap:6px; flex-wrap:wrap; border:0; padding:0; overflow:visible; }
  header #tabs button.on { border-color:var(--accent); color:var(--accent); font-weight:600; }
  header b { color:var(--accent); }
  input, button { font:inherit; padding:6px 10px; border:1px solid var(--line); border-radius:6px; background:var(--surface); color:var(--fg); }
  button { cursor:pointer; }
  main { flex:1; min-height:0; display:grid; grid-template-columns:220px 1fr; position:relative; }
  .overview-panel { display:none; position:absolute; top:0; right:0; bottom:0; width:380px; background:var(--surface); border-left:1px solid var(--line); overflow-y:auto; padding:16px; z-index:5; box-shadow:-2px 0 8px rgba(0,0,0,0.06); flex-direction:column; gap:16px; }
  .overview-panel.on { display:flex; }
  .overview-header { display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--line); padding-bottom:8px; }
  .overview-close { border:none; background:transparent; font-size:16px; cursor:pointer; color:var(--muted); }
  .overview-close:hover { color:var(--fg); }
  .overview-body { display:flex; flex-direction:column; gap:14px; font-size:13px; }
  .overview-section { display:flex; flex-direction:column; gap:6px; border-bottom:1px solid var(--line); padding-bottom:12px; }
  .overview-section h4 { margin:0 0 4px; font-size:12px; text-transform:uppercase; letter-spacing:0.04em; color:var(--muted); }
  .overview-avatar { font-size:32px; line-height:1; }
  main > nav { border-right:1px solid var(--line); padding:10px; overflow:auto; display:flex; flex-direction:column; }
  main > nav > * { flex-shrink:0; }
  #channels { display:flex; flex-direction:column; }
  .sec-actions-bar { display:flex; justify-content:flex-end; padding:2px 0 6px; }
  .sec-actions-bar button { padding:2px 8px; font-size:11px; }
  .sec-header { display:flex; align-items:center; justify-content:space-between; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.04em; color:var(--muted); margin:10px 0 2px 4px; }
  .sec-title-wrap { display:flex; align-items:center; gap:4px; cursor:pointer; flex:1; min-width:0; }
  .sec-arrow { font-size:9px; user-select:none; }
  .sec-title { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sec-acts { display:flex; gap:2px; }
  .sec-acts button, .chan-acts button { padding:1px 4px; font-size:10px; line-height:1; border:0; background:transparent; color:var(--muted); border-radius:3px; }
  .sec-acts button:hover, .chan-acts button:hover { background:var(--line); color:var(--fg); }
  .chan-meta { display:flex; align-items:center; gap:4px; }
  .chan-acts { display:none; gap:2px; }
  .chan-item:hover .chan-acts { display:flex; }
  .group-header { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.04em; color:var(--muted); margin:10px 0 2px 4px; }
  .chan-item { padding:5px 8px; border-radius:6px; cursor:pointer; display:flex; justify-content:space-between; align-items:center; }
  .chan-item.on { background:var(--surface); font-weight:600; }
  nav .n { color:var(--accent); font-weight:600; }
  section { display:grid; grid-template-rows:auto minmax(0,1fr) auto; min-width:0; min-height:0; }
  /* Fixed rows: the channel header is hidden on panels, the feed or the open panel fills the middle. */
  #chanHeader { grid-row:1; } section > div:not(#chanHeader):not(:last-child) { grid-row:2; } section > div:last-child { grid-row:3; }
  #feed { overflow:auto; padding:12px 16px; }
  .msg { padding:6px 0; }
  .who { font-weight:600; } .who.agent { color:var(--agent); } .who.system { color:var(--accent); }
  .at { color:var(--muted); font-size:12px; margin-left:6px; }
  .body { overflow-wrap:anywhere; }
  form { display:flex; gap:8px; padding:10px 16px; border-top:1px solid var(--line); }
  form input { flex:1; }
  #status { color:var(--muted); font-size:12px; margin-left:auto; }
  .msg.reply { margin-left:22px; padding-left:10px; border-left:2px solid var(--line); }
  .re { color:var(--muted); font-size:12px; }
  .acts { display:inline-flex; gap:4px; margin-left:8px; }
  .acts button, .chip { padding:0 6px; font-size:12px; border-radius:10px; }
  .chip.mine { border-color:var(--accent); }
  .chips { display:flex; gap:4px; margin-top:2px; flex-wrap:wrap; }
  #replybar { display:none; padding:4px 16px; font-size:12px; color:var(--muted); border-top:1px solid var(--line); }
  #replybar.on { display:flex; gap:8px; align-items:center; }
  .attachments { display:flex; flex-wrap:wrap; gap:8px; margin-top:6px; }
  .attachment-img { max-width:240px; max-height:180px; border-radius:6px; border:1px solid var(--line); object-fit:cover; display:block; cursor:pointer; }
  .attachment-link { display:inline-flex; align-items:center; gap:4px; padding:4px 8px; border:1px solid var(--line); border-radius:6px; background:var(--surface); text-decoration:none; color:var(--fg); font-size:12px; }
  .attachment-link:hover { border-color:var(--accent); }
  .file-chip { display:inline-flex; align-items:center; gap:6px; padding:2px 8px; border:1px solid var(--accent); border-radius:12px; font-size:12px; background:var(--surface); }
  .file-chip button { border:none; background:none; padding:0 2px; cursor:pointer; font-size:11px; color:var(--muted); }
  #attachedFiles { display:none; gap:6px; flex-wrap:wrap; padding:4px 16px; }
  #attachedFiles.on { display:flex; }
  #clipbtn { padding:4px 8px; font-size:14px; }
  #login { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  #login input { width:9em; }
  details summary { cursor:pointer; color:var(--muted); font-size:12px; }
  .dmbox { display:flex; gap:4px; margin-top:8px; } .dmbox input { width:100%; }
  #hostsPanel, #schedPanel, #runsPanel, #wikiPanel, #questionsPanel, #rulesPanel, #leasesPanel { overflow:auto; padding:12px 16px; display:none; }
  #schedPanel.on, #hostsPanel.on, #runsPanel.on, #wikiPanel.on, #questionsPanel.on, #rulesPanel.on, #leasesPanel.on { display:block; } #feed.off { display:none; }
  table.tbl { width:100%; border-collapse:collapse; font-size:13px; margin-top:6px; }
  table.tbl th, table.tbl td { padding:6px 8px; border:1px solid var(--line); text-align:left; }
  table.tbl th { background:var(--bg); font-weight:600; }
  table.tbl td.num, table.tbl th.num { text-align:right; font-variant-numeric:tabular-nums; }
  .card { border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin:0 0 12px; background:var(--surface); }
  .card h3 { margin:0 0 4px; font-size:15px; } .muted { color:var(--muted); font-size:12px; }
  .row { display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin:6px 0; }
  .grant { font-family:ui-monospace, monospace; font-size:12px; }
  .warn { color:#b3261e; } code.code { font-size:16px; letter-spacing:1px; }
  .link-cards { display:flex; flex-direction:column; gap:4px; margin-top:4px; }
  .link-card { display:inline-flex; gap:6px; align-items:center; background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:3px 8px; font-size:12px; width:fit-content; }
  .link-card a { color:var(--accent); text-decoration:none; font-weight:500; }
  .link-card a:hover { text-decoration:underline; }
  .link-card .badge { border:1px solid var(--line); border-radius:4px; padding:1px 5px; font-size:11px; background:var(--bg); }
  #chanHeader { display:flex; align-items:center; justify-content:space-between; padding:8px 16px; border-bottom:1px solid var(--line); background:var(--surface); gap:8px; }
  #chanInfo { display:flex; align-items:baseline; gap:8px; min-width:0; overflow:hidden; }
  #chanTitle { font-weight:700; font-size:15px; white-space:nowrap; }
  #chanDesc { font-size:12px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #errModal, #appModal, .modal { position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; align-items:center; justify-content:center; padding:16px; z-index:10; }
  #errModal.on, #appModal.on, .modal.on { display:flex; }
  #errModal .card, #appModal .card, .modal .card { max-width:720px; width:100%; max-height:85vh; overflow:auto; background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:16px; display:flex; flex-direction:column; gap:10px; }
  #errModal pre, #appModal pre { white-space:pre-wrap; overflow-wrap:anywhere; font-size:12px; }
  .modal-list { max-height:220px; overflow-y:auto; border:1px solid var(--line); border-radius:6px; padding:6px; display:flex; flex-direction:column; gap:4px; }
  .modal-row { display:flex; align-items:center; justify-content:space-between; padding:4px 6px; border-radius:4px; }
  .modal-row:hover { background:var(--bg); }
  .modal-row label { display:flex; align-items:center; gap:6px; cursor:pointer; flex:1; }
  .file-chip { display:inline-flex; align-items:center; gap:4px; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:1px 8px; font-size:12px; color:var(--fg); cursor:pointer; margin:0 2px; vertical-align:middle; font-family:inherit; }
  .file-chip:hover { background:var(--hover); border-color:var(--accent); }
  #fileViewerModal { position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; align-items:center; justify-content:center; padding:16px; z-index:20; }
  #fileViewerModal.on { display:flex; }
  #fileViewerModal .card { max-width:850px; width:100%; max-height:88vh; overflow:hidden; background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:16px; display:flex; flex-direction:column; gap:10px; }
  #fileViewerModal .viewer-header { display:flex; align-items:center; justify-content:space-between; gap:8px; border-bottom:1px solid var(--line); padding-bottom:8px; flex-wrap:wrap; }
  #fileViewerModal .viewer-body { flex:1; overflow:auto; min-height:200px; }
  #fileViewerModal pre.file-view-mono { margin:0; font-family:ui-monospace, monospace; font-size:12px; white-space:pre-wrap; word-break:break-all; }
  #fileViewerModal img.file-view-img { max-width:100%; max-height:65vh; object-fit:contain; display:block; margin:0 auto; }
  /* Markdown styling for chat and file viewer */
  .chat-heading { font-weight:600; margin:6px 0 2px; }
  .chat-h1 { font-size:1.18em; }
  .chat-h2 { font-size:1.1em; }
  .chat-h3, .chat-h4, .chat-h5, .chat-h6 { font-size:1em; }
  .md-p { margin:4px 0; }
  .msg .body .md-p:first-child { margin-top:0; }
  .msg .body .md-p:last-child { margin-bottom:0; }
  .code-block-wrap { margin:6px 0; border:1px solid var(--line); border-radius:6px; overflow:hidden; background:var(--bg); max-width:100%; }
  .code-block-header { display:flex; justify-content:space-between; align-items:center; padding:3px 8px; background:var(--surface); border-bottom:1px solid var(--line); font-size:11px; }
  .code-lang { color:var(--muted); font-family:ui-monospace, monospace; text-transform:lowercase; }
  .copy-btn { border:1px solid var(--line); background:var(--bg); border-radius:4px; padding:1px 6px; font-size:11px; cursor:pointer; color:var(--fg); }
  .copy-btn:hover { border-color:var(--accent); }
  .code-block-wrap pre { margin:0; padding:8px; overflow-x:auto; font-family:ui-monospace, monospace; font-size:12px; }
  .code-block-wrap code { padding:0; background:none; font-family:ui-monospace, monospace; font-size:12px; }
  .md-quote { border-left:3px solid var(--line); padding-left:8px; margin:4px 0; color:var(--muted); }
  .md-list { margin:4px 0 4px 20px; padding:0; }
  .md-list li { margin:2px 0; }
  .md-list .md-list { margin:2px 0 2px 16px; }
  .md-table { overflow-x:auto; margin:6px 0; max-width:100%; }
  .md-table table { border-collapse:collapse; font-size:13px; }
  .md-table th, .md-table td { border:1px solid var(--line); padding:4px 8px; text-align:left; white-space:nowrap; }
  .md-table th { background:var(--bg); font-weight:600; }
  .md-hr { border:none; border-top:1px solid var(--line); margin:8px 0; }
  .mention { color:var(--accent); font-weight:500; cursor:pointer; border-radius:3px; padding:0 2px; }
  .mention:hover { text-decoration:underline; }
  .body code, .markdown-body code { font-family:ui-monospace, monospace; font-size:12px; background:var(--surface); border:1px solid var(--line); padding:0 3px; border-radius:3px; }
  .body a, .markdown-body a { color:var(--accent); text-decoration:none; }
  .body a:hover, .markdown-body a:hover { text-decoration:underline; }
  .msg .body.collapsible.collapsed { max-height:340px; overflow:hidden; position:relative; }
  .msg .body.collapsible.collapsed .msg-fade { display:block; }
  .msg-fade { display:none; position:absolute; bottom:0; left:0; right:0; height:60px; background:linear-gradient(transparent, var(--bg)); pointer-events:none; }
  .msg-collapse-btn { display:inline-flex; align-items:center; gap:4px; margin-top:4px; font-size:12px; color:var(--accent); background:none; border:none; cursor:pointer; padding:2px 0; font-weight:500; }
  .msg-collapse-btn:hover { text-decoration:underline; }
  #fileViewerModal .markdown-body h1, #fileViewerModal .markdown-body h2, #fileViewerModal .markdown-body h3, #fileViewerModal .markdown-body h4 { margin:12px 0 6px; }
  #fileViewerModal .markdown-body p { margin:6px 0; }
  #fileViewerModal .markdown-body .md-table { overflow-x:auto; margin:8px 0; }
  #fileViewerModal .markdown-body hr { margin:12px 0; }
  #fileViewerModal .markdown-body ul, #fileViewerModal .markdown-body ol { margin:6px 0 6px 20px; }
  @media (max-width:640px) { main { grid-template-columns:1fr; grid-template-rows:auto minmax(0,1fr); }
    main > nav { border-right:0; border-bottom:1px solid var(--line); max-height:28vh; }
    header { gap:6px; padding:6px 10px; } header #tabs { gap:4px; } header #tabs button { padding:3px 7px; font-size:13px; }
    .overview-panel { position:fixed; inset:0; width:100vw; height:100vh; height:100dvh; border-left:none; z-index:25; }
    #fileViewerModal { padding:0; }
    #fileViewerModal .card { max-width:100%; width:100%; height:100vh; height:100dvh; max-height:100vh; max-height:100dvh; border-radius:0; border:none; } }
</style>
</head>
<body>
<header>
  <b>Colonyhall</b>
  <form id="login">
    <input id="handle" autocomplete="username"><input id="password" type="password" autocomplete="current-password">
    <button id="loginbtn"></button>
    <details><summary>token</summary><input id="token" type="password" size="20" autocomplete="off"></details>
  </form>
  <span id="me"></span><nav id="tabs"><button id="chatbtn" hidden></button><button id="runsbtn" hidden></button><button id="schedbtn" hidden></button><button id="questionsbtn" hidden></button><button id="wikibtn" hidden></button><button id="rulesbtn" hidden></button><button id="leasesbtn" hidden></button><button id="hostsbtn" hidden></button></nav><button id="logout" hidden></button>
  <span id="status"></span>
</header>
<main>
  <nav><div id="channels"></div><div class="dmbox"><input id="dmto" placeholder="@handle"><button id="dmbtn">DM</button></div></nav>
  <section>
    <div id="chanHeader">
      <div id="chanInfo">
        <span id="chanTitle"></span>
        <span id="chanDesc"></span>
      </div>
      <div id="chanActs">
        <button id="chanMembersBtn" style="display:none"></button>
      </div>
    </div>
    <div id="feed"></div>
    <div id="hostsPanel"></div>
    <div id="schedPanel"></div>
    <div id="runsPanel"></div>
    <div id="wikiPanel"></div>
    <div id="questionsPanel"></div>
    <div id="rulesPanel"></div>
    <div id="leasesPanel"></div>
    <div>
      <div id="replybar"><span id="replyto"></span><button id="replycancel">✕</button></div>
      <div id="activityBar" style="display:none; padding:4px 16px; font-size:12px; color:var(--muted); font-style:italic;"></div>
      <div id="attachedFiles"></div>
      <form id="send">
        <input type="file" id="fileinput" style="display:none">
        <button type="button" id="clipbtn" title="Fájl csatolása">📎</button>
        <input id="text" autocomplete="off">
        <button></button>
      </form>
    </div>
  </section>
  <aside id="overviewPanel" class="overview-panel">
    <div class="overview-header">
      <h3 id="overviewTitle" style="margin:0;">Profil</h3>
      <button id="overviewClose" class="overview-close">✕</button>
    </div>
    <div id="overviewBody" class="overview-body"></div>
  </aside>
</main>
<div id="errModal"><div class="card"><h3 id="errTitle"></h3><div class="muted" id="errMeta"></div><pre id="errDetail"></pre><button id="errClose">✕</button></div></div>
<div id="appModal"><div class="card"><h3 id="appTitle"></h3><div class="muted" id="appMeta"></div><pre id="appDetail"></pre><div class="row" id="appActions"></div><button id="appClose">✕</button></div></div>
<div id="chanModal" class="modal">
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <h3 style="margin:0" id="chanModalTitle"></h3>
      <button id="chanModalClose">✕</button>
    </div>
    <input id="newChanName" autocomplete="off">
    <input id="newChanDesc" maxlength="250" autocomplete="off">
    <div class="row" style="gap:16px;">
      <label><input type="radio" name="newChanKind" value="public" checked> <span id="lblPublic"></span></label>
      <label><input type="radio" name="newChanKind" value="private"> <span id="lblPrivate"></span></label>
    </div>
    <div>
      <div style="font-weight:600;margin-bottom:4px;" id="lblSelectMembers"></div>
      <input id="newChanMemberFilter" style="width:100%;margin-bottom:6px;" autocomplete="off">
      <div id="newChanMemberList" class="modal-list"></div>
    </div>
    <div class="row" style="justify-content:flex-end;gap:8px;">
      <button id="newChanSubmit" class="on"></button>
    </div>
  </div>
</div>
<div id="membersModal" class="modal">
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <h3 style="margin:0" id="membersModalTitle"></h3>
      <button id="membersModalClose">✕</button>
    </div>
    <div id="membersList" class="modal-list" style="max-height:300px;"></div>
    <div id="addMemberSection" style="display:none;border-top:1px solid var(--line);padding-top:10px;">
      <div style="font-weight:600;margin-bottom:6px;" id="lblAddMember"></div>
      <div class="row" style="gap:8px;">
        <select id="addMemberSelect" style="flex:1;"></select>
        <button id="addMemberBtn"></button>
      </div>
    </div>
  </div>
</div>
<div id="fileViewerModal">
  <div class="card">
    <div class="viewer-header">
      <div style="display:flex;align-items:center;gap:8px;flex:1;min-width:0;">
        <span style="font-size:16px;">📄</span>
        <strong id="fileViewerPath" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"></strong>
        <span id="fileViewerAgent" class="muted"></span>
      </div>
      <div style="display:flex;align-items:center;gap:8px;">
        <span id="fileViewerStatus" class="muted" style="font-size:12px;"></span>
        <button id="fileViewerRefresh" class="secondary" style="font-size:12px;display:none;"></button>
        <button id="fileViewerClose">✕</button>
      </div>
    </div>
    <div id="fileViewerControls" class="row" style="display:none;gap:8px;align-items:center;"></div>
    <div id="fileViewerBody" class="viewer-body"></div>
  </div>
</div>
<script src="markdown.js"></script>
<script>
const I18N = {
  hu: { handle: "név", password: "jelszó", login: "Belépés", logout: "Kilépés", send: "Küldés", message: "Üzenet… (@név megemlít)",
        online: "élő kapcsolat", offline: "nincs kapcsolat", reconnecting: "újracsatlakozás…", reply: "Válasz", replyIn: "Válasz a szálban:", inThread: "a szálban:",
        hosts: "Gépek", chat: "Chat", schedules: "Ütemezés", wiki: "Wiki", questions: "Válaszra vár", pair: "Párosítókód", pairHelp: "A gépen futtasd (10 percig érvényes):", revoke: "Visszavonás",
        lastSeen: "utoljára", never: "még soha", roots: "Gyökérmappák", clients: "Kliensek", sandbox: "Sandbox", none: "nincs",
        rejected: "Elutasított engedély", assign: "Agent hozzárendelése", work: "munka", grant: "Mappa engedélyezése",
        read: "olvas", write: "ír", unassign: "Levétel", outside: "a gép gyökérmappáin kívül esik", noHosts: "Még nincs párosított gép.",
        allowUnsandboxed: "sandbox nélkül engedélyezve", yes: "igen", no: "nem", errorDetails: "Hiba részletei",
        runs: "Futások", today: "Ma", last7Days: "Elmúlt 7 nap", period: "Időszak", tokensIn: "In", tokensOut: "Out",
        tokensTotal: "Összes", runsCount: "Futás", errorsCount: "Hiba", recentRuns: "Legutóbbi 20 futás", time: "Idő",

try { token = localStorage.getItem("colony_token") || ""; } catch {}

// Plain-HTTP pages (e.g. over Tailscale) have no crypto.randomUUID.
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const el = (tag, props = {}, ...kids) => { const e = document.createElement(tag); Object.assign(e, props); e.append(...kids); return e; };
const formatBytes = (bytes) => {
  if (!bytes || bytes < 1024) return (bytes || 0) + " B";
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
  return (bytes / (1024 * 1024)).toFixed(1) + " MB";
};

async function api(path, opts = {}) {
  const headers = Object.assign({}, opts.headers);
  if (!opts.body || !(opts.body instanceof FormData)) {
    if (!headers["Content-Type"]) headers["Content-Type"] = "application/json";
  }
  if (token) headers.Authorization = "Bearer " + token;
  else if (csrf) headers["X-CSRF-Token"] = csrf;
  const res = await fetch(path, { ...opts, headers, credentials: "same-origin" });
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || res.status);
  return res.status === 204 ? null : res.json();
}

function chanLabel(c) {
  if (c.kind !== "dm") return "#" + c.name;
  const others = (c.member_ids || []).filter(id => id !== me.id).map(id => {
    const act = actors[id];
    return (act?.avatar_emoji ? act.avatar_emoji + " " : "") + "@" + (act?.handle || "?");
  });
  return "✉ " + (others.join(", ") || (me?.avatar_emoji ? me.avatar_emoji + " " : "") + "@" + me.handle);
}

async function loadSections() {
  if (me?.kind === "human") {
    try {
      const res = await api("/api/v1/sidebar/sections");
      sidebarSections = res.sections || [];
    } catch {
      sidebarSections = [];
    }
  } else {
    sidebarSections = [];
  }
}

async function load() {
  const [a, c] = await Promise.all([api("/api/v1/actors"), api("/api/v1/channels")]);
  actors = Object.fromEntries(a.actors.map(x => [x.id, x]));
  channels = c.channels.filter(x => x.is_member);
  await loadSections();
  renderChannels();
  if (!current && channels.length) await open(channels[0].id);
}

function createChanItem(c, inSectionId, itIdx, totalItems) {
  const d = el("div", {
    className: "chan-item" + (c.id === current ? " on" : ""),
    onclick: () => open(c.id),
  });
  const label = el("span", { textContent: chanLabel(c) });
  const meta = el("div", { className: "chan-meta" });
  if (c.unread > 0 && c.id !== current) {
    meta.append(el("span", { className: "n", textContent: String(c.unread) }));
  }
  if (me?.kind === "human") {
    const acts = el("div", { className: "chan-acts" });
    if (inSectionId) {
      if (itIdx > 0) {
        acts.append(el("button", {
          textContent: "↑",
          title: "Fel",
          onclick: async (e) => {
            e.stopPropagation();
            const sec = sidebarSections.find(s => s.id === inSectionId);
            if (!sec) return;
            const ids = (sec.items || []).map(x => x.channel_id);
            const tmp = ids[itIdx - 1];
            ids[itIdx - 1] = ids[itIdx];
            ids[itIdx] = tmp;
            try {
              await api(`/api/v1/sidebar/sections/${inSectionId}/reorder`, {
                method: "PUT",
                body: JSON.stringify({ channel_ids: ids }),
              });
              await loadSections();
              renderChannels();
            } catch (err) { alert(err.message); }
          }
        }));
      }
      if (itIdx < totalItems - 1) {
        acts.append(el("button", {
          textContent: "↓",
          title: "Le",
          onclick: async (e) => {
            e.stopPropagation();
            const sec = sidebarSections.find(s => s.id === inSectionId);
            if (!sec) return;
            const ids = (sec.items || []).map(x => x.channel_id);
            const tmp = ids[itIdx + 1];
            ids[itIdx + 1] = ids[itIdx];
            ids[itIdx] = tmp;
            try {
              await api(`/api/v1/sidebar/sections/${inSectionId}/reorder`, {
                method: "PUT",
                body: JSON.stringify({ channel_ids: ids }),
              });
              await loadSections();
              renderChannels();
            } catch (err) { alert(err.message); }
          }
        }));
      }
      acts.append(el("button", {
        textContent: "✕",
        title: L.removeFromSection,
        onclick: async (e) => {
          e.stopPropagation();
          try {
            await api(`/api/v1/sidebar/sections/${inSectionId}/channels/${c.id}`, { method: "DELETE" });
            await loadSections();
            renderChannels();
          } catch (err) { alert(err.message); }
        }
      }));
    } else if (sidebarSections.length > 0) {
      acts.append(el("button", {
        textContent: "↳",
        title: L.moveToSection,
        onclick: async (e) => {
          e.stopPropagation();
          const list = sidebarSections.map((s, i) => `${i + 1}: ${s.name}`).join("\n");
          const ans = prompt(`${L.section}:\n${list}`);
          if (!ans) return;
          const idx = parseInt(ans, 10) - 1;
          if (idx >= 0 && idx < sidebarSections.length) {
            try {
              await api(`/api/v1/sidebar/sections/${sidebarSections[idx].id}/channels/${c.id}`, {
                method: "PUT",
                body: JSON.stringify({}),
              });
              await loadSections();
              renderChannels();
            } catch (err) { alert(err.message); }
          }
        }
      }));
    }
    meta.append(acts);
  }
  d.append(label, meta);
  return d;
}

function renderChannels() {
  const container = $("channels");
  container.innerHTML = "";

  if (me?.kind === "human") {
    const topBar = el("div", { className: "sec-actions-bar" });
    const addChanBtn = el("button", {
      textContent: "+ " + (L.newChannel || "csatorna"),
      style: "margin-right:6px;",
      onclick: (e) => {
        e.stopPropagation();
        showNewChannelModal();
      }
    });
    topBar.append(addChanBtn);
    topBar.append(el("button", {
      textContent: "+ " + (L.section || "szekció"),
      onclick: async (e) => {
        e.stopPropagation();
        const name = prompt(L.newSectionName || "Új szekció neve:");
        if (!name || !name.trim()) return;
        try {
          await api("/api/v1/sidebar/sections", {
            method: "POST",
            body: JSON.stringify({ name: name.trim() })
          });
          await loadSections();
          renderChannels();
        } catch (err) { alert(err.message); }
      }
    }));
    container.append(topBar);
  }

  const chanMap = new Map(channels.map(c => [c.id, c]));
  const inSection = new Set();

  for (let sIdx = 0; sIdx < sidebarSections.length; sIdx++) {
    const s = sidebarSections[sIdx];
    for (const it of s.items || []) inSection.add(it.channel_id);

    const secEl = el("div", { className: "sec-block" });
    const hdr = el("div", { className: "sec-header" });
    const arrow = el("span", { className: "sec-arrow", textContent: s.collapsed ? "▶ " : "▼ " });
    const title = el("span", { className: "sec-title", textContent: s.name });
    const titleWrap = el("div", {
      className: "sec-title-wrap",
      onclick: async () => {
        try {
          await api(`/api/v1/sidebar/sections/${s.id}`, {
            method: "PATCH",
            body: JSON.stringify({ collapsed: !s.collapsed })
          });
          s.collapsed = !s.collapsed;
          renderChannels();
        } catch (err) { alert(err.message); }
      }
    }, arrow, title);

    const acts = el("div", { className: "sec-acts" });
    if (sIdx > 0) {
      acts.append(el("button", {
        textContent: "↑",
        title: "Fel",
        onclick: async (e) => {
          e.stopPropagation();
          const order = [...sidebarSections];
          const t = order[sIdx - 1];
          order[sIdx - 1] = order[sIdx];
          order[sIdx] = t;
          try {
            await api("/api/v1/sidebar/sections/reorder", {
              method: "PUT",
              body: JSON.stringify({ section_ids: order.map(x => x.id) })
            });
            await loadSections();
            renderChannels();
          } catch (err) { alert(err.message); }
        }
      }));
    }
    if (sIdx < sidebarSections.length - 1) {
      acts.append(el("button", {
        textContent: "↓",
        title: "Le",
        onclick: async (e) => {
          e.stopPropagation();
          const order = [...sidebarSections];
          const t = order[sIdx + 1];
          order[sIdx + 1] = order[sIdx];
          order[sIdx] = t;
          try {
            await api("/api/v1/sidebar/sections/reorder", {
              method: "PUT",
              body: JSON.stringify({ section_ids: order.map(x => x.id) })
            });
            await loadSections();
            renderChannels();
          } catch (err) { alert(err.message); }
        }
      }));
    }
    acts.append(el("button", {
      textContent: "✏",
      title: L.rename,
      onclick: async (e) => {
        e.stopPropagation();
        const n = prompt(L.renameSection || "Új név:", s.name);
        if (!n || !n.trim() || n.trim() === s.name) return;
        try {
          await api(`/api/v1/sidebar/sections/${s.id}`, {
            method: "PATCH",
            body: JSON.stringify({ name: n.trim() })
          });
          await loadSections();
          renderChannels();
        } catch (err) { alert(err.message); }
      }
    }));
    acts.append(el("button", {
      textContent: "✕",
      title: L.deleteLabel,
      onclick: async (e) => {
        e.stopPropagation();
        if (!confirm(L.confirmDeleteSection || "Törlöd a szekciót?")) return;
        try {
          await api(`/api/v1/sidebar/sections/${s.id}`, { method: "DELETE" });
          await loadSections();
          renderChannels();
        } catch (err) { alert(err.message); }
      }
    }));

    hdr.append(titleWrap, acts);
    secEl.append(hdr);

    if (!s.collapsed) {
      const items = s.items || [];
      for (let itIdx = 0; itIdx < items.length; itIdx++) {
        const c = chanMap.get(items[itIdx].channel_id);
        if (c) secEl.append(createChanItem(c, s.id, itIdx, items.length));
      }
    }
    container.append(secEl);
  }

  const unassignedChans = channels.filter(c => !inSection.has(c.id) && c.kind !== "dm");
  if (unassignedChans.length > 0 || sidebarSections.length > 0) {
    container.append(el("div", { className: "group-header", textContent: L.channelsGroup || "Csatornák" }));
    for (const c of unassignedChans) {
      container.append(createChanItem(c, null, 0, 0));
    }
  }

  const unassignedDMs = channels.filter(c => !inSection.has(c.id) && c.kind === "dm");
  if (unassignedDMs.length > 0) {
    container.append(el("div", { className: "group-header", textContent: L.dmsGroup || "Közvetlen üzenetek" }));
    for (const c of unassignedDMs) {
      container.append(createChanItem(c, null, 0, 0));
    }
  }
}

async function open(id) {
  if (openPanel) showPanel(null);
  current = id; setReply(null); clearPendingFiles();
  const c = channels.find(x => x.id === id);
  if (c) {
    c.unread = 0;
    $("chanTitle").textContent = chanLabel(c);
    $("chanDesc").textContent = c.description || "";
    $("chanMembersBtn").style.display = "";
    $("chanMembersBtn").textContent = "👥 " + (L.members || "Tagok");
    $("chanMembersBtn").onclick = () => showMembersModal(c.id);
  } else {
    $("chanTitle").textContent = "";
    $("chanDesc").textContent = "";
    $("chanMembersBtn").style.display = "none";
  }
  const r = await api(`/api/v1/channels/${id}/messages?limit=100`);
  msgs = new Map(r.messages.map(m => [m.id, m]));
  renderFeed();
  await api(`/api/v1/channels/${id}/read`, { method: "POST" }).catch(() => {});
  renderChannels();
  renderActivity();
}

function renderFeed() {
  $("feed").innerHTML = "";
  for (const m of msgs.values()) $("feed").appendChild(renderMsg(m));
  $("feed").scrollTop = $("feed").scrollHeight;
}

function renderMsg(m) {
  const a = actors[m.author_id] || { handle: "?", kind: "human" };
  const div = document.createElement("div");
  div.className = "msg" + (m.thread_root_id ? " reply" : "");
  div.innerHTML = `<div class="re"></div><span class="who ${a.kind}"></span><span class="at"></span>` +
    `<span class="acts"><button data-e="👍">👍</button><button data-e="👎">👎</button><button data-r>${L.reply}</button></span>` +
    `<div class="body"></div><div class="attachments"></div><div class="chips"></div>`;
  if (m.thread_root_id) {
    const root = msgs.get(m.thread_root_id);
    div.querySelector(".re").textContent = "↪ " + L.inThread + " " + (root ? ColonyMarkdown.plain(root.body).slice(0, 60) : "…");
  }
  if (m.kind === "system") {
    div.querySelector(".who").className = "who system";
    div.querySelector(".who").textContent = "system";
  } else {
    div.querySelector(".who").textContent = (a.avatar_emoji ? a.avatar_emoji + " " : "") + "@" + a.handle;
    div.querySelector(".who").style.cursor = "pointer";
    div.querySelector(".who").title = L.overview || "Áttekintés";
    div.querySelector(".who").onclick = () => openOverviewPanel(m.author_id);
  }
  div.querySelector(".at").textContent = new Date(m.created_at).toLocaleTimeString();
  // "[error:<id>]" from the guard: details are for humans, shown on demand.
  const ref = /\[error:([0-9a-f-]{36})\]/.exec(m.body);
  const appRef = /\[approval:([0-9a-f-]{36})\]/.exec(m.body);
  let bodyText = m.body;
  if (ref) bodyText = bodyText.replace(ref[0], "").trim();
  if (appRef) bodyText = bodyText.replace(appRef[0], "").trim();
  const bodyEl = div.querySelector(".body");
  bodyEl.textContent = "";

  const isAgent = a.kind === "agent";
  const renderedFrag = ColonyMarkdown.render(ColonyMarkdown.parse(bodyText), {
    fileChips: isAgent,
    inChat: true,
    copyText: L.copy || "Másolás",
    copiedText: L.copied || "Másolva!",
    knownHandles: new Set(Object.values(actors).map(act => act.handle)),
    onMention: (handle) => {
      const actor = Object.values(actors).find(act => act.handle === handle);
      if (actor) openOverviewPanel(actor.id);
    },
    onFileClick: (path) => {
      openFileViewer(m.id, path, a.handle);
    }
  });
  bodyEl.appendChild(renderedFrag);

  // Collapse long messages
  const fadeEl = document.createElement("div");
  fadeEl.className = "msg-fade";
  bodyEl.appendChild(fadeEl);

  const toggleBtn = document.createElement("button");
  toggleBtn.type = "button";
  toggleBtn.className = "msg-collapse-btn";
  toggleBtn.style.display = "none";
  toggleBtn.textContent = L.showMore || "Több";
  toggleBtn.onclick = (e) => {
    e.stopPropagation();
    const isCollapsed = bodyEl.classList.toggle("collapsed");
    toggleBtn.textContent = isCollapsed ? (L.showMore || "Több") : (L.showLess || "Kevesebb");
  };
  bodyEl.after(toggleBtn);

  requestAnimationFrame(() => {
    if (bodyEl.scrollHeight > 360) {
      bodyEl.classList.add("collapsible", "collapsed");
      toggleBtn.style.display = "inline-flex";
    }
  });
  if (ref && me.kind === "human") {
    const btn = el("button", { textContent: L.errorDetails });
    btn.onclick = () => showError(ref[1]);
    bodyEl.append(" ", btn);
  }
  if (appRef && me.kind === "human") {
    const appSpan = el("span");
    bodyEl.append(" ", appSpan);
    renderApprovalInline(appRef[1], appSpan);
  }
  if (m.attachments && m.attachments.length) {
    const attDiv = div.querySelector(".attachments");
    for (const att of m.attachments) {
      const isImg = att.mime && att.mime.startsWith("image/") && !att.mime.includes("svg");
      if (isImg) {
        const a = el("a", { href: `/api/v1/files/${att.id}/content`, target: "_blank", title: `${att.name} (${formatBytes(att.size)})` });
        const img = el("img", { className: "attachment-img", src: `/api/v1/files/${att.id}/content`, alt: att.name });
        a.append(img);
        attDiv.append(a);
      } else {
        const link = el("a", {
          className: "attachment-link",
          href: `/api/v1/files/${att.id}/content`,
          target: "_blank",
          title: `${att.mime}, ${formatBytes(att.size)}`
        }, `📎 ${att.name} (${formatBytes(att.size)})`);
        attDiv.append(link);
      }
    }
  }
  if (m.link_cards && m.link_cards.length > 0) {
    const cardsDiv = el("div", { className: "link-cards" });
    for (const card of m.link_cards) {
      let icon = "🔗";
      if (card.kind === "pull") icon = "🔀";
      else if (card.kind === "issue") icon = "🟢";
      else if (card.kind === "repo") icon = "📦";
      else if (card.kind === "commit") icon = "📝";

      const cardEl = el("div", { className: "link-card" });
      const a = el("a", { href: card.url, target: "_blank", rel: "noopener noreferrer" });
      a.textContent = `${icon} ${card.title || card.url}`;
      cardEl.append(a);

      if (card.state) {
        cardEl.append(el("span", { className: "badge", textContent: card.state }));
      }
      if (card.author) {
        cardEl.append(el("span", { className: "muted", textContent: `@${card.author}` }));
      }
      cardsDiv.append(cardEl);
    }
    div.append(cardsDiv);
  }
  for (const r of m.reactions || []) {
    const chip = document.createElement("button");
    chip.className = "chip" + (r.actor_ids.includes(me.id) ? " mine" : "");
    chip.textContent = r.emoji + " " + r.count;
    chip.title = r.actor_ids.map(id => "@" + (actors[id]?.handle || "?")).join(", ");
    chip.onclick = () => toggleReaction(m, r.emoji);
    div.querySelector(".chips").appendChild(chip);
  }
  div.querySelectorAll("[data-e]").forEach(b => b.onclick = () => toggleReaction(m, b.dataset.e));
  div.querySelector("[data-r]").onclick = () => setReply(m.thread_root_id || m.id);
  return div;
}

// --- File Viewer --------------------------------------------------------

let currentFileFetch = null;
let currentFileFetchMessageId = null;
let currentFileFetchPath = null;
let currentFileFetchAgentHandle = null;
let fileFetchPollTimer = null;

function closeFileViewer() {
  if (fileFetchPollTimer) {
    clearInterval(fileFetchPollTimer);
    fileFetchPollTimer = null;
  }
  currentFileFetch = null;
  $("fileViewerModal").className = "modal";
}
$("fileViewerClose").onclick = closeFileViewer;
$("fileViewerModal").onclick = (e) => {
  if (e.target === $("fileViewerModal")) closeFileViewer();
};

async function openFileViewer(messageId, path, agentHandle, refresh = false) {
  if (fileFetchPollTimer) {
    clearInterval(fileFetchPollTimer);
    fileFetchPollTimer = null;
  }
  currentFileFetchMessageId = messageId;
  currentFileFetchPath = path;
  currentFileFetchAgentHandle = agentHandle;

  $("fileViewerPath").textContent = path;
  $("fileViewerPath").title = path;
  $("fileViewerAgent").textContent = "@" + (agentHandle || "?");
  $("fileViewerStatus").textContent = "";
  $("fileViewerRefresh").textContent = L.refresh;
  $("fileViewerRefresh").style.display = "none";
  $("fileViewerRefresh").onclick = () => openFileViewer(messageId, path, agentHandle, true);
  $("fileViewerControls").style.display = "none";
  $("fileViewerControls").innerHTML = "";
  $("fileViewerBody").replaceChildren(el("div", { style: "padding:20px;text-align:center;", className: "muted", textContent: L.loadingFile }));
  $("fileViewerModal").className = "modal on";

  try {
    const res = await api(`/api/v1/messages/${messageId}/file-fetch`, {
      method: "POST",
      body: JSON.stringify({ path, refresh })
    });
    currentFileFetch = res;
    renderFileFetchState(res, messageId, path, agentHandle);

    if (res.state === "pending") {
      fileFetchPollTimer = setInterval(async () => {
        if (!currentFileFetch || currentFileFetch.id !== res.id) {
          clearInterval(fileFetchPollTimer);
          return;
        }
        try {
          const pollRes = await api(`/api/v1/file-fetch/${res.id}`);
          if (pollRes.state !== "pending") {
            clearInterval(fileFetchPollTimer);
            fileFetchPollTimer = null;
            currentFileFetch = pollRes;
            renderFileFetchState(pollRes, messageId, path, agentHandle);
          }
        } catch (e) {
          clearInterval(fileFetchPollTimer);
        }
      }, 2000);
    }
  } catch (err) {
    $("fileViewerBody").replaceChildren(el("div", { style: "color:var(--err);padding:20px;", textContent: err.message }));
  }
}

async function renderFileFetchState(res, messageId, path, agentHandle) {
  $("fileViewerRefresh").style.display = "inline-block";
  if (res.state === "pending") {
    $("fileViewerStatus").textContent = L.loadingFile;
    $("fileViewerBody").replaceChildren(el("div", { style: "padding:20px;text-align:center;", className: "muted", textContent: L.loadingFile }));
    return;
  }
  if (res.state === "failed") {
    let errText = res.error_code || "Hiba";
    switch (res.error_code) {
      case "host_offline": errText = L.errHostOffline; break;
      case "not_found": errText = L.errNotFound; break;
      case "denied": errText = L.errDenied; break;
      case "too_large": errText = L.errTooLarge; break;
      case "not_a_file": errText = L.errNotAFile; break;
      case "timeout": errText = L.errTimeout; break;
    }
    $("fileViewerStatus").textContent = L.statusAt + " ✕";
    $("fileViewerBody").replaceChildren(el("div", { style: "padding:24px;text-align:center;color:var(--err);font-size:15px;", textContent: errText }));
    return;
  }
  if (res.state === "done" && res.file) {
    const f = res.file;
    const timeStr = res.completed_at ? new Date(res.completed_at).toLocaleTimeString() : "";
    $("fileViewerStatus").textContent = L.statusAt + " " + timeStr;

    await renderFetchedFileContent(f, path);
  }
}

async function renderFetchedFileContent(f, originalPath) {
  const isMd = f.name.endsWith(".md") || f.mime === "text/markdown";
  const isImg = f.mime && f.mime.startsWith("image/") && !f.mime.includes("svg");
  const isLog = f.name.endsWith(".log") || f.mime === "text/x-log";
  const isText = isMd || isLog || (f.mime && (f.mime.startsWith("text/") || f.mime.includes("json") || f.mime.includes("yaml") || f.mime.includes("javascript") || f.mime.includes("xml"))) || /\.(txt|log|json|ya?ml|go|py|js|ts|sh|css|html|sql|toml|ini|conf|c|cpp|h|rs|java|md)$/i.test(f.name);

  const controls = $("fileViewerControls");
  controls.innerHTML = "";
  controls.style.display = "flex";
  const body = $("fileViewerBody");
  body.innerHTML = "";

  if (isImg) {
    const img = el("img", { className: "file-view-img", src: `/api/v1/files/${f.id}/content`, alt: f.name });
    body.append(img);
    const dlBtn = el("a", { className: "button secondary", href: `/api/v1/files/${f.id}/content`, download: f.name, textContent: `⬇️ ${L.download}` });
    controls.append(el("span", { className: "muted" }, `${f.mime} · ${formatBytes(f.size)}`), dlBtn);
    return;
  }

  if (isMd) {
    let rawText = "";
    try {
      const res = await fetch(`/api/v1/files/${f.id}/content`, {
        headers: token ? { Authorization: "Bearer " + token } : {}
      });
      rawText = await res.text();
    } catch (e) {
      body.replaceChildren(el("div", { style: "color:var(--err);padding:20px;", textContent: e.message }));
      return;
    }

    let isRaw = false;
    const toggleBtn = el("button", { className: "secondary", textContent: L.rawView, style: "font-size:12px;" });
    const dlBtn = el("a", { className: "button secondary", href: `/api/v1/files/${f.id}/content`, download: f.name, textContent: `⬇️ ${L.download}`, style: "font-size:12px;padding:3px 8px;" });

    const updateView = () => {
      body.innerHTML = "";
      if (isRaw) {
        toggleBtn.textContent = L.renderedView;
        const pre = el("pre", { className: "file-view-mono" });
        const code = el("code", { textContent: rawText });
        pre.append(code);
        body.append(pre);
      } else {
        toggleBtn.textContent = L.rawView;
        const dom = ColonyMarkdown.render(ColonyMarkdown.parse(rawText), {
          fileChips: false,
          inChat: false,
          copyText: L.copy || "Másolás",
          copiedText: L.copied || "Másolva!"
        });
        const wrap = document.createElement("div");
        wrap.className = "markdown-body";
        wrap.appendChild(dom);
        body.append(wrap);
      }
    };
    toggleBtn.onclick = () => { isRaw = !isRaw; updateView(); };
    controls.append(toggleBtn, dlBtn, el("span", { className: "muted" }, `${formatBytes(f.size)}`));
    updateView();
    return;
  }

  if (isText) {
    const dlBtn = el("a", { className: "button secondary", href: `/api/v1/files/${f.id}/content`, download: f.name, textContent: `⬇️ ${L.download}`, style: "font-size:12px;padding:3px 8px;" });

    if (f.size > 2 * 1024 * 1024) {
      let viewMode = isLog ? "end" : "start";
      const switchBtn = el("button", { className: "secondary", style: "font-size:12px;" });
      const infoSpan = el("span", { className: "muted", style: "font-size:12px;" });

      const loadRange = async () => {
        body.replaceChildren(el("div", { style: "padding:20px;text-align:center;", className: "muted", textContent: L.loadingFile }));
        const oneMB = 1024 * 1024;
        let rangeHeader = "";
        if (viewMode === "start") {
          rangeHeader = `bytes=0-${oneMB - 1}`;
          switchBtn.textContent = L.viewEnd;
          infoSpan.textContent = `0 - 1.0 MB / ${formatBytes(f.size)}`;
        } else {
          const startByte = f.size - oneMB;
          rangeHeader = `bytes=${startByte}-${f.size - 1}`;
          switchBtn.textContent = L.viewStart;
          infoSpan.textContent = `${formatBytes(startByte)} - ${formatBytes(f.size)} / ${formatBytes(f.size)}`;
        }

        try {
          const headers = { Range: rangeHeader };
          if (token) headers.Authorization = "Bearer " + token;
          const res = await fetch(`/api/v1/files/${f.id}/content`, { headers });
          const text = await res.text();
          body.innerHTML = "";
          const pre = el("pre", { className: "file-view-mono" });
          const code = el("code", { textContent: text });
          pre.append(code);
          body.append(pre);
          if (viewMode === "end") {
            body.scrollTop = body.scrollHeight;
          }
        } catch (e) {
          body.replaceChildren(el("div", { style: "color:var(--err);padding:20px;", textContent: e.message }));
        }
      };

      switchBtn.onclick = () => {
        viewMode = viewMode === "start" ? "end" : "start";
        loadRange();
      };

      controls.append(switchBtn, infoSpan, dlBtn);
      loadRange();
      return;
    }

    controls.append(dlBtn, el("span", { className: "muted" }, `${f.mime || "text/plain"} · ${formatBytes(f.size)}`));
    try {
      const res = await fetch(`/api/v1/files/${f.id}/content`, {
        headers: token ? { Authorization: "Bearer " + token } : {}
      });
      const text = await res.text();
      body.innerHTML = "";
      const pre = el("pre", { className: "file-view-mono" });
      const code = el("code", { textContent: text });
      pre.append(code);
      body.append(pre);
      if (isLog) {
        body.scrollTop = body.scrollHeight;
      }
    } catch (e) {
      body.replaceChildren(el("div", { style: "color:var(--err);padding:20px;", textContent: e.message }));
    }
    return;
  }

  const box = el("div", { style: "padding:40px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;" });
  box.append(
    el("div", { style: "font-size:40px;" }, "📄"),
    el("strong", { style: "font-size:16px;" }, f.name),
    el("div", { className: "muted" }, `${f.mime || "application/octet-stream"} · ${formatBytes(f.size)}`),
    el("a", {
      className: "button",
      href: `/api/v1/files/${f.id}/content`,
      download: f.name,
      textContent: `⬇️ ${L.download}`,
      style: "display:inline-block;padding:8px 16px;text-decoration:none;"
    })
  );
  body.append(box);
}

let currentMembersChannelId = null;
async function showMembersModal(channelId) {
  currentMembersChannelId = channelId;

  $("membersModalTitle").textContent = `${L.members}: ${chName}`;

}
$("membersModalClose").onclick = () => { $("membersModal").className = "modal"; };

async function refreshMembersModal() {
  const channelId = currentMembersChannelId;
  if (!channelId) return;
  const res = await api(`/api/v1/channels/${channelId}/members`).catch(e => { alert(e.message); return null; });
  if (!res) return;
  const listEl = $("membersList");
  listEl.innerHTML = "";
  const memberActorIds = new Set();
  const isAdmin = me?.kind === "human" && (me.role === "admin" || me.role === "owner");
  for (const m of res.members) {
    memberActorIds.add(m.actor_id);
    const act = actors[m.actor_id];
    const prefix = act?.avatar_emoji ? act.avatar_emoji + " " : "";
    const row = el("div", { className: "modal-row" });
    const whoSpan = el("span", {
      className: `who ${m.kind}`,
      textContent: `${prefix}@${m.handle}`,
      style: "cursor:pointer;",
      title: L.overview || "Áttekintés",
      onclick: () => {
        $("membersModal").className = "modal";
        openOverviewPanel(m.actor_id);
      }
    });
    const left = el("div", { style: "display:flex;align-items:center;gap:6px;" },
      whoSpan,
      el("span", { className: "muted", style: "font-size:11px;", textContent: `(${m.kind})` })
    );
    row.append(left);
    if (isAdmin) {
      const rmBtn = el("button", {
        textContent: "✕",
        title: L.removeLabel,
        onclick: async () => {
          if (!confirm(L.removeMemberConfirm || "Biztosan eltávolítod ezt a tagot?")) return;
          try {
            await api(`/api/v1/channels/${channelId}/members/${m.actor_id}`, { method: "DELETE" });
            await refreshMembersModal();
          } catch (err) {
            alert(err.message);
          }
        }
      });
      row.append(rmBtn);
    }
    listEl.append(row);
  }

  const addSec = $("addMemberSection");
  if (isAdmin) {
    addSec.style.display = "";
    $("lblAddMember").textContent = (L.addMember || "Hozzáadás") + ":";
    $("addMemberBtn").textContent = L.addMember || "Hozzáadás";
    const sel = $("addMemberSelect");
    sel.innerHTML = "";
    const nonMembers = Object.values(actors).filter(a => !memberActorIds.has(a.id));
    for (const a of nonMembers) {
      sel.append(el("option", { value: a.id, textContent: `@${a.handle} (${a.kind})` }));
    }
    $("addMemberBtn").onclick = async () => {
      const targetId = sel.value;
      if (!targetId) return;
      try {
        await api(`/api/v1/channels/${channelId}/members`, {
          method: "POST",
          body: JSON.stringify({ actor_id: targetId }),
        });
        await refreshMembersModal();
      } catch (err) {
        alert(err.message);
      }
    };
  } else {
    addSec.style.display = "none";
  }
}

let currentOverviewActorId = null;

async function openOverviewPanel(actorId) {

  $("overviewPanel").classList.add("on");

}

  $("overviewPanel").classList.remove("on");

}
$("overviewClose").onclick = closeOverviewPanel;

async function refreshOverviewPanel() {
  const actorId = currentOverviewActorId;
  if (!actorId) return;
  const body = $("overviewBody");
  body.innerHTML = "";

  let ov;
  try {
    ov = await api(`/api/v1/agents/${actorId}/overview`);
  } catch (err) {
    body.append(el("p", { className: "warn", textContent: err.message }));
    return;
  }

  const act = ov.actor;

      textContent: "✏️ " + (L.editProfile || "Profil szerkesztése"),

  // If Human: Common channels
  if (act.kind === "human") {

    chanSec.append(el("h4", { textContent: L.commonChannels || "Közös csatornák" }));

        const item = el("a", {
          href: "#",
          textContent: (c.kind === "dm" ? "✉ " : "#") + c.name,
          style: "color:var(--accent); text-decoration:none; font-weight:500;",

            e.preventDefault();

            open(c.id);
          }
        });
        list.append(item);
      }
      chanSec.append(list);
    }
    body.append(chanSec);
    return;
  }

  // If Agent:
  // 1. Activity
  const actSec = el("div", { className: "overview-section" });
  actSec.append(el("h4", { textContent: L.activity }));
  const isWorking = ov.activity?.working;
  actSec.append(el("div", { style: "display:flex; align-items:center; gap:6px;" },
    el("span", { style: `display:inline-block; width:10px; height:10px; border-radius:50%; background:${isWorking ? '#2ecc71' : '#95a5a6'};` }),
    el("span", { textContent: isWorking ? (L.working || "dolgozik…") : L.idle })
  ));
  body.append(actSec);

  // 2. Admin Actions
  const isAdmin = me?.kind === "human" && (me.role === "admin" || me.role === "owner");
  if (isAdmin) {
    const adminSec = el("div", { className: "overview-section" });
    adminSec.append(el("h4", { textContent: L.administration }));
    const btnRow = el("div", { style: "display:flex; gap:6px; flex-wrap:wrap;" });

    if (act.state === "active") {
      btnRow.append(el("button", {
        textContent: "⏸ " + (L.pause || "Szüneteltetés"),
        onclick: async () => {
          try {
            await api(`/api/v1/actors/${act.id}/state`, { method: "PUT", body: JSON.stringify({ state: "paused" }) });
            await refreshOverviewPanel();
            await load();
          } catch (e) { alert(e.message); }
        }
      }));
      btnRow.append(el("button", {
        textContent: "⏹ " + (L.stop || "Leállítás"),
        onclick: async () => {
          if (!confirm(L.confirmStopAgent)) return;
          try {
            await api(`/api/v1/actors/${act.id}/state`, { method: "PUT", body: JSON.stringify({ state: "stopped" }) });
            await refreshOverviewPanel();
            await load();
          } catch (e) { alert(e.message); }
        }
      }));
    } else if (act.state === "paused") {
      btnRow.append(el("button", {
        textContent: "▶ " + (L.resume || "Folytatás"),
        onclick: async () => {
          try {
            await api(`/api/v1/actors/${act.id}/state`, { method: "PUT", body: JSON.stringify({ state: "active" }) });
            await refreshOverviewPanel();
            await load();
          } catch (e) { alert(e.message); }
        }
      }));
      btnRow.append(el("button", {
        textContent: "⏹ " + (L.stop || "Leállítás"),
        onclick: async () => {
          if (!confirm(L.confirmStopAgent)) return;
          try {
            await api(`/api/v1/actors/${act.id}/state`, { method: "PUT", body: JSON.stringify({ state: "stopped" }) });
            await refreshOverviewPanel();
            await load();
          } catch (e) { alert(e.message); }
        }
      }));
    } else {
      btnRow.append(el("button", {
        textContent: "▶ " + L.restart,
        onclick: async () => {
          try {
            await api(`/api/v1/actors/${act.id}/state`, { method: "PUT", body: JSON.stringify({ state: "active" }) });
            await refreshOverviewPanel();
            await load();
          } catch (e) { alert(e.message); }
        }
      }));

    const settingsBtn = el("button", {
      textContent: "⚙️ " + (L.settings || "Beállítások"),
      onclick: () => {

        showPanel("hosts");
        renderHosts();
      }
    });
    btnRow.append(settingsBtn);
    adminSec.append(btnRow);
    body.append(adminSec);
  }

  // 3. Assignment
  const asgn = ov.assignment;
  if (asgn) {
    const asgnSec = el("div", { className: "overview-section" });
    asgnSec.append(el("h4", { textContent: L.machineConfig }));
    const grid = el("div", { style: "display:grid; grid-template-columns:auto 1fr; gap:4px 8px; font-size:12px;" },

      el("span", { textContent: asgn.host_name || asgn.host_id }),

      el("span", { textContent: `${asgn.client} (${asgn.model})` }),
      el("span", { className: "muted", textContent: L.modeSandbox }),
      el("span", { textContent: `${asgn.mode} / ${asgn.sandbox ? "igen" : "nem"}` }),
      el("span", { className: "muted", textContent: L.rootDir }),
      el("span", { textContent: asgn.root_dir || "–" }),
      el("span", { className: "muted", textContent: "Worktree repo:" }),
      el("span", { textContent: asgn.worktree_repo || "–" }),
      el("span", { className: "muted", textContent: "Worktree branch:" }),

    // Folder grants
    const grantsBox = el("div", { style: "margin-top:8px;" });
    grantsBox.append(el("b", { style: "font-size:11px; text-transform:uppercase; color:var(--muted);", textContent: L.folderGrants }));
    const grantsList = el("div", { style: "display:flex; flex-direction:column; gap:4px; margin-top:4px;" });

      const gRow = el("div", { style: "display:flex; align-items:center; justify-content:space-between; font-size:12px; background:var(--bg); padding:2px 6px; border-radius:4px;" },
        el("span", { textContent: `${g.path} (${g.mode})` })
      );
      if (isAdmin) {
        const delGrantBtn = el("button", {
          textContent: "✕",
          style: "padding:0 4px; font-size:10px;",
          onclick: async () => {
            try {
              await api(`/api/v1/grants/${g.id}`, { method: "DELETE" });
              await refreshOverviewPanel();
            } catch (e) { alert(e.message); }
          }
        });
        gRow.append(delGrantBtn);
      }
      grantsList.append(gRow);
    }
    if ((asgn.grants || []).length === 0) {
      grantsList.append(el("span", { className: "muted", style: "font-size:12px;", textContent: L.noFolderGrants }));
    }
    grantsBox.append(grantsList);

    if (isAdmin) {
      const addGrantForm = el("div", { style: "display:flex; gap:4px; margin-top:6px;" });

  // 4. Context per thread

    const thSec = el("div", { className: "overview-section" });
    thSec.append(el("h4", { textContent: L.contextThreads || "Munkamenetek szálanként" }));
    const thList = el("div", { style: "display:flex; flex-direction:column; gap:6px;" });

      const isNearLimit = t.max_session_tokens > 0 && t.last_run_tokens >= t.max_session_tokens * 0.8;

        el("div", { style: "display:flex; justify-content:space-between; align-items:center;" },
          el("a", {
            href: "#",
            textContent: "#" + (t.channel_name || "csatorna"),
            style: "color:var(--accent); font-weight:600; text-decoration:none;",

          el("span", {
            className: isNearLimit ? "warn" : "muted",

        thItem.append(el("div", { style: "color:#e67e22; font-size:11px; font-weight:500; margin-top:2px;", textContent: "⚠️ " + (L.newSessionSoon || "új munkamenet hamarosan") }));
      }
      thList.append(thItem);
    }
    thSec.append(thList);
    body.append(thSec);
  }

  // 5. Usage & Last runs
  const usage = ov.usage;
  if (usage) {
    const useSec = el("div", { className: "overview-section" });
    useSec.append(el("h4", { textContent: L.tokenUsage }));
    useSec.append(el("div", { style: "font-size:12px; margin-bottom:6px;" },
      el("span", { className: "muted", textContent: L.today + ": " }),
      el("b", { textContent: `${usage.today_tokens} token` }),
      el("span", { className: "muted", textContent: ` / limit: ${usage.daily_token_limit ? usage.daily_token_limit : L.noLimit}` })
    ));

    const runs = usage.last_runs || [];
    if (runs.length > 0) {
      const runsTbl = el("table", { style: "width:100%; font-size:11px; border-collapse:collapse; margin-top:4px;" },
        el("tr", { style: "border-bottom:1px solid var(--line); text-align:left; color:var(--muted);" },
          el("th", { textContent: L.time }),
          el("th", { textContent: L.phase }),
          el("th", { textContent: L.status }),
          el("th", { textContent: "Token" })
        )
      );
      for (const r of runs) {
        const row = el("tr", { style: "border-bottom:1px solid var(--line);" },
          el("td", { textContent: new Date(r.time).toLocaleTimeString() }),
          el("td", { textContent: r.phase }),
          el("td", {
            style: `color:${r.result === 'ok' ? '#2ecc71' : '#e74c3c'}; font-weight:500;`,
            textContent: r.result
          }),
          el("td", { textContent: String(r.tokens) })
        );
        if (r.error_id) {
          const errBtn = el("button", {
            textContent: "hiba",
            style: "padding:0 3px; font-size:10px; margin-left:4px;",
            onclick: () => showError(r.error_id)
          });
          row.querySelector("td:nth-child(3)").append(errBtn);
        }
        runsTbl.append(row);
      }
      useSec.append(runsTbl);
    }
    body.append(useSec);
  }

  // 6. Collaboration
  const collab = ov.collaboration;
  if (collab) {
    const colSec = el("div", { className: "overview-section" });
    colSec.append(el("h4", { textContent: L.collaboration }));

    const notes = collab.notes || [];
    if (notes.length > 0) {
      colSec.append(el("b", { style: "font-size:11px; text-transform:uppercase; color:var(--muted);", textContent: L.notesPerThread }));
      const nList = el("div", { style: "display:flex; flex-direction:column; gap:4px; margin:4px 0 8px;" });
      for (const n of notes) {
        nList.append(el("div", { style: "background:var(--bg); padding:4px 6px; border-radius:4px; font-size:11px; white-space:pre-wrap;" },
          el("div", { className: "muted", style: "font-size:10px;", textContent: new Date(n.created_at).toLocaleString() }),
          el("div", { textContent: n.text })
        ));
      }
      colSec.append(nList);
    }

    const leases = collab.active_leases || [];
    if (leases.length > 0) {
      colSec.append(el("b", { style: "font-size:11px; text-transform:uppercase; color:var(--muted);", textContent: L.activeLeases }));
      const lList = el("div", { style: "display:flex; flex-direction:column; gap:4px; margin:4px 0 8px;" });
      for (const l of leases) {
        lList.append(el("div", { style: "background:var(--bg); padding:4px 6px; border-radius:4px; font-size:11px;" },
          el("b", { textContent: l.resource }),
          el("span", { className: "muted", style: "margin-left:6px;", textContent: `${L.expires}: ${new Date(l.expires_at).toLocaleTimeString()}` })
        ));
      }
      colSec.append(lList);
    }

    const questions = collab.open_questions || [];
    if (questions.length > 0) {
      colSec.append(el("b", { style: "font-size:11px; text-transform:uppercase; color:var(--muted);", textContent: L.openQuestions }));
      const qList = el("div", { style: "display:flex; flex-direction:column; gap:4px; margin-top:4px;" });
      for (const q of questions) {
        qList.append(el("div", { style: "background:var(--bg); padding:4px 6px; border-radius:4px; font-size:11px;" },
          el("b", { textContent: q.formatted_number + ": " }),
          el("span", { textContent: q.text })
        ));
      }
      colSec.append(qList);
    }

    if (notes.length === 0 && leases.length === 0 && questions.length === 0) {
      colSec.append(el("span", { className: "muted", style: "font-size:12px;", textContent: L.noCollab }));
    }
    body.append(colSec);
  }
}

async function renderApprovalInline(id, span) {
  const app = await api(`/api/v1/approvals/${id}`).catch(() => null);
  if (!app) return;
  span.innerHTML = "";
  const btn = el("button", { textContent: L.approvalDetails });
  btn.onclick = () => showApproval(id);
  span.append(btn);
  if (app.state === "pending") {
    const allowBtn = el("button", { textContent: L.approvalAllow, style: "color:#137333;font-weight:bold;margin-left:4px;" });
    allowBtn.onclick = async () => {
      await api(`/api/v1/approvals/${id}`, { method: "POST", body: JSON.stringify({ decision: "allow" }) }).catch(e => alert(e.message));
      renderApprovalInline(id, span);
    };
    const denyBtn = el("button", { textContent: L.approvalDeny, style: "color:#b3261e;margin-left:4px;" });
    denyBtn.onclick = async () => {
      await api(`/api/v1/approvals/${id}`, { method: "POST", body: JSON.stringify({ decision: "deny" }) }).catch(e => alert(e.message));
      renderApprovalInline(id, span);
    };
    span.append(" ", allowBtn, " ", denyBtn);
  } else {
    const labels = {
      allowed: L.approvalAllowed,
      denied: L.approvalDenied,
      expired: L.approvalExpired
    };
    const tag = el("span", { className: "muted", style: "margin-left:6px;", textContent: labels[app.state] || app.state });
    span.append(tag);
  }
}

const activities = new Map();
function handleActivityFrame(f) {
  const key = `${f.agent_id}:${f.channel_id}:${f.thread_root_id || ""}`;
  if (f.state === "working") {
    activities.set(key, { agent_id: f.agent_id, channel_id: f.channel_id, thread_root_id: f.thread_root_id || null, expires: Date.now() + 60000 });
  } else {
    activities.delete(key);
  }
  renderActivity();
}

function renderActivity() {
  const bar = $("activityBar");
  if (!bar) return;
  const now = Date.now();
  const active = [];
  for (const [k, v] of activities.entries()) {
    if (v.expires <= now) {
      activities.delete(k);
      continue;
    }
    if (v.channel_id !== current) continue;
    // Agents mostly answer in a thread: the channel view shows every run in
    // the channel, a thread only its own.
    if (replyRoot && v.thread_root_id !== replyRoot) continue;
    const h = actors[v.agent_id]?.handle;
    const name = h ? "@" + h : "@agent";
    if (!active.includes(name)) active.push(name);
  }
  if (!active.length) {
    bar.style.display = "none";
    bar.textContent = "";
  } else {
    bar.style.display = "block";
    bar.textContent = `${active.join(", ")} ${L.working}`;
  }
}
setInterval(renderActivity, 2000);

function setReply(rootId) {
  replyRoot = rootId;
  $("replybar").className = rootId ? "on" : "";
  if (rootId) { const r = msgs.get(rootId); $("replyto").textContent = L.replyIn + " " + (r ? ColonyMarkdown.plain(r.body).slice(0, 80) : ""); $("text").focus(); }
  renderActivity();
}
$("replycancel").onclick = () => setReply(null);

async function reloadCurrentFeed() {
  if (!current) return;
  const r = await api(`/api/v1/channels/${current}/messages?limit=100`);
  msgs = new Map(r.messages.map(m => [m.id, m]));
  const keep = $("feed").scrollTop; renderFeed(); $("feed").scrollTop = keep;
}

async function refreshMessage(id) {
  // Reactions changed: reload the open channel (cheap at dev-page scale).
  if (!msgs.has(id)) return;
  await reloadCurrentFeed();
}

function connectWS() {
  const url = (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws/ui";
  ws = new WebSocket(url);
  ws.onopen = () => ws.send(JSON.stringify(token ? { type: "hello", token, last_seq: lastSeq } : { type: "hello", last_seq: lastSeq }));
  ws.onmessage = async (ev) => {
    const f = JSON.parse(ev.data);
    if (f.type === "welcome") { if (lastSeq === null) lastSeq = f.head; $("status").textContent = L.online; }
    if (f.type === "resync_required") { lastSeq = f.head; await load(); }
    if (f.type === "agent.activity") {
      handleActivityFrame(f);
      return;
    }
    if (f.type !== "event") return;
    lastSeq = f.seq;
    const d = f.data || {};
    if (f.event_type === "message.created") {
      if (d.channel_id === current) {
        const m = { id: d.message_id, author_id: d.author_id, body: d.body, created_at: d.created_at, thread_root_id: d.thread_root_id, reactions: [], attachments: d.attachments || [] };
        msgs.set(m.id, m); $("feed").appendChild(renderMsg(m)); $("feed").scrollTop = $("feed").scrollHeight;
        api(`/api/v1/channels/${current}/read`, { method: "POST" }).catch(() => {});
      } else {
        const c = channels.find(x => x.id === d.channel_id);
        if (c) { c.unread++; renderChannels(); } else await load();
      }
    } else if (f.event_type.startsWith("reaction.") && d.channel_id === current) {
      await refreshMessage(d.message_id);
    } else if (f.event_type.startsWith("approval.")) {
      await reloadCurrentFeed();
    } else if (f.event_type === "actor.created" || f.event_type.startsWith("channel.")) {
      await load();
    } else if (f.event_type.startsWith("host.") && hostsOpen) {
      renderHosts();
    } else if (f.event_type === "run.reported" && openPanel === "runs") {
      renderRuns();
    } else if (f.event_type === "file.fetch_completed" || f.event_type === "file.fetch_failed") {
      if (currentFileFetch && currentFileFetch.id === d.request_id) {
        api(`/api/v1/file-fetch/${currentFileFetch.id}`).then(res => {
          if (currentFileFetch && currentFileFetch.id === res.id) {
            currentFileFetch = res;
            renderFileFetchState(res, currentFileFetchMessageId, currentFileFetchPath, currentFileFetchAgentHandle);
          }
        }).catch(() => {});
      }
    }
  };
  ws.onclose = () => { $("status").textContent = L.reconnecting; setTimeout(connectWS, 2000); };
}

let hostsOpen = false;
$("hostsbtn").textContent = "🖥️ " + L.hosts;
$("chatbtn").textContent = "💬 " + L.chat;
$("runsbtn").textContent = "📊 " + L.runs;
$("schedbtn").textContent = "⏰ " + L.schedules;
$("questionsbtn").textContent = "❓ " + L.questions;
$("wikibtn").textContent = "📖 " + L.wiki;
$("rulesbtn").textContent = "📜 " + L.agentRules;
$("leasesbtn").textContent = "🔒 " + L.leases;
// One side panel at a time (machines, schedules, runs, wiki); the chat
// feed shows when none is open. Returns whether the panel is now open.
let openPanel = null;
// The header tabs are fixed: each button keeps its label, the active one is
// highlighted, and "Chat" (or a channel in the sidebar) goes back to the feed.
const panelButtons = { hosts: "hostsbtn", sched: "schedbtn", runs: "runsbtn", wiki: "wikibtn", questions: "questionsbtn", rules: "rulesbtn", leases: "leasesbtn" };
function showPanel(name) {
  openPanel = name;
  for (const p of Object.keys(panelButtons)) $(p + "Panel").className = openPanel === p ? "on" : "";
  $("feed").className = openPanel ? "off" : "";
  $("chanHeader").hidden = !!openPanel;
  for (const [p, id] of Object.entries(panelButtons)) $(id).classList.toggle("on", openPanel === p);
  $("chatbtn").classList.toggle("on", !openPanel);
  hostsOpen = openPanel === "hosts"; schedOpen = openPanel === "sched";
}
function togglePanel(name) { showPanel(name); return true; }
$("chatbtn").onclick = () => showPanel(null);

$("hostsbtn").onclick = () => { if (!togglePanel("hosts")) return; renderHosts(); };

// The last pairing code, kept until it expires: creating it sends a
// host.pairing_created event that re-renders this panel, which would
// otherwise wipe the code before anyone can copy it.
let lastPairing = null;

async function renderHosts() {
  const panel = $("hostsPanel");
  const [{ hosts }, { channels: allChans }] = await Promise.all([
    api("/api/v1/hosts"),
    api("/api/v1/channels").catch(() => ({ channels: [] }))
  ]);
  panel.innerHTML = "";
  const pairBox = el("div", { className: "card" });
  const pairBtn = el("button", { textContent: L.pair });
  const showPairing = (pc) => {
    pairBox.querySelector(".pairout")?.remove();
    pairBox.append(el("div", { className: "pairout" }, el("div", { className: "muted", textContent: L.pairHelp }),
      el("code", { className: "code", textContent: pc.code }), el("pre", { className: "grant",
        textContent: `colony guard enroll -server ${location.origin} -code ${pc.code} -name <gép-neve>` })));
  };
  pairBtn.onclick = async () => {
    const pc = await api("/api/v1/hosts/pairing-codes", { method: "POST" }).catch(e => alert(e.message));
    if (!pc) return;
    lastPairing = pc;
    showPairing(pc);
  };
  pairBox.append(pairBtn);
  if (lastPairing && new Date(lastPairing.expires_at) > new Date()) showPairing(lastPairing);
  panel.append(pairBox);

  // New Agent form
  const newAgentBox = el("div", { className: "card" });
  newAgentBox.append(el("h3", { textContent: L.newAgent }));
  newAgentBox.append(el("div", { className: "muted", textContent: L.hostModeTokenNote }));

  const naHandle = el("input", { placeholder: "handle (pl. claude-dev)", size: 18 });
  const naName = el("input", { placeholder: "név / display name", size: 18 });
  const naClient = el("select", {}, el("option", { value: "claude-code", textContent: "claude-code" }), el("option", { value: "antigravity", textContent: "antigravity" }));
  newAgentBox.append(el("div", { className: "row", style: "margin-top:6px;" }, naHandle, naName, naClient));

  const joinable = (allChans || []).filter(c => c.kind !== "dm");

  chanRow.append(el("span", { className: "muted", textContent: L.joinChannels }));

    const cb = el("input", { type: "checkbox", value: ch.id });
    chanRow.append(el("label", {}, cb, " #" + ch.name));
    chBoxes.push({ ch, cb });
  }
  newAgentBox.append(chanRow);

  const approvedHosts = hosts.filter(h => h.state === "approved");
  const naHost = el("select", {},
    el("option", { value: "", textContent: "-- " + L.noHostAssign + " --" }),
    ...approvedHosts.map(h => el("option", { value: h.id, textContent: h.name }))
  );
  const naMode = el("select", {}, el("option", { value: "direct", textContent: "direct" }), el("option", { value: "compact", textContent: "compact" }));
  const naRootDir = el("input", { placeholder: "root dir (/path)", size: 16 });
  const naApprovals = el("select", {}, el("option", { value: "none", textContent: "approvals: none" }), el("option", { value: "chat", textContent: "approvals: chat" }));
  const naPermMode = el("select", {},
    el("option", { value: "auto", textContent: "auto" }),
    el("option", { value: "acceptEdits", textContent: "acceptEdits" }),
    el("option", { value: "default", textContent: "default" }),
    el("option", { value: "plan", textContent: "plan" }),
    el("option", { value: "bypassPermissions", textContent: "bypassPermissions (!)" })
  );
  const naSandbox = el("input", { type: "checkbox" });
  const naModel = el("input", { placeholder: "model (haiku)", size: 12 });
  const naWModel = el("input", { placeholder: "work model", size: 12 });
  const naWork = el("input", { type: "checkbox" });
  const naSubmit = el("button", { textContent: L.createAgent });
  const naStatus = el("div", { className: "warn grant", style: "display:none;" });

  naSubmit.onclick = async () => {
    naStatus.style.display = "none";
    naStatus.textContent = "";
    const handle = naHandle.value.trim();
    if (!handle) {
      naStatus.textContent = "Handle megadása kötelező";
      naStatus.style.display = "";
      return;
    }

    let created;
    try {
      created = await api("/api/v1/actors", {
        method: "POST",
        body: JSON.stringify({
          kind: "agent",
          handle: handle,
          display_name: naName.value.trim() || undefined,
          role: "member"
        })
      });
    } catch (e) {
      naStatus.textContent = "Hiba az agent létrehozásakor (POST /actors): " + e.message;
      naStatus.style.display = "";
      return;
    }

    for (const { ch, cb } of chBoxes) {
      if (cb.checked) {
        try {
          await api(`/api/v1/channels/${ch.id}/members`, {
            method: "POST",
            body: JSON.stringify({ actor_id: created.actor.id })
          });
        } catch (e) {
          naStatus.textContent = `Hiba a csatornatagság hozzáadásakor (#${ch.name}): ` + e.message;
          naStatus.style.display = "";
          return;
        }
      }
    }

    if (naHost.value) {
      try {
        await api(`/api/v1/agents/${created.actor.id}/host`, {
          method: "PUT",
          body: JSON.stringify({
            host_id: naHost.value,
            client: naClient.value,
            mode: naMode.value,
            root_dir: naRootDir.value.trim(),
            sandbox: naSandbox.checked,
            permission_mode: naPermMode.value,
            approvals: naApprovals.value,

            work_model: naWModel.value.trim(),
            allow_work: naWork.checked
