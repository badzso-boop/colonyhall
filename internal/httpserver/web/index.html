<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Colonyhall (dev)</title>
<style>
  /* Phase 0 developer page. The real UI (React + Vite PWA) arrives in phase 1. */
  :root { --bg:#f4f5f3; --surface:#fff; --fg:#1d211f; --muted:#646b66; --line:#dcdfda; --accent:#a8670f; --agent:#3d5a80; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141715; --surface:#1c201e; --fg:#e6e9e6; --muted:#9aa29c; --line:#303632; --accent:#e0a347; --agent:#93b0d8; color-scheme: dark; } }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.45 system-ui, sans-serif; background:var(--bg); color:var(--fg); }
  header { display:flex; gap:12px; align-items:center; padding:10px 16px; border-bottom:1px solid var(--line); background:var(--surface); flex-wrap:wrap; }
  header b { color:var(--accent); }
  input, button { font:inherit; padding:6px 10px; border:1px solid var(--line); border-radius:6px; background:var(--surface); color:var(--fg); }
  button { cursor:pointer; }
  main { display:grid; grid-template-columns:220px 1fr; height:calc(100vh - 54px); }
  nav { border-right:1px solid var(--line); padding:10px; overflow:auto; }
  nav div { padding:5px 8px; border-radius:6px; cursor:pointer; display:flex; justify-content:space-between; }
  nav div.on { background:var(--surface); font-weight:600; }
  nav .n { color:var(--accent); font-weight:600; }
  section { display:grid; grid-template-rows:1fr auto; min-width:0; }
  #feed { overflow:auto; padding:12px 16px; }
  .msg { padding:6px 0; }
  .who { font-weight:600; } .who.agent { color:var(--agent); } .who.system { color:var(--accent); }
  .at { color:var(--muted); font-size:12px; margin-left:6px; }
  .body { white-space:pre-wrap; overflow-wrap:anywhere; }
  form { display:flex; gap:8px; padding:10px 16px; border-top:1px solid var(--line); }
  form input { flex:1; }
  #status { color:var(--muted); font-size:12px; margin-left:auto; }
  .msg.reply { margin-left:22px; padding-left:10px; border-left:2px solid var(--line); }
  .re { color:var(--muted); font-size:12px; }
  .acts { display:inline-flex; gap:4px; margin-left:8px; }
  .acts button, .chip { padding:0 6px; font-size:12px; border-radius:10px; }
  .chip.mine { border-color:var(--accent); }
  .chips { display:flex; gap:4px; margin-top:2px; flex-wrap:wrap; }
  #replybar { display:none; padding:4px 16px; font-size:12px; color:var(--muted); border-top:1px solid var(--line); }
  #replybar.on { display:flex; gap:8px; align-items:center; }
  .attachments { display:flex; flex-wrap:wrap; gap:8px; margin-top:6px; }
  .attachment-img { max-width:240px; max-height:180px; border-radius:6px; border:1px solid var(--line); object-fit:cover; display:block; cursor:pointer; }
  .attachment-link { display:inline-flex; align-items:center; gap:4px; padding:4px 8px; border:1px solid var(--line); border-radius:6px; background:var(--surface); text-decoration:none; color:var(--fg); font-size:12px; }
  .attachment-link:hover { border-color:var(--accent); }
  .file-chip { display:inline-flex; align-items:center; gap:6px; padding:2px 8px; border:1px solid var(--accent); border-radius:12px; font-size:12px; background:var(--surface); }
  .file-chip button { border:none; background:none; padding:0 2px; cursor:pointer; font-size:11px; color:var(--muted); }
  #attachedFiles { display:none; gap:6px; flex-wrap:wrap; padding:4px 16px; }
  #attachedFiles.on { display:flex; }
  #clipbtn { padding:4px 8px; font-size:14px; }
  #login { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  #login input { width:9em; }
  details summary { cursor:pointer; color:var(--muted); font-size:12px; }
  .dmbox { display:flex; gap:4px; margin-top:8px; } .dmbox input { width:100%; }
  #hostsPanel, #schedPanel, #runsPanel, #wikiPanel, #questionsPanel, #rulesPanel, #leasesPanel { overflow:auto; padding:12px 16px; display:none; }
  #schedPanel.on, #hostsPanel.on, #runsPanel.on, #wikiPanel.on, #questionsPanel.on, #rulesPanel.on, #leasesPanel.on { display:block; } #feed.off { display:none; }
  table.tbl { width:100%; border-collapse:collapse; font-size:13px; margin-top:6px; }
  table.tbl th, table.tbl td { padding:6px 8px; border:1px solid var(--line); text-align:left; }
  table.tbl th { background:var(--bg); font-weight:600; }
  table.tbl td.num, table.tbl th.num { text-align:right; font-variant-numeric:tabular-nums; }
  .card { border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin:0 0 12px; background:var(--surface); }
  .card h3 { margin:0 0 4px; font-size:15px; } .muted { color:var(--muted); font-size:12px; }
  .row { display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin:6px 0; }
  .grant { font-family:ui-monospace, monospace; font-size:12px; }
  .warn { color:#b3261e; } code.code { font-size:16px; letter-spacing:1px; }
  .link-cards { display:flex; flex-direction:column; gap:4px; margin-top:4px; }
  .link-card { display:inline-flex; gap:6px; align-items:center; background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:3px 8px; font-size:12px; width:fit-content; }
  .link-card a { color:var(--accent); text-decoration:none; font-weight:500; }
  .link-card a:hover { text-decoration:underline; }
  .link-card .badge { border:1px solid var(--line); border-radius:4px; padding:1px 5px; font-size:11px; background:var(--bg); }
  #errModal, #appModal { position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; align-items:center; justify-content:center; padding:16px; z-index:10; }
  #errModal.on, #appModal.on { display:flex; }
  #errModal .card, #appModal .card { max-width:720px; width:100%; max-height:80vh; overflow:auto; }
  #errModal pre, #appModal pre { white-space:pre-wrap; overflow-wrap:anywhere; font-size:12px; }
  @media (max-width:640px) { main { grid-template-columns:1fr; grid-template-rows:auto 1fr; height:auto; min-height:calc(100vh - 54px); }
    nav { border-right:0; border-bottom:1px solid var(--line); max-height:28vh; } section { height:calc(72vh - 54px); } }
</style>
</head>
<body>
<header>
  <b>Colonyhall</b>
  <form id="login">
    <input id="handle" autocomplete="username"><input id="password" type="password" autocomplete="current-password">
    <button id="loginbtn"></button>
    <details><summary>token</summary><input id="token" type="password" size="20" autocomplete="off"></details>
  </form>
  <span id="me"></span><button id="runsbtn" hidden>📊</button><button id="schedbtn" hidden>⏰</button><button id="questionsbtn" hidden>❓ Válaszra vár</button><button id="wikibtn" hidden>📖 Wiki</button><button id="rulesbtn" hidden>📜 Szabályok</button><button id="leasesbtn" hidden>🔒 Foglalások</button><button id="hostsbtn" hidden></button><button id="logout" hidden></button>
  <span id="status"></span>
</header>
<main>
  <nav><div id="channels"></div><div class="dmbox"><input id="dmto" placeholder="@handle"><button id="dmbtn">DM</button></div></nav>
  <section>
    <div id="feed"></div>
    <div id="hostsPanel"></div>
    <div id="schedPanel"></div>
    <div id="runsPanel"></div>
    <div id="wikiPanel"></div>
    <div id="questionsPanel"></div>
    <div id="rulesPanel"></div>
    <div id="leasesPanel"></div>
    <div>
      <div id="replybar"><span id="replyto"></span><button id="replycancel">✕</button></div>
      <div id="attachedFiles"></div>
      <form id="send">
        <input type="file" id="fileinput" style="display:none">
        <button type="button" id="clipbtn" title="Fájl csatolása">📎</button>
        <input id="text" autocomplete="off">
        <button></button>
      </form>
    </div>
  </section>
</main>
<div id="errModal"><div class="card"><h3 id="errTitle"></h3><div class="muted" id="errMeta"></div><pre id="errDetail"></pre><button id="errClose">✕</button></div></div>
<div id="appModal"><div class="card"><h3 id="appTitle"></h3><div class="muted" id="appMeta"></div><pre id="appDetail"></pre><div class="row" id="appActions"></div><button id="appClose">✕</button></div></div>
<script>
const I18N = {
  hu: { handle: "név", password: "jelszó", login: "Belépés", logout: "Kilépés", send: "Küldés", message: "Üzenet… (@név megemlít)",
        online: "élő kapcsolat", offline: "nincs kapcsolat", reconnecting: "újracsatlakozás…", reply: "Válasz", replyIn: "Válasz a szálban:", inThread: "a szálban:",
        hosts: "Gépek", chat: "Chat", pair: "Párosítókód", pairHelp: "A gépen futtasd (10 percig érvényes):", revoke: "Visszavonás",
        lastSeen: "utoljára", never: "még soha", roots: "Gyökérmappák", clients: "Kliensek", sandbox: "Sandbox", none: "nincs",
        rejected: "Elutasított engedély", assign: "Agent hozzárendelése", work: "munka", grant: "Mappa engedélyezése",
        read: "olvas", write: "ír", unassign: "Levétel", outside: "a gép gyökérmappáin kívül esik", noHosts: "Még nincs párosított gép.",
        allowUnsandboxed: "sandbox nélkül engedélyezve", yes: "igen", no: "nem", errorDetails: "Hiba részletei",
        runs: "Futások", today: "Ma", last7Days: "Elmúlt 7 nap", period: "Időszak", tokensIn: "In", tokensOut: "Out",
        tokensTotal: "Összes", runsCount: "Futás", errorsCount: "Hiba", recentRuns: "Legutóbbi 20 futás", time: "Idő",
        agent: "Agent", phase: "Fázis", model: "Modell", duration: "Időtartam", status: "Állapot", details: "Részletek",
        noRuns: "Nincs futási adat.",
        approvalDetails: "Részletek", approvalAllow: "Engedélyezem", approvalDeny: "Elutasítom",
        approvalPending: "jóváhagyásra vár", approvalAllowed: "engedélyezve", approvalDenied: "elutasítva", approvalExpired: "lejárt",
        newAgent: "Új agent", createAgent: "Agent létrehozása", joinChannels: "Csatornák:",
        noHostAssign: "gép hozzárendelése később",
        hostModeTokenNote: "Megjegyzés: az agent tokenje gépes (host) módban nem szükséges — az őr automatikusan saját rövid lejáratú tokeneket kér a szervertől.",
        exchange: "Titokcsere", exchangeNotOk: "nem írható",
        dailyBudget: "Napi keret", dailyLimit: "Napi limit", remaining: "hátralévő", resetsAt: "újraindul", noLimit: "nincs korlát", maxSession: "Munkamenet token limit", editLimit: "✏️ limit", enterDailyLimit: "Új napi tokenkeret (0 = nincs korlát):",
        giteaMappings: "Gitea tárak hozzárendelése", noGiteaMappings: "Még nincs Gitea tár hozzárendelve.", addMapping: "Hozzáadás",
        previews: "Előnézetek", noPreviews: "Nincs előnézet.", expires: "Lejárat", stop: "Leállítás",
        agentRules: "Agent szabályok", save: "Mentés", version: "Verzió", history: "Előzmények",
        leases: "Foglalások", release: "Feloldás", noLeases: "Nincs aktív foglalás.", resource: "Erőforrás", holder: "Birtokos", note: "Megjegyzés" },
  en: { handle: "handle", password: "password", login: "Log in", logout: "Log out", send: "Send", message: "Message… (@name to mention)",
        online: "live", offline: "offline", reconnecting: "reconnecting…", reply: "Reply", replyIn: "Replying in thread:", inThread: "in thread:",
        hosts: "Machines", chat: "Chat", pair: "Pairing code", pairHelp: "Run on the machine (valid for 10 minutes):", revoke: "Revoke",
        lastSeen: "last seen", never: "never", roots: "Roots", clients: "Clients", sandbox: "Sandbox", none: "none",
        rejected: "Refused grant", assign: "Assign agent", work: "work", grant: "Grant folder",
        read: "read", write: "write", unassign: "Remove", outside: "outside the machine's roots", noHosts: "No machine paired yet.",
        allowUnsandboxed: "unsandboxed allowed", yes: "yes", no: "no", errorDetails: "Error details",
        runs: "Runs", today: "Today", last7Days: "Last 7 days", period: "Period", tokensIn: "In", tokensOut: "Out",
        tokensTotal: "Total", runsCount: "Runs", errorsCount: "Errors", recentRuns: "Last 20 runs", time: "Time",
        agent: "Agent", phase: "Phase", model: "Model", duration: "Duration", status: "Status", details: "Details",
        noRuns: "No runs recorded.",
        approvalDetails: "Details", approvalAllow: "Allow", approvalDeny: "Deny",
        approvalPending: "pending", approvalAllowed: "allowed", approvalDenied: "denied", approvalExpired: "expired",
        newAgent: "New agent", createAgent: "Create agent", joinChannels: "Channels:",
        noHostAssign: "assign host later",
        hostModeTokenNote: "Note: the agent token is not needed in host mode — the guard requests its own short-lived tokens from the server.",
        exchange: "Secrets exchange", exchangeNotOk: "unwritable",
        dailyBudget: "Daily budget", dailyLimit: "Daily limit", remaining: "remaining", resetsAt: "resets at", noLimit: "no limit", maxSession: "Max session tokens", editLimit: "✏️ limit", enterDailyLimit: "New daily token limit (0 = no limit):",
        giteaMappings: "Gitea repository mappings", noGiteaMappings: "No Gitea repository mappings yet.", addMapping: "Add",
        previews: "Previews", noPreviews: "No previews.", expires: "Expires", stop: "Stop",
        agentRules: "Agent rules", save: "Save", version: "Version", history: "History",
        leases: "Leases", release: "Release", noLeases: "No active leases.", resource: "Resource", holder: "Holder", note: "Note" },
};
const L = I18N[(navigator.language || "hu").slice(0, 2)] || I18N.hu;
const $ = (id) => document.getElementById(id);
$("handle").placeholder = L.handle; $("password").placeholder = L.password; $("loginbtn").textContent = L.login;
$("logout").textContent = L.logout; $("text").placeholder = L.message; document.querySelector("#send button").textContent = L.send;

let token = "", csrf = "", me = null, channels = [], actors = {}, current = null, lastSeq = null, ws = null;
let msgs = new Map(), replyRoot = null;
try { token = localStorage.getItem("colony_token") || ""; } catch {}

// Plain-HTTP pages (e.g. over Tailscale) have no crypto.randomUUID.
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const el = (tag, props = {}, ...kids) => { const e = document.createElement(tag); Object.assign(e, props); e.append(...kids); return e; };
const formatBytes = (bytes) => {
  if (!bytes || bytes < 1024) return (bytes || 0) + " B";
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
  return (bytes / (1024 * 1024)).toFixed(1) + " MB";
};

async function api(path, opts = {}) {
  const headers = Object.assign({}, opts.headers);
  if (!opts.body || !(opts.body instanceof FormData)) {
    if (!headers["Content-Type"]) headers["Content-Type"] = "application/json";
  }
  if (token) headers.Authorization = "Bearer " + token;
  else if (csrf) headers["X-CSRF-Token"] = csrf;
  const res = await fetch(path, { ...opts, headers, credentials: "same-origin" });
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || res.status);
  return res.status === 204 ? null : res.json();
}

function chanLabel(c) {
  if (c.kind !== "dm") return "#" + c.name;
  const others = (c.member_ids || []).filter(id => id !== me.id).map(id => "@" + (actors[id]?.handle || "?"));
  return "✉ " + (others.join(", ") || "@" + me.handle);
}

async function load() {
  const [a, c] = await Promise.all([api("/api/v1/actors"), api("/api/v1/channels")]);
  actors = Object.fromEntries(a.actors.map(x => [x.id, x]));
  channels = c.channels.filter(x => x.is_member);
  renderChannels();
  if (!current && channels.length) await open(channels[0].id);
}

function renderChannels() {
  $("channels").innerHTML = "";
  for (const c of channels) {
    const d = document.createElement("div");
    d.className = c.id === current ? "on" : "";
    d.innerHTML = `<span></span><span class="n">${c.unread > 0 && c.id !== current ? c.unread : ""}</span>`;
    d.firstChild.textContent = chanLabel(c);
    d.onclick = () => open(c.id);
    $("channels").appendChild(d);
  }
}

async function open(id) {
  current = id; setReply(null); clearPendingFiles();
  const r = await api(`/api/v1/channels/${id}/messages?limit=100`);
  msgs = new Map(r.messages.map(m => [m.id, m]));
  renderFeed();
  await api(`/api/v1/channels/${id}/read`, { method: "POST" }).catch(() => {});
  const c = channels.find(x => x.id === id); if (c) c.unread = 0;
  renderChannels();
}

function renderFeed() {
  $("feed").innerHTML = "";
  for (const m of msgs.values()) $("feed").appendChild(renderMsg(m));
  $("feed").scrollTop = $("feed").scrollHeight;
}

function renderMsg(m) {
  const a = actors[m.author_id] || { handle: "?", kind: "human" };
  const div = document.createElement("div");
  div.className = "msg" + (m.thread_root_id ? " reply" : "");
  div.innerHTML = `<div class="re"></div><span class="who ${a.kind}"></span><span class="at"></span>` +
    `<span class="acts"><button data-e="👍">👍</button><button data-e="👎">👎</button><button data-r>${L.reply}</button></span>` +
    `<div class="body"></div><div class="attachments"></div><div class="chips"></div>`;
  if (m.thread_root_id) {
    const root = msgs.get(m.thread_root_id);
    div.querySelector(".re").textContent = "↪ " + L.inThread + " " + (root ? root.body.slice(0, 60) : "…");
  }
  if (m.kind === "system") {
    div.querySelector(".who").className = "who system";
    div.querySelector(".who").textContent = "system";
  } else {
    div.querySelector(".who").textContent = "@" + a.handle;
  }
  div.querySelector(".at").textContent = new Date(m.created_at).toLocaleTimeString();
  // "[error:<id>]" from the guard: details are for humans, shown on demand.
  const ref = /\[error:([0-9a-f-]{36})\]/.exec(m.body);
  const appRef = /\[approval:([0-9a-f-]{36})\]/.exec(m.body);
  let bodyText = m.body;
  if (ref) bodyText = bodyText.replace(ref[0], "").trim();
  if (appRef) bodyText = bodyText.replace(appRef[0], "").trim();
  div.querySelector(".body").textContent = bodyText;
  if (ref && me.kind === "human") {
    const btn = el("button", { textContent: L.errorDetails });
    btn.onclick = () => showError(ref[1]);
    div.querySelector(".body").append(" ", btn);
  }
  if (appRef && me.kind === "human") {
    const appSpan = el("span");
    div.querySelector(".body").append(" ", appSpan);
    renderApprovalInline(appRef[1], appSpan);
  }
  if (m.attachments && m.attachments.length) {
    const attDiv = div.querySelector(".attachments");
    for (const att of m.attachments) {
      const isImg = att.mime && att.mime.startsWith("image/") && !att.mime.includes("svg");
      if (isImg) {
        const a = el("a", { href: `/api/v1/files/${att.id}/content`, target: "_blank", title: `${att.name} (${formatBytes(att.size)})` });
        const img = el("img", { className: "attachment-img", src: `/api/v1/files/${att.id}/content`, alt: att.name });
        a.append(img);
        attDiv.append(a);
      } else {
        const link = el("a", {
          className: "attachment-link",
          href: `/api/v1/files/${att.id}/content`,
          target: "_blank",
          title: `${att.mime}, ${formatBytes(att.size)}`
        }, `📎 ${att.name} (${formatBytes(att.size)})`);
        attDiv.append(link);
      }
    }
  }
  if (m.link_cards && m.link_cards.length > 0) {
    const cardsDiv = el("div", { className: "link-cards" });
    for (const card of m.link_cards) {
      let icon = "🔗";
      if (card.kind === "pull") icon = "🔀";
      else if (card.kind === "issue") icon = "🟢";
      else if (card.kind === "repo") icon = "📦";
      else if (card.kind === "commit") icon = "📝";

      const cardEl = el("div", { className: "link-card" });
      const a = el("a", { href: card.url, target: "_blank", rel: "noopener noreferrer" });
      a.textContent = `${icon} ${card.title || card.url}`;
      cardEl.append(a);

      if (card.state) {
        cardEl.append(el("span", { className: "badge", textContent: card.state }));
      }
      if (card.author) {
        cardEl.append(el("span", { className: "muted", textContent: `@${card.author}` }));
      }
      cardsDiv.append(cardEl);
    }
    div.append(cardsDiv);
  }
  for (const r of m.reactions || []) {
    const chip = document.createElement("button");
    chip.className = "chip" + (r.actor_ids.includes(me.id) ? " mine" : "");
    chip.textContent = r.emoji + " " + r.count;
    chip.title = r.actor_ids.map(id => "@" + (actors[id]?.handle || "?")).join(", ");
    chip.onclick = () => toggleReaction(m, r.emoji);
    div.querySelector(".chips").appendChild(chip);
  }
  div.querySelectorAll("[data-e]").forEach(b => b.onclick = () => toggleReaction(m, b.dataset.e));
  div.querySelector("[data-r]").onclick = () => setReply(m.thread_root_id || m.id);
  return div;
}

async function showError(id) {
  const e = await api(`/api/v1/errors/${id}`).catch(err => { alert(err.message); return null; });
  if (!e) return;
  $("errTitle").textContent = e.summary;
  $("errMeta").textContent = `@${actors[e.agent_id]?.handle || "?"} · ${new Date(e.created_at).toLocaleString()}`;
  $("errDetail").textContent = e.detail;
  $("errModal").className = "on";
}
$("errClose").onclick = () => { $("errModal").className = ""; };

async function showApproval(id) {
  const app = await api(`/api/v1/approvals/${id}`).catch(err => { alert(err.message); return null; });
  if (!app) return;
  $("appTitle").textContent = "🔐 " + app.tool_name;
  $("appMeta").textContent = `${app.state} · ${new Date(app.created_at).toLocaleString()}`;
  $("appDetail").textContent = app.input || "";
  const act = $("appActions");
  act.innerHTML = "";
  if (app.state === "pending") {
    const allowBtn = el("button", { textContent: L.approvalAllow, style: "color:#137333;font-weight:bold;" });
    allowBtn.onclick = async () => {
      await api(`/api/v1/approvals/${id}`, { method: "POST", body: JSON.stringify({ decision: "allow" }) }).catch(e => alert(e.message));
      $("appModal").className = "";
      reloadCurrentFeed();
    };
    const denyBtn = el("button", { textContent: L.approvalDeny, style: "color:#b3261e;" });
    denyBtn.onclick = async () => {
      await api(`/api/v1/approvals/${id}`, { method: "POST", body: JSON.stringify({ decision: "deny" }) }).catch(e => alert(e.message));
      $("appModal").className = "";
      reloadCurrentFeed();
    };
    act.append(allowBtn, denyBtn);
  }
  $("appModal").className = "on";
}

async function renderApprovalInline(id, span) {
  const app = await api(`/api/v1/approvals/${id}`).catch(() => null);
  if (!app) return;
  span.innerHTML = "";
  const btn = el("button", { textContent: L.approvalDetails });
  btn.onclick = () => showApproval(id);
  span.append(btn);
  if (app.state === "pending") {
    const allowBtn = el("button", { textContent: L.approvalAllow, style: "color:#137333;font-weight:bold;margin-left:4px;" });
    allowBtn.onclick = async () => {
      await api(`/api/v1/approvals/${id}`, { method: "POST", body: JSON.stringify({ decision: "allow" }) }).catch(e => alert(e.message));
      renderApprovalInline(id, span);
    };
    const denyBtn = el("button", { textContent: L.approvalDeny, style: "color:#b3261e;margin-left:4px;" });
    denyBtn.onclick = async () => {
      await api(`/api/v1/approvals/${id}`, { method: "POST", body: JSON.stringify({ decision: "deny" }) }).catch(e => alert(e.message));
      renderApprovalInline(id, span);
    };
    span.append(" ", allowBtn, " ", denyBtn);
  } else {
    const labels = {
      allowed: L.approvalAllowed,
      denied: L.approvalDenied,
      expired: L.approvalExpired
    };
    const tag = el("span", { className: "muted", style: "margin-left:6px;", textContent: labels[app.state] || app.state });
    span.append(tag);
  }
}

async function reloadCurrentFeed() {
  if (!current) return;
  const r = await api(`/api/v1/channels/${current}/messages?limit=100`);
  msgs = new Map(r.messages.map(m => [m.id, m]));
  const keep = $("feed").scrollTop; renderFeed(); $("feed").scrollTop = keep;
}

async function refreshMessage(id) {
  // Reactions changed: reload the open channel (cheap at dev-page scale).
  if (!msgs.has(id)) return;
  await reloadCurrentFeed();
}

function connectWS() {
  const url = (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws/ui";
  ws = new WebSocket(url);
  ws.onopen = () => ws.send(JSON.stringify(token ? { type: "hello", token, last_seq: lastSeq } : { type: "hello", last_seq: lastSeq }));
  ws.onmessage = async (ev) => {
    const f = JSON.parse(ev.data);
    if (f.type === "welcome") { if (lastSeq === null) lastSeq = f.head; $("status").textContent = L.online; }
    if (f.type === "resync_required") { lastSeq = f.head; await load(); }
    if (f.type !== "event") return;
    lastSeq = f.seq;
    const d = f.data || {};
    if (f.event_type === "message.created") {
      if (d.channel_id === current) {
        const m = { id: d.message_id, author_id: d.author_id, body: d.body, created_at: d.created_at, thread_root_id: d.thread_root_id, reactions: [], attachments: d.attachments || [] };
        msgs.set(m.id, m); $("feed").appendChild(renderMsg(m)); $("feed").scrollTop = $("feed").scrollHeight;
        api(`/api/v1/channels/${current}/read`, { method: "POST" }).catch(() => {});
      } else {
        const c = channels.find(x => x.id === d.channel_id);
        if (c) { c.unread++; renderChannels(); } else await load();
      }
    } else if (f.event_type.startsWith("reaction.") && d.channel_id === current) {
      await refreshMessage(d.message_id);
    } else if (f.event_type.startsWith("approval.")) {
      await reloadCurrentFeed();
    } else if (f.event_type === "actor.created" || f.event_type.startsWith("channel.")) {
      await load();
    } else if (f.event_type.startsWith("host.") && hostsOpen) {
      renderHosts();
    } else if (f.event_type === "run.reported" && openPanel === "runs") {
      renderRuns();
    }
  };
  ws.onclose = () => { $("status").textContent = L.reconnecting; setTimeout(connectWS, 2000); };
}

// One side panel at a time (machines, schedules, runs, wiki); the chat

let openPanel = null;
function togglePanel(name) {
  openPanel = openPanel === name ? null : name;
  for (const p of ["hosts", "sched", "runs", "wiki", "questions", "rules", "leases"]) $(p + "Panel").className = openPanel === p ? "on" : "";
  $("feed").className = openPanel ? "off" : "";
  $("hostsbtn").textContent = openPanel === "hosts" ? L.chat : L.hosts;
  $("wikibtn").textContent = openPanel === "wiki" ? "💬 Chat" : "📖 Wiki";
  $("questionsbtn").textContent = openPanel === "questions" ? "💬 Chat" : "❓ Válaszra vár";
  $("rulesbtn").textContent = openPanel === "rules" ? "💬 Chat" : "📜 " + L.agentRules;
  $("leasesbtn").textContent = openPanel === "leases" ? "💬 Chat" : "🔒 " + L.leases;
  hostsOpen = openPanel === "hosts"; schedOpen = openPanel === "sched";
  return openPanel === name;
}

      const actCell = el("td");
      if (p.state === "requested" || p.state === "running") {
        const stopBtn = el("button", { textContent: L.stop });
        stopBtn.onclick = async () => {
          await api(`/api/v1/previews/${p.id}/stop`, { method: "POST" }).catch(e => alert(e.message));
          renderHosts();
        };
        actCell.append(stopBtn);
      }
      tr.append(
        el("td", { textContent: "@" + agentHandle }),
        el("td", { textContent: p.name }),
        linkCell,
        el("td", { textContent: p.state }),
        el("td", { textContent: exp }),
        actCell
      );
      tbl.append(tr);
    }
    prevBox.append(tbl);
  }
  panel.append(prevBox);
}

// /schedule 2026-10-16 01:00 text   one-off, local time (Europe/Budapest)
// /daily 01:00 text                  every day
// /cron "0 1 * * 1-5" text           any 5-field cron expression
function parseScheduleCommand(body) {
  let m = /^\/schedule\s+(\d{4}[-.]\d{2}[-.]\d{2}\.?)\s+(\d{1,2}:\d{2})\s+([\s\S]+)$/.exec(body);
  if (m) return { at: m[1].replace(/\./g, "-").replace(/-$/, "") + " " + m[2].padStart(5, "0"), body: m[3] };
  m = /^\/daily\s+(\d{1,2}):(\d{2})\s+([\s\S]+)$/.exec(body);
  if (m) return { cron: `${+m[2]} ${+m[1]} * * *`, body: m[3] };
  m = /^\/cron\s+"([^"]+)"\s+([\s\S]+)$/.exec(body);
  if (m) return { cron: m[1], body: m[2] };
  return null;
}

async function renderQuestions(panel) {
  panel.innerHTML = "";
  panel.append(el("h3", { textContent: "❓ Válaszra vár (Open Questions)" }));

  let list = [];
  try {
    const [resOpen, resEsc] = await Promise.all([
      api("/api/v1/questions?state=open"),
      api("/api/v1/questions?state=escalated"),
    ]);
    const seen = new Set();
    for (const q of (resOpen.questions || []).concat(resEsc.questions || [])) {
      if (!seen.has(q.id) && (q.to_human || q.state === "escalated")) {
        seen.add(q.id);
        list.push(q);
      }
    }
  } catch (err) {
    panel.append(el("div", { className: "warn", textContent: err.message }));
    return;
  }

  if (!list.length) {
    panel.append(el("p", { className: "muted", textContent: "Nincs válaszra váró kérdés." }));
    return;
  }

  for (const q of list) {
    const c = el("div", { className: "card" });
    const badge = el("span", {
      className: q.state === "escalated" ? "warn" : "muted",
      textContent: ` [${q.state.toUpperCase()}]`
    });
    const ch = channels.find(x => x.id === q.channel_id);
    const header = el("div", {},
      el("b", { textContent: q.formatted_number }),
      badge,
      el("span", { className: "muted", textContent: ` · @${q.asked_by_handle} · ${ch ? chanLabel(ch) : "?"} · ${new Date(q.created_at).toLocaleString()}` })
    );
    c.append(header);

    const targetDesc = q.state === "escalated" ? "Eszkalálva embereknek (Escalated to humans)" : (q.to_actor_handle ? `@${q.to_actor_handle}` : "Emberek (Humans)");
    c.append(el("div", { className: "muted", textContent: `Címzett: ${targetDesc}` }));
    c.append(el("div", { className: "body", style: "font-weight: 500; margin: 8px 0;", textContent: q.text }));

    if (q.options && q.options.length > 0) {
      const optRow = el("div", { style: "display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px;" });
      for (const opt of q.options) {
        const btn = el("button", { textContent: opt });
        btn.onclick = async () => {
          try {
            await api(`/api/v1/questions/${encodeURIComponent(q.id)}/answer`, {
              method: "POST",
              body: JSON.stringify({ answer: opt }),
            });
            renderQuestions(panel);
            await load();
          } catch (e) {
            alert(e.message);
          }
        };
        optRow.append(btn);
      }
      c.append(optRow);
    }

    const form = el("form", { style: "display: flex; gap: 8px; margin-top: 6px;" });
    const input = el("input", { placeholder: "Szöveges válasz...", style: "flex: 1;" });
    const sendBtn = el("button", { type: "submit", textContent: "Válasz" });
    form.onsubmit = async (e) => {
      e.preventDefault();
      const ans = input.value.trim();
      if (!ans) return;
      try {
        await api(`/api/v1/questions/${encodeURIComponent(q.id)}/answer`, {
          method: "POST",
          body: JSON.stringify({ answer: ans }),
        });
        renderQuestions(panel);
        await load();
      } catch (err) {
        alert(err.message);
      }
    };
    form.append(input, sendBtn);
    c.append(form);

    panel.append(c);
  }
}

$("runsbtn").onclick = () => { if (!togglePanel("runs")) return; renderRuns(); };

async function renderRuns() {
  const panel = $("runsPanel");
  panel.innerHTML = "";
  const [{ usage }, { runs: runList }, hostsRes] = await Promise.all([
    api("/api/v1/usage?days=7"),
    api("/api/v1/runs?limit=20"),
    api("/api/v1/hosts").catch(() => ({ hosts: [] }))
  ]).catch(err => {
    panel.append(el("div", { className: "warn", textContent: err.message }));
    return [{}, {}, {}];
  });
  if (!usage || !runList) return;

  const agentLimits = {};
  for (const h of hostsRes?.hosts || []) {
    for (const a of h.agents || []) {
      agentLimits[a.agent_id] = {
        limit: a.daily_token_limit || 0,
        maxSession: a.max_session_tokens || 150000
      };
    }
  }

  const todayStr = new Intl.DateTimeFormat("en-CA", { timeZone: "Europe/Budapest" }).format(new Date());

  const byAgent = {};
  for (const u of usage) {
    if (!byAgent[u.agent_id]) {
      byAgent[u.agent_id] = {
        today: { in: 0, out: 0, total: 0, runs: 0, errors: 0 },
        last7: { in: 0, out: 0, total: 0, runs: 0, errors: 0 }
      };
    }
    const a = byAgent[u.agent_id];
    a.last7.in += u.input_tokens;
    a.last7.out += u.output_tokens;
    a.last7.total += u.total_tokens;
    a.last7.runs += u.run_count;
    a.last7.errors += u.error_count;
    if (u.day === todayStr) {
      a.today.in += u.input_tokens;
      a.today.out += u.output_tokens;
      a.today.total += u.total_tokens;
      a.today.runs += u.run_count;
      a.today.errors += u.error_count;
    }
  }

  for (const id in agentLimits) {
    if (!byAgent[id]) {
      byAgent[id] = {
        today: { in: 0, out: 0, total: 0, runs: 0, errors: 0 },
        last7: { in: 0, out: 0, total: 0, runs: 0, errors: 0 }
      };
    }
  }

  const agentIDs = Object.keys(byAgent);
  if (agentIDs.length === 0) {
    panel.append(el("div", { className: "card muted", textContent: L.noRuns }));
  } else {
    for (const id of agentIDs) {
      const data = byAgent[id];
      const card = el("div", { className: "card" });
      const handle = actors[id]?.handle ? "@" + actors[id].handle : id;
      card.append(el("h3", { textContent: handle }));

      const limInfo = agentLimits[id];
      if (limInfo && limInfo.limit > 0) {
        const used = data.today.total;
        const remaining = Math.max(0, limInfo.limit - used);
        card.append(el("div", { className: "muted grant" },
          `${L.dailyBudget}: ${limInfo.limit.toLocaleString()} · ${L.today}: ${used.toLocaleString()} · ${L.remaining}: ${remaining.toLocaleString()} · ${L.resetsAt}: 00:00 (Europe/Budapest)`
        ));
      } else if (limInfo) {
        card.append(el("div", { className: "muted grant" },
          `${L.dailyBudget}: ${L.noLimit}`
        ));
      }

      const table = el("table", { className: "tbl" });
      const thead = el("thead", {},
        el("tr", {},
          el("th", { textContent: L.period }),
          el("th", { textContent: L.tokensIn, className: "num" }),
          el("th", { textContent: L.tokensOut, className: "num" }),
          el("th", { textContent: L.tokensTotal, className: "num" }),
          el("th", { textContent: L.runsCount, className: "num" }),
          el("th", { textContent: L.errorsCount, className: "num" })
        )
      );
      const tbody = el("tbody", {},
        el("tr", {},
          el("td", { textContent: L.today }),
          el("td", { textContent: String(data.today.in), className: "num" }),
          el("td", { textContent: String(data.today.out), className: "num" }),
          el("td", { textContent: String(data.today.total), className: "num" }),
          el("td", { textContent: String(data.today.runs), className: "num" }),
          el("td", { textContent: String(data.today.errors), className: "num" })
        ),
        el("tr", {},
          el("td", { textContent: L.last7Days }),
          el("td", { textContent: String(data.last7.in), className: "num" }),
          el("td", { textContent: String(data.last7.out), className: "num" }),
          el("td", { textContent: String(data.last7.total), className: "num" }),
          el("td", { textContent: String(data.last7.runs), className: "num" }),
          el("td", { textContent: String(data.last7.errors), className: "num" })
        )
      );
      table.append(thead, tbody);
      card.append(table);
      panel.append(card);
    }
  }

  const runsCard = el("div", { className: "card" });
  runsCard.append(el("h3", { textContent: L.recentRuns }));
  if (runList.length === 0) {
    runsCard.append(el("div", { className: "muted", textContent: L.noRuns }));
  } else {
    const table = el("table", { className: "tbl" });
    const thead = el("thead", {},
      el("tr", {},
        el("th", { textContent: L.time }),
        el("th", { textContent: L.agent }),
        el("th", { textContent: L.phase }),
        el("th", { textContent: L.model }),
        el("th", { textContent: L.tokensTotal, className: "num" }),
        el("th", { textContent: L.duration, className: "num" }),
        el("th", { textContent: L.status }),
        el("th", { textContent: L.details })
      )
    );
    const tbody = el("tbody", {});
    for (const r of runList) {
      const handle = actors[r.agent_id]?.handle ? "@" + actors[r.agent_id].handle : r.agent_id;
      const totalTokens = r.input_tokens + r.output_tokens + r.cache_read_tokens + r.cache_write_tokens;
      const durSec = (r.duration_ms / 1000).toFixed(1) + "s";
      const tr = el("tr", {},
        el("td", { textContent: new Date(r.created_at).toLocaleString() }),
        el("td", { textContent: handle }),
        el("td", { textContent: r.phase }),
        el("td", { textContent: r.model }),
        el("td", { textContent: String(totalTokens), className: "num" }),
        el("td", { textContent: durSec, className: "num" }),
        el("td", { textContent: r.status })
      );
      const actionTd = el("td", {});
      if (r.error_id) {
        const btn = el("button", { textContent: L.errorDetails });
        btn.onclick = () => showError(r.error_id);
        actionTd.append(btn);
      } else {
        actionTd.append(el("span", { className: "muted", textContent: "-" }));
      }
      tr.append(actionTd);
      tbody.append(tr);
    }
    table.append(thead, tbody);
    runsCard.append(table);
  }
  panel.append(runsCard);
}

async function renderWikiIndex(q = wikiQuery) {

  searchInput.onkeydown = (e) => { if (e.key === "Enter") renderWikiIndex(searchInput.value.trim()); };

  const newBtn = el("button", { textContent: "+ Új oldal / New page" });
  const newForm = el("div", { style: "display:none; margin-top:8px;" });
  const newTitle = el("input", { placeholder: "Cím (Title)", style: "width:100%; margin-bottom:6px;" });
  const newTags = el("input", { placeholder: "Címkék vesszővel (tags, comma-separated)", style: "width:100%; margin-bottom:6px;" });
  const newBody = el("textarea", { placeholder: "Törzs (Body)...", style: "width:100%; height:120px; font-family:inherit; margin-bottom:6px;" });

    const tags = newTags.value.split(",").map(t => t.trim()).filter(Boolean);
    const p = await api("/api/v1/wiki", {
      method: "POST",
      body: JSON.stringify({ title, body, tags })
    }).catch(err => { alert(err.message); return null; });
    if (p) renderWikiPage(p.slug);
  };
  newForm.append(newTitle, newTags, newBody, saveNew);
  newBtn.onclick = () => {
    newForm.style.display = newForm.style.display === "none" ? "block" : "none";
  };

  top.append(el("div", { className: "row" }, searchInput, searchBtn, newBtn), newForm);
  panel.append(top);

  const decBox = el("div", { className: "card", style: "margin-bottom:12px;" });
  decBox.append(
    el("div", { className: "row", style: "justify-content:space-between; align-items:center;" },
      el("h3", { style: "margin:0;", textContent: "⚖️ Döntések (Decisions)" }),
      el("button", { textContent: "Döntések wiki oldal", onclick: () => renderWikiPage("dontesek") })
    )
  );
  const decRes = await api("/api/v1/decisions?limit=5").catch(() => null);
  if (decRes && decRes.decisions && decRes.decisions.length > 0) {
    const list = el("div", { style: "margin-top:8px; display:flex; flex-direction:column; gap:6px;" });
    for (const d of decRes.decisions) {
      const item = el("div", { style: "font-size:13px;" },
        el("strong", { textContent: d.formatted_number + ": " }),
        el("span", { textContent: d.text }),
        d.superseded_by ? el("span", { className: "badge warn", style: "margin-left:6px;", textContent: "felülírva: D-" + d.superseded_by }) : null,
        el("div", { className: "muted", style: "font-size:11px;", textContent: "Indok: " + d.rationale })
      );
      list.append(item);
    }
    decBox.append(list);
  } else {
    decBox.append(el("p", { className: "muted", style: "margin-top:6px;", textContent: "Nincs még rögzített döntés." }));
  }
  panel.append(decBox);

  const res = await api(`/api/v1/wiki?q=${encodeURIComponent(q)}&deleted=1`).catch(err => {
    panel.append(el("div", { className: "warn", textContent: err.message }));
    return null;
  });
  if (!res) return;

  if (!res.pages || res.pages.length === 0) {
    panel.append(el("p", { className: "muted", textContent: "Nincs megjeleníthető wiki oldal (no pages found)." }));
    return;
  }

  for (const p of res.pages) {
    const card = el("div", { className: "card", style: "cursor:pointer;" });
    const title = el("h3", { textContent: p.title });
    let metaText = `slug: ${p.slug} · frissítve: ${new Date(p.updated_at).toLocaleString()}`;
    if (p.deleted_at) {
      metaText += " · [TÖRÖLT/DELETED]";
    }
    if (p.tags && p.tags.length > 0) {
      metaText += " · címkék: " + p.tags.join(", ");
    }
    const meta = el("div", { className: "muted", textContent: metaText });
    const exc = el("div", { className: "body", style: "color:var(--muted); margin-top:4px;", textContent: p.excerpt });
    card.append(title, meta, exc);
    card.onclick = () => renderWikiPage(p.slug);
    panel.append(card);
  }
}

async function renderWikiPage(slug) {
  const panel = $("wikiPanel");
  panel.innerHTML = "";

  const page = await api(`/api/v1/wiki/${encodeURIComponent(slug)}`).catch(err => {
    panel.append(el("div", { className: "warn", textContent: err.message }));
    const back = el("button", { textContent: "← Vissza az indexhez (Back)" });
    back.onclick = () => renderWikiIndex();
    panel.append(back);
    return null;
  });
  if (!page) return;

  const top = el("div", { className: "row" });
  const back = el("button", { textContent: "← Index" });
  back.onclick = () => renderWikiIndex();
  top.append(back);

  if (me.kind === "human") {
    if (page.deleted_at) {
      const restBtn = el("button", { textContent: "♻ Visszaállítás (Restore)" });
      restBtn.onclick = async () => {
        const res = await api(`/api/v1/wiki/${encodeURIComponent(slug)}/restore`, { method: "POST" }).catch(e => alert(e.message));
        if (res) renderWikiPage(slug);
      };
      top.append(restBtn);
    } else {
      const delBtn = el("button", { textContent: "🗑 Törlés (Delete)" });
      delBtn.onclick = async () => {
        if (confirm(`Biztosan törlöd a(z) "${page.title}" oldalt?`)) {
          await api(`/api/v1/wiki/${encodeURIComponent(slug)}`, { method: "DELETE" }).catch(e => alert(e.message));
          renderWikiIndex();
        }
      };
      top.append(delBtn);
    }
  }

  const card = el("div", { className: "card" });
  card.append(top);
  card.append(el("h2", { textContent: page.title, style: "margin:8px 0 4px;" }));
  const creator = actors[page.created_by]?.handle || "?";
  let metaText = `slug: ${page.slug} · rev: ${page.rev} · szerző: @${creator} · módosítva: ${new Date(page.updated_at).toLocaleString()}`;
  if (page.tags && page.tags.length > 0) {
    metaText += " · címkék: " + page.tags.join(", ");
  }
  if (page.deleted_at) {
    metaText += ` · [TÖRÖLVE: ${new Date(page.deleted_at).toLocaleString()}]`;
  }
  card.append(el("div", { className: "muted", style: "margin-bottom:12px;", textContent: metaText }));

  // Plain-text renderelés sortörésekkel
  const bodyEl = el("div", {
    style: "white-space:pre-wrap; font-family:inherit; padding:10px; background:var(--bg); border-radius:6px; margin-bottom:16px; overflow-wrap:anywhere;",
    textContent: page.body
  });
  card.append(bodyEl);

  // Append box (everyone)
  if (!page.deleted_at) {
    const appBox = el("details", { className: "card", style: "margin-top:12px;" });
    const appSummary = el("summary", { textContent: "Hozzáfűzés (Append)" });
    const appArea = el("textarea", { placeholder: "Hozzáfűzendő markdown szöveg...", style: "width:100%; height:80px; font-family:inherit; margin:8px 0;" });
    const appBtn = el("button", { textContent: "Hozzáfűzés küldése (Append)" });
    appBtn.onclick = async () => {
      const text = appArea.value.trim();
      if (!text) return;
      const res = await api(`/api/v1/wiki/${encodeURIComponent(slug)}/append`, {
        method: "POST",
        body: JSON.stringify({ text })
      }).catch(e => alert(e.message));
      if (res) renderWikiPage(slug);
    };
    appBox.append(appSummary, appArea, appBtn);
    card.append(appBox);
  }

  // Human edit box
  if (me.kind === "human" && !page.deleted_at) {
    const editBox = el("details", { className: "card", style: "margin-top:12px;" });
    const editSummary = el("summary", { textContent: "Oldal szerkesztése (Edit - humans only)" });
    const editTitle = el("input", { value: page.title, placeholder: "Cím", style: "width:100%; margin:8px 0 4px;" });
    const editTags = el("input", { value: page.tags ? page.tags.join(", ") : "", placeholder: "Címkék", style: "width:100%; margin-bottom:4px;" });
    const editArea = el("textarea", { value: page.body, style: "width:100%; height:150px; font-family:inherit; margin-bottom:8px;" });
    const editBtn = el("button", { textContent: "Mentés (Save revision)" });
    editBtn.onclick = async () => {
      const newTitle = editTitle.value.trim();
      const newBody = editArea.value.trim();
      if (!newBody) { alert("Body cannot be empty"); return; }
      const tags = editTags.value.split(",").map(t => t.trim()).filter(Boolean);
      const res = await api(`/api/v1/wiki/${encodeURIComponent(slug)}`, {
        method: "PUT",
        body: JSON.stringify({
          base_rev: page.rev,
          body: newBody,
          title: newTitle || page.title,
          tags: tags
        })
      }).catch(e => alert(e.message));
      if (res) renderWikiPage(res.slug);
    };
    editBox.append(editSummary, editTitle, editTags, editArea, editBtn);
    card.append(editBox);
  }

  panel.append(card);
}

// --- Agent rules -------------------------------------------------------------
$("rulesbtn").onclick = () => { if (!togglePanel("rules")) return; renderAgentRules(); };

async function renderAgentRules() {
  const panel = $("rulesPanel");
  panel.innerHTML = "";
  const card = el("div", { className: "card" });
  card.append(el("h3", { textContent: L.agentRules }));

  let rules;
  try {
    rules = await api("/api/v1/agent-rules");
  } catch (err) {
    panel.append(el("div", { className: "warn", textContent: err.message || "Error loading rules" }));
    return;
  }

  const verText = rules.version === 0 ? "0 (" + (L.agentRules === "Agent szabályok" ? "beépített" : "built-in") + ")" : String(rules.version);
  const verInfo = el("div", { className: "muted", textContent: `${L.version}: ${verText}` });
  card.append(verInfo);

  const ta = el("textarea", { style: "width:100%;height:320px;font-family:monospace;margin:8px 0;font-size:12px;box-sizing:border-box;" });
  ta.value = rules.text;
  card.append(ta);

  if (me.kind === "human" && (me.role === "owner" || me.role === "admin")) {
    const saveBtn = el("button", { textContent: L.save });
    saveBtn.onclick = async () => {
      saveBtn.disabled = true;
      try {
        await api("/api/v1/agent-rules", {
          method: "PUT",
          body: JSON.stringify({ text: ta.value })
        });
        await renderAgentRules();
      } catch (err) {
        alert(err.message || "Error saving rules");
      } finally {
        saveBtn.disabled = false;
      }
    };
    card.append(el("div", { className: "row" }, saveBtn));
  }

  if (rules.history && rules.history.length > 0) {
    const histCard = el("div", { style: "margin-top:16px;" });
    histCard.append(el("h4", { textContent: L.history }));
    const tbl = el("table", { className: "tbl" });
    tbl.append(el("tr", {}, el("th", { textContent: L.version }), el("th", { textContent: L.time }), el("th", { textContent: "" })));
    for (const h of rules.history) {
      const viewBtn = el("button", { textContent: `v${h.version}` });
      viewBtn.onclick = async () => {
        try {
          const vData = await api(`/api/v1/agent-rules/${h.version}`);
          ta.value = vData.text;
          verInfo.textContent = `${L.version}: ${vData.version} (${new Date(vData.created_at).toLocaleString()})`;
        } catch (err) {
          alert(err.message || "Error loading version");
        }
      };
      tbl.append(el("tr", {},
        el("td", { textContent: `v${h.version}` }),
        el("td", { textContent: h.created_at ? new Date(h.created_at).toLocaleString() : "" }),
        el("td", {}, viewBtn)
      ));
    }
    histCard.append(tbl);
    card.append(histCard);
  }

  panel.append(card);
}

// --- Leases ------------------------------------------------------------------
$("leasesbtn").onclick = () => { if (!togglePanel("leases")) return; renderLeases(); };

async function renderLeases() {
  const panel = $("leasesPanel");
  panel.innerHTML = "";
  const card = el("div", { className: "card" });
  card.append(el("h3", { textContent: "🔒 " + L.leases }));

  let data;
  try {
    data = await api("/api/v1/leases");
  } catch (err) {
    panel.append(el("div", { className: "warn", textContent: err.message || "Error loading leases" }));
    return;
  }

  const leases = data.leases || [];
  if (leases.length === 0) {
    card.append(el("p", { className: "muted", textContent: L.noLeases }));
    panel.append(card);
    return;
  }

  const tbl = el("table", { className: "tbl" });
  tbl.append(el("tr", {},
    el("th", { textContent: L.resource }),
    el("th", { textContent: L.holder }),
    el("th", { textContent: L.expires }),
    el("th", { textContent: L.note }),
    el("th", { textContent: "" })
  ));

  for (const l of leases) {
    const relBtn = el("button", { textContent: L.release });
    relBtn.onclick = async () => {
      relBtn.disabled = true;
      try {
        await api(`/api/v1/leases/${l.id}/release`, { method: "POST" });
        await renderLeases();
      } catch (err) {
        alert(err.message || "Error releasing lease");
        relBtn.disabled = false;
      }
    };

    tbl.append(el("tr", {},
      el("td", { style: "font-family:monospace;font-weight:600;", textContent: l.resource }),
      el("td", { textContent: "@" + (l.holder_handle || l.holder_id) }),
      el("td", { textContent: l.expires_at ? new Date(l.expires_at).toLocaleTimeString() : "" }),
      el("td", { textContent: l.note || "" }),
      el("td", {}, relBtn)
    ));
  }

  card.append(tbl);
  panel.append(card);
}

let pendingFiles = [];

function renderAttachedFiles() {
  const container = $("attachedFiles");
  container.innerHTML = "";
  if (pendingFiles.length === 0) {
    container.className = "";
    return;
  }
  container.className = "on";
  for (const f of pendingFiles) {
    const chip = el("span", { className: "file-chip" });
    chip.append(`📎 ${f.name} (${formatBytes(f.size)})`);
    const rm = el("button", { textContent: "✕", title: "Eltávolítás" });
    rm.onclick = () => {
      pendingFiles = pendingFiles.filter(x => x.id !== f.id);
      renderAttachedFiles();
    };
    chip.append(rm);
    container.append(chip);
  }
}

function clearPendingFiles() {
  pendingFiles = [];
  renderAttachedFiles();
}

$("clipbtn").onclick = () => {
  if (!current) return;
  $("fileinput").value = "";
  $("fileinput").click();
};

$("fileinput").onchange = async () => {
  const file = $("fileinput").files[0];
  if (!file || !current) return;
  const fd = new FormData();
  fd.append("file", file, file.name);
  try {
    const uploaded = await api(`/api/v1/channels/${current}/files`, { method: "POST", body: fd });
    if (uploaded) {
      pendingFiles.push(uploaded);
      renderAttachedFiles();
    }
  } catch (err) {
    alert("Feltöltési hiba: " + err.message);
  }
};

$("send").onsubmit = async (e) => {
  e.preventDefault();
  let body = $("text").value.trim();
  if (!body && pendingFiles.length === 0) return;
  if (!current) return;
  $("text").value = "";
  if (!body && pendingFiles.length > 0) {
    body = pendingFiles.map(f => f.name).join(", ");
  }
  if (/^\/(schedule|daily|cron)\b/.test(body)) {
    const cmd = parseScheduleCommand(body);
    if (!cmd) { note('⏰ ?  /schedule 2026-10-16 01:00 …  ·  /daily 01:00 …  ·  /cron "0 1 * * *" …'); return; }
    const req = { channel_id: current, body: cmd.body, at: cmd.at, cron: cmd.cron };
    if (replyRoot) req.thread_root_id = replyRoot;
    const s = await api("/api/v1/schedules", { method: "POST", body: JSON.stringify(req) }).catch(err => { note("⏰ " + err.message); return null; });
    if (s) note(`⏰ ${new Date(s.next_run_at).toLocaleString()}${s.cron ? " (" + s.cron + ")" : ""}: ${s.body}`);
    return;
  }
  const ansMatch = /^\/answer\s+([a-zA-Z0-9_-]+)\s+([\s\S]+)$/.exec(body);
  if (ansMatch) {
    const qRef = ansMatch[1];
    const ansText = ansMatch[2].trim();
    const res = await api(`/api/v1/questions/${encodeURIComponent(qRef)}/answer`, {
      method: "POST",
      body: JSON.stringify({ answer: ansText }),
    }).catch(err => { note("❓ " + err.message); return null; });
    if (res) {
      note(`❓ ${res.formatted_number} válasz elküldve: ${res.answer}`);
      await load();
    }
    return;
  }
  const fileIds = pendingFiles.map(f => f.id);
  clearPendingFiles();
  const req = { body, client_msg_id: uid() };
  if (fileIds.length > 0) req.file_ids = fileIds;
  if (replyRoot) req.thread_root_id = replyRoot;
  await api(`/api/v1/channels/${current}/messages`, { method: "POST", body: JSON.stringify(req) }).catch(err => alert(err.message));
};

$("status").textContent = L.offline;
start().catch(() => {});
</script>
